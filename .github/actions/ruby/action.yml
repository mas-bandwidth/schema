name: Ruby pins
description: >
  Puts the Ruby leg's pins make/ruby-toolchain.mk names at dist/: CRuby
  RUBY_FLOOR_VERSION and RUBY_CURRENT_VERSION, each built from its
  ruby-lang.org source tarball by `make dist-ruby`, which refuses any tarball
  whose sha256 is not the pin, and RuboCop, Steep and RBS installed into each
  interpreter from make/ruby-gems.lock. The build is cached under a key
  naming every version, every sha256, the lock, the OS and the architecture,
  so only the first run per runner image pays for it. The cached tree is
  checked against the pins before it is used. Needs a C compiler, make and the
  standard library headers on the runner.
runs:
  using: composite
  steps:
    - name: the Ruby pins
      id: pin
      shell: bash
      run: |
        set -euo pipefail
        floor=$(sed -n 's/^RUBY_FLOOR_VERSION *:= *//p' make/ruby-toolchain.mk)
        current=$(sed -n 's/^RUBY_CURRENT_VERSION *:= *//p' make/ruby-toolchain.mk)
        sums=$(sed -n 's/^RUBY_SHA256_[0-9.]* *:= *//p' make/ruby-toolchain.mk | tr '\n' '-')
        lock=$(shasum -a 256 make/ruby-gems.lock | cut -c1-16)
        echo "floor=$floor" >> "$GITHUB_OUTPUT"
        echo "current=$current" >> "$GITHUB_OUTPUT"
        # The built CRuby and its scripts carry the absolute dist/ path they
        # were built under, so the key names the workspace: a fleet runner's
        # workspace differs from a hosted one's and from the next runner's.
        ws=$(printf %s "$GITHUB_WORKSPACE" | shasum -a 256 | cut -c1-12)
        echo "key=ruby-$floor-$current-$(echo "$sums" | shasum -a 256 | cut -c1-16)-$lock-$ws" >> "$GITHUB_OUTPUT"
    # ON A FLEET RUNNER the built pins persist beside the workspace, keyed as
    # the Actions cache is: the workspace path is the runner's own and does
    # not change, so the tree copied back is at the path it was built for.
    # The store is local disk; the tree is still checked against the pins
    # below before it is used.
    - name: the runner's stored pins (fleet)
      id: store
      if: runner.environment != 'github-hosted'
      shell: bash
      env:
        KEY: ${{ steps.pin.outputs.key }}
        FLOOR: ${{ steps.pin.outputs.floor }}
        CURRENT: ${{ steps.pin.outputs.current }}
      run: |
        set -euo pipefail
        store="$(dirname "$RUNNER_WORKSPACE")/_schema-ruby/$KEY"
        echo "dir=$store" >> "$GITHUB_OUTPUT"
        if [ -f "$store/.complete" ]; then
          mkdir -p dist
          for v in "$FLOOR" "$CURRENT"; do
            rm -rf "dist/ruby-$v" && cp -a "$store/ruby-$v" "dist/ruby-$v"
          done
          echo "hit=true" >> "$GITHUB_OUTPUT"
          echo "the Ruby pins: from the runner store $store"
        fi
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: restore
      if: runner.environment == 'github-hosted'
      with:
        path: |
          dist/ruby-${{ steps.pin.outputs.floor }}
          dist/ruby-${{ steps.pin.outputs.current }}
        key: ${{ steps.pin.outputs.key }}-${{ runner.os }}-${{ runner.arch }}
    - name: build the Ruby pins (cache miss)
      if: steps.restore.outputs.cache-hit != 'true' && steps.store.outputs.hit != 'true'
      shell: bash
      run: make -j2 dist-ruby RUBY_BUILD_JOBS="$(getconf _NPROCESSORS_ONLN)"
    - name: keep the built pins in the runner store (fleet)
      if: runner.environment != 'github-hosted' && steps.store.outputs.hit != 'true'
      shell: bash
      env:
        STORE: ${{ steps.store.outputs.dir }}
        FLOOR: ${{ steps.pin.outputs.floor }}
        CURRENT: ${{ steps.pin.outputs.current }}
      run: |
        set -euo pipefail
        make ruby-toolchain-check
        rm -rf "$STORE.tmp" && mkdir -p "$STORE.tmp"
        for v in "$FLOOR" "$CURRENT"; do cp -a "dist/ruby-$v" "$STORE.tmp/ruby-$v"; done
        touch "$STORE.tmp/.complete"
        rm -rf "$STORE" && mv "$STORE.tmp" "$STORE"
    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: runner.environment == 'github-hosted' && steps.restore.outputs.cache-hit != 'true'
      with:
        path: |
          dist/ruby-${{ steps.pin.outputs.floor }}
          dist/ruby-${{ steps.pin.outputs.current }}
        key: ${{ steps.pin.outputs.key }}-${{ runner.os }}-${{ runner.arch }}
    - name: the cached Ruby is the pins
      shell: bash
      run: make ruby-toolchain-check
