name: Schema C++ nightly fuzz

# THE NIGHTLY PART runs on the schedule and on workflow_dispatch only: libFuzzer
# with a time budget is not a per-push gate. The FAST PART is the replay of every
# saved regression input on EVERY push and pull request: no mutation, no clock,
# only the inputs a nightly run already found. It has no paths filter, so a
# change to a generated reader, the emitter, the schema corpus or the harness
# always reaches it.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
  pull_request:

concurrency:
  group: schema-cpp-nightly-fuzz-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # FAST: replay only. -runs=0 executes each corpus input once; the clock is not
  # an argument here, and no new input is generated. Only schemas with a saved
  # corpus are generated and built, so this stays inside one minute.
  replay:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false
      - name: the C++ fuzz corpus replays
        run: make schema-cpp-fast-fuzz-replay

  # NIGHTLY: the two sanitizer runs, separate jobs so one crashing build does
  # not hide the other. ASan+UBSan is the default; MSan is its own legs.
  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: asan-ubsan
            target: schema-cpp-nightly-fuzz
          - leg: msan
            target: schema-cpp-nightly-fuzz-msan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false
      - name: the fuzzer's pinned toolchain is present
        run: make schema-cpp-fuzz-toolchain
      - name: fuzz the C++ generated readers (${{ matrix.leg }})
        run: |
          set +e
          make ${{ matrix.target }} CPP_FUZZ_SECONDS=600
          rc=$?
          case $rc in
            0)  echo "cpp fuzz: pass (no crash, hang, sanitizer or assert finding)";;
            70) echo "::error::cpp fuzz compile failure";;
            71) echo "::error::cpp fuzz setup failure (toolchain, generation, roots or seeds)";;
            72) echo "::error::cpp fuzz runtime failure";;
            77) echo "::error::cpp fuzz finding (crash, timeout, OOM, leak, sanitizer or assert)";;
            *)  echo "::error::cpp fuzz failed with an unmapped code $rc";;
          esac
          [ -f build/cpp-fuzz/status.tsv ] && cat build/cpp-fuzz/status.tsv
          exit $rc
      - name: keep any crash inputs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cpp-fuzz-${{ matrix.leg }}-artifacts
          path: |
            test/cpp-fuzz/corpus/**
            build/cpp-fuzz/**/crash-*
            build/cpp-fuzz/**/leak-*
          if-no-files-found: ignore
