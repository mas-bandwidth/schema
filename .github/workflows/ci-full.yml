name: CI full

# THE FULL LANE. Everything this repository checks per commit is in this file,
# and NOTHING HAS BEEN DROPPED from it — what changed is WHEN it runs.
#
# WHY IT MOVED (measured, 2026-09-11, five completed runs on fixed-table-form
# pull requests: 34596169063, 34596024573, 34595364248, 34595255044,
# 34594783777). This file dispatches SEVENTY JOBS per pull request, and the
# binding constraint turned out not to be any job's run time but the QUEUE:
# the 47 negative-control rows waited a median of 11m38s for a runner, the
# conformance legs 6m43s, and the last job of a run started up to 23 minutes
# after the push. End to end those five runs took 10:53, 15:08, 16:08, 15:45
# and 24:42 against the owner's one-to-two-minute rule for interactive
# iteration. A 15-minute job timeout was raised that morning instead of the
# cause being fixed, which treats a queue as a budget.
#
# SO THIS FILE NOW RUNS: on every push to main, dev and fixed-table-form (the
# merge gate), nightly at 07:10 UTC, on `gh workflow run ci-full.yml --ref
# <branch>`, and on any pull request carrying the `full-ci` label. Every job
# carries the same `if:` for that last case, which is why the expression is
# repeated rather than named once: GitHub gives a job-level `if:` no access to
# the `env` context.
#
# WHAT RUNS ON EVERY PUSH IS ci-fast.yml, five jobs selected by path, targeting
# two minutes wall: the cheap lints, the block zero-cost gate, `go test` of the
# packages the diff touches, and the fixed-form and versioning gates of the
# legs the diff touches. Its header carries the measurement table in full.
#
# THE PULL-REQUEST GATE (issue #368). Every job in this file answers a question
# about the CODE IN THE DIFF, and every one of them fits the owner's rule for
# CI that runs on each pull request: one to two minutes.
#
# MEASURED, on this file's own run on the branch that introduced it (run
# 33740084214): the gate answers END TO END in 1:54. Per job — big-endian
# 1:49, msvc 1:27, windows 0:49, conformance 0:21 to 0:41 per leg, go-test
# 0:37, lint 0:37, vuln 0:30, shape-gate 0:22, generated 0:16, cpp-lock 0:06.
#
# THE RULE IS PER JOB, AND EVERY JOB IN THIS FILE IS HELD TO IT. The
# negative-control leg below is a matrix, and a matrix row is a job, so each
# row is cut to fit the same two minutes rather than the leg as a whole being
# cut to fit it. A control that cannot fit the rule ON ITS OWN is not made to
# fit by grouping, so it does not run here at all: it runs on the nightly tier
# in certify.yml, and make/negative-controls.json records which tier every
# group is in and why. `tools/negativecontrols` refuses a group that is in
# neither, so nothing can fall between the two files.
#
# `big-endian` WAS THE BINDING CONSTRAINT, and issue #684 owned bringing it
# under the rule. It measures 4:15 to 4:26 on main (runs 34111624059,
# 34111228369, 34110320928) because one job ran the leg's five independent
# pieces and its control end to end, and the run paid their SUM. It has the
# negative controls' treatment now: the job is a matrix of one row per piece —
# the tables battery, the collections battery, the cook, the C leg, the C++
# control, the C twin control and the Go leg — because those share nothing but
# bin/schema and the generated tree. The Makefile carries the same pieces as
# targets of their own, and `make tables-big-endian-negative-control` still
# runs the leg and then the control, which is what `make test`, certify.yml and
# a workstation ask for.
#
# Its control is still the reason tables-big-endian-negative-control sits in
# the plan's exclusion list rather than in a group: this file runs it on every
# pull request already, now in the `control` row, and the C twin in `c-control`.
#
# CERTIFICATION IS certify.yml: the inline gates, the full `make test` chain on
# both OSes, every `tables-<lang>-release` target. It runs nightly and on
# demand, and never per push (#669): a thirty-minute suite is not per-commit
# CI. Nothing is checked less than before, because the split moves WHEN a
# certification instrument runs, not whether. A regression only certification
# can see fails loudly at the next nightly, or the same hour when somebody
# dispatches that file on main after a landing near the hot paths.
#
# The line between the two files is the question a job answers. An ITERATION
# gate answers "is this diff right" — it can go red on a commit, so a PR is
# where it belongs. A CERTIFICATION gate answers "does this tree still hold on
# every toolchain, at length, under load" — it fires on compiler-version
# changes and on time, by design, so it belongs where those live.
#
# To run certification on a branch before merging (a change near the hot paths,
# or anything that moves the C++ emitters):
#   gh workflow run certify.yml --ref <branch>
#
# WHEN A PULL REQUEST GETS NO RUN AT ALL. GitHub does not create a
# `pull_request` run while the pull request has a merge conflict with its base:
# the run needs the merge commit refs/pull/<n>/merge, and a conflicted pull
# request has none. The cla.yml workflow keeps firing on those same pushes
# because `pull_request_target` runs against the base branch and needs no merge
# ref, which is exactly the asymmetry #368's second symptom describes. It is
# documented behavior, not a limit this file can lift:
# https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#pull_request
# The fix is to rebase the branch; the mitigation is below on `cpp-lock`, which
# no longer skips itself on the workflow_dispatch runs a worker falls back to.

on:
  push:
    # THE MERGE GATE. main, dev (where work streams land serially before
    # promoting to main), and the fixed-form integration branch while the
    # nine language legs land on it (2026-09-09): a merge into those branches
    # runs the whole of this file. Feature branches do not: their pull request
    # already ran it on the same head (2026-10-29).
    branches: [ main, dev, fixed-table-form ]
  pull_request:
    # A pull request runs this file only when it carries the `full-ci` label —
    # every job below is gated on that, except `generated`, `pins` and
    # `cs-tables` which run on every pull request. The label is how a branch
    # near the hot paths, or anything that moves the C++ emitters, asks for the
    # whole suite before merging; `gh workflow run ci-full.yml --ref <branch>`
    # is the other way, and needs no label.
    branches: [ main, dev, fixed-table-form ]
    types: [ opened, synchronize, reopened, labeled ]
  schedule:
    # nightly, so a tree nobody pushed to is still checked against the
    # toolchains and the vulnerability database, which move on their own
    - cron: '10 7 * * *'
  workflow_dispatch:

# Superseded pushes to the same pull request cancel each other; a push to main
# is never cancelled. The event name is part of the group so a queued main run
# and a queued dispatch run can never displace each other (a group holds only
# one pending run).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The runtimes the generated code targets, PINNED to each sibling's latest
# RELEASED tag, never main: a sibling merging to main mid-day must not change
# what a schema commit's CI proves — the sibling-HEAD race broke this gate
# three separate times (2026-08-16/17) with green schema commits going red on
# foreign pushes. One pin per sibling, exactly one place each (these lines),
# shared by every job that clones the siblings. certify.yml carries the same
# block; the two must move together.
# To bump a pin: edit the *_TAG line to the new release tag — nothing else
# changes. Find the newest tag with:
#   gh release list --repo mas-bandwidth/<repo> --limit 1
env:
  SERIALIZE_TAG: v2.1.3
  SERIALIZE_C_TAG: v2.0.2
  SERIALIZE_GO_TAG: v2.1.1
  SERIALIZE_RS_TAG: v5.0.0
  SERIALIZE_CS_TAG: v2.0.1
  SERIALIZE_JS_TAG: v2.0.1

jobs:
  # The compiler's own test suite, and the only job in this file that reads a
  # Go source file. `go test ./...` covers internal/fuzz, whose seeded corpus
  # re-executes every crasher ever found — a short, bounded run, not a
  # campaign (the unit-rest row runs it, with its property and oracle tests).
  # The one campaign in that package, the random-schema table differential
  # (TestRandomTableDifferential and its negative control), skips itself here:
  # it runs only under SCHEMA_TABLE_DIFF=1, which only `make fuzz-tables-diff`
  # sets, nightly in certify.yml. `go vet` rides here because an emitter
  # codebase built almost entirely out of format strings is exactly where
  # printf-verb mismatches live (issue #31).
  #
  # The two C sibling checkouts are not optional decoration: internal/fuzz's
  # compile check SKIPS ITSELF when ../serialize and ../serialize.c are absent,
  # so a job without them would report green over a check that never ran.
  #
  # FIFTEEN MINUTES, NOT TEN, and the number is measured rather than padded.
  # This job is where the fixed form's versioning suites hang — Go, C and Rust,
  # each one a generator that compiles a probe per row per column — and they
  # arrived on three separate branches that each fit under ten on their own.
  # Run 34585071032 put the Go and Rust pair at 9m15s of a 10m cap; the C leg
  # lands in the same job on this merge, and the sum does not fit. A job that a
  # green run already sits at 92% of turns the next leg's arrival into a
  # cancellation with nothing red inside it, which is what happened one door
  # over in `pins` on 34584793329. Raising the budget keeps every gate and
  # costs a runner minute; trimming the suites would cost a column of §5.
  # The Dart and Elixir legs land in this same job on their own branches, each
  # another generator running a probe per row per column; fifteen is the budget
  # they share.
  go-test:
    # Runs on a pull request only when it comes from this repository and
    # carries the `full-ci` label; on a merge, the nightly and a dispatch it
    # always runs. A fork pull request never reaches the fleet runners, even if
    # labelled `full-ci`. The expression is repeated per job because a job-level
    # `if:` cannot read `env`.
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'full-ci'))
    name: go-test (${{ matrix.group }})
    # THE FLEET'S RUNNERS, as ci-fast's runs into main use (standing rule,
    # 2026-10-21: every CI job on fleet runners, never GitHub-hosted). On a
    # hosted two-core runner the SCHEMA_SLOW=1 gotable package passed the
    # 10-minute test timeout; the gate is not loosened to fit that runner.
    runs-on: [self-hosted, Linux, X64, fleet, schema]
    timeout-minutes: 15
    # EIGHT ROWS, because this job was 650 s median (2026-09-11) and a matrix
    # row is a job: the emitter packages, the compiler package in two halves,
    # everything else, the Elixir emitter alone, the slow-gate accounting in
    # two halves, and the seven fixed-form
    # versioning suites that cannot ride `go test ./...` at all. Every step
    # below is the step it was; what is new is which row runs it, and no step
    # runs in none of them or in two.
    #   unit-codegen    — go test ./internal/codegen/... less elixirtable
    #   unit-compiler-1 — go test ./compiler, the tests one pattern names
    #   unit-compiler-2 — go test ./compiler, every other test
    #   unit-rest       — go vet ./..., go test over everything that is
    #                     neither an emitter package nor ./compiler, the
    #                     projection's three controls, the toolchain control,
    #                     the python leg and the one Linux cache write
    #   unit-elixir     — go test internal/codegen/elixirtable, alone
    #   slow-gate-codegen — the slowtest accounting (schema#988) over the
    #                     emitter packages
    #   slow-gate-rest  — the same accounting over every other package
    #   versioning      — §5 on the Go, C, Rust, Java, JavaScript, Dart, C#
    #                     and Elixir legs, with the three SDKs only that row
    #                     needs
    #
    # WHY unit-rest WAS CUT AGAIN (2026-10-27). On run 40596125566 the one
    # unit-rest row ran 14m55s against this 15-minute cap: the complement's
    # `go test` took 7m26s, nearly all of it ./compiler (441 s; the next
    # package, internal/fuzz, was 79 s and internal/goldens 77 s), the
    # accounting's plain `go test ./...` took 6m22s more, and the Java
    # versioning suite, whose step carried no row condition, ran 41 s in every
    # row. So ./compiler is two rows split by test name, the accounting is two
    # rows split by package, and the Java suite is the versioning row's alone.
    # internal/codegen/elixirtable is a row of its own: its allocation test is
    # load-sensitive, and alone it is 4m35s, which would put unit-rest over
    # half its cap. Which
    # row runs which package and which test is held by
    # tools/slowgatescan's TestCIFullGoTestRunsEveryTestExactlyOnce: a test
    # that no row selects, or that two rows select, is red there by name.
    strategy:
      fail-fast: false
      matrix:
        group: [ unit-codegen, unit-compiler-1, unit-compiler-2, unit-rest, unit-elixir, slow-gate-codegen, slow-gate-rest, versioning ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out the C, C++, C#, Go and Rust serialize runtimes (pinned releases)
        run: |
          set -euo pipefail
          cd ..
          # A self-hosted runner's workspace PARENT persists between runs: the
          # previous run's clones are removed and re-cloned at the pinned tag
          # every time, never reused (as ci-fast's go-test-touched does).
          rm -rf serialize serialize.c serialize.cs serialize.go serialize.rs
          git clone --quiet --depth 1 --branch "$SERIALIZE_TAG"   https://github.com/mas-bandwidth/serialize.git   serialize
          git clone --quiet --depth 1 --branch "$SERIALIZE_C_TAG" https://github.com/mas-bandwidth/serialize.c.git serialize.c
          git clone --quiet --depth 1 --branch "$SERIALIZE_CS_TAG" https://github.com/mas-bandwidth/serialize.cs.git serialize.cs
          git clone --quiet --depth 1 --branch "$SERIALIZE_GO_TAG" https://github.com/mas-bandwidth/serialize.go.git serialize.go
          # compiler.TestRustEverySchemaNameIsReachable (unit-rest) builds the
          # generated crates against the sibling serialize.rs.
          git clone --quiet --depth 1 --branch "$SERIALIZE_RS_TAG" https://github.com/mas-bandwidth/serialize.rs.git serialize.rs

      # the runner's own pinned go already satisfies go.mod; hosted fallback only
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: runner.environment == 'github-hosted'
        with:
          go-version: '1.26'
          cache: false

      # THE .NET SDK, for the C# leg's versioning suite at the end of this job.
      # The harness is a Go test that generates one C# assembly and runs it, so
      # the SDK is this job's toolchain like Go is — and it is PINNED from the
      # same .github/dotnet-version every other C# job reads, so a runner image
      # that ships a different SDK cannot change what this gate compiles.
      - name: read the .NET SDK pin
        if: matrix.group == 'versioning'
        run: echo "DOTNET_SDK_PIN=$(cat .github/dotnet-version)" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: matrix.group == 'versioning' && runner.environment == 'github-hosted'
        with:
          dotnet-version: ${{ env.DOTNET_SDK_PIN }}

      # THE GO BUILD CACHE (the two-minute rule, issue #368). Every job in this
      # file that touches Go begins by compiling the same compiler from the
      # same sources on a runner that has never seen them. `go build
      # ./cmd/schema` is about 15 s cold, and this file pays it forty-seven
      # times over in the negative-control rows alone, again in each
      # conformance leg, and again in every gate that shells out to `go run`.
      #
      # THE THING WORTH CARRYING IS THE BUILD CACHE, NOT THE MODULE CACHE.
      # This module has no external dependency and no go.sum, so there is
      # nothing to download and a module cache would cache the empty set.
      # ~/.cache/go-build — about 100 MB of compiled package archives — is
      # where the fifteen seconds actually are.
      #
      # A STALE ENTRY CANNOT MAKE A WRONG BUILD, and that is the load-bearing
      # fact about this whole block. Go's build cache is content-addressed:
      # every entry is keyed by a hash of the source, the compiler's own
      # identity and the build flags, so a cache carried across a toolchain
      # bump or a source change serves the parts that still match and is
      # simply ignored for the parts that do not. The key below is therefore
      # only ever about the HIT RATE, never about correctness — which is what
      # lets the last fallback rung be as coarse as it is.
      #
      # THE KEY: the runner's OS, the toolchain's identity AS THE INSTALLED
      # TOOLCHAIN REPORTS IT rather than a version restated here (a literal
      # '1.26' in fourteen places would be a second home for a pin the
      # setup-go step above owns), and a hash of every Go source and go.mod.
      # The path comes from `go env GOCACHE` for the same reason — it is a
      # different directory on the Windows runners, and reading it beats
      # knowing it.
      #
      # THERE IS EXACTLY ONE FALLBACK RUNG, and the missing one is the point.
      # `go-build-<os>-<toolchain>-` is the rung that matters: it is the same
      # toolchain over an older tree, which is what a pull request restores
      # from main and what makes its first run warm. A rung below that —
      # `go-build-<os>-` — can only ever match a DIFFERENT toolchain, and a
      # cache written by another toolchain hits nothing, because every entry
      # in it is keyed on that compiler's build ID. So it would download
      # 120 MB to find zero usable entries, every time, and it is not here.
      #
      # WHICH IS ALSO A FINDING ABOUT THIS FILE, and this branch measured it:
      # `go-version: '1.26'` is a RANGE, and setup-go resolves it to whatever
      # 1.26.x the runner image already carries. One warm run of this file put
      # 1.26.7 on thirty-one of the forty-six negative-control rows and 1.26.8
      # on the other fifteen, so only the fifteen could use a cache the
      # go-test row wrote under 1.26.8. Pinning the patch would make the whole
      # leg warm and would make what CI proves the same fact twice running;
      # that is a decision about the toolchain pin rather than about caching,
      # so it is named here and left for its own change.
      #
      # ONE WRITER PER OS, AND IT IS THIS JOB. `actions/cache` saves whenever
      # the exact key missed, so fifty-five jobs sharing one key would be
      # fifty-five jobs racing to upload the same 100 MB: GitHub reserves a
      # key to exactly one of them and the rest warn and drop it. So every job
      # takes the RESTORE half and exactly one job per OS takes the SAVE half
      # — `go-test` for Linux, at the bottom of this job, because vet and
      # `go test ./...` between them compile every package in the module and
      # its cache is the widest one this tree can produce; and `windows`
      # below for Windows, which vets and builds the whole module too.
      #
      # THE FIRST RUN OF A BRANCH IS ALREADY WARM. A cache written on main is
      # readable from every branch, so a branch's first run restores main's
      # entry through the fallback key, recompiles only what its own diff
      # moved, and writes its own entry for its second run. A pull request
      # pays for its diff and nothing else.
      #
      # THE `generated` GATE TAKES NO CACHE, deliberately. It is the job that
      # decides whether the committed tree matches what the current compiler
      # emits, and it is the one place in this file where "the build did no
      # work" must not be an available explanation for a green.
      - name: where this runner keeps the Go build cache
        if: runner.environment == 'github-hosted'
        shell: bash
        run: |
          echo "GO_BUILD_CACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"
          echo "GO_CACHE_ID=$(go env GOVERSION)-$(go env GOARCH)" >> "$GITHUB_ENV"

      # On a self-hosted runner the build cache is the runner's own and warm.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: runner.environment == 'github-hosted'
        with:
          path: ${{ env.GO_BUILD_CACHE }}
          key: go-build-${{ runner.os }}-${{ env.GO_CACHE_ID }}-${{ hashFiles('**/*.go', 'go.mod') }}
          restore-keys: go-build-${{ runner.os }}-${{ env.GO_CACHE_ID }}-

      # THE LUAU PIN for the test rows below: internal/codegen/luau,
      # internal/codegen/luautable, the compiler's Luau testgen gate and the
      # Luau lanes under internal/ci run generated Luau under the pinned
      # interpreter and fail, never skip, without it
      # (internal/codegen/luau/luaurun). Installed as make/luau.mk's dist-luau
      # does, the sha256 refused before anything is unpacked.
      - name: install the Luau pin
        if: matrix.group == 'unit-codegen' || matrix.group == 'unit-compiler-1' || matrix.group == 'unit-compiler-2' || matrix.group == 'unit-rest' || matrix.group == 'slow-gate-codegen' || matrix.group == 'slow-gate-rest'
        run: make dist-luau

      - name: go vet
        if: matrix.group == 'unit-rest'
        run: go vet ./...

      # THE LUA PIN for the test steps below: internal/codegen/lua,
      # internal/codegen/luatable and the Lua lanes under internal/ci run
      # generated Lua under the pinned PUC-Rio interpreter and fail, never
      # skip, without it. make/lua.mk's dist-lua builds it from source at the
      # sha256 it names, into dist/lua-<version>/, which is the LUA default.
      - name: install the Lua pin
        if: matrix.group == 'unit-codegen' || matrix.group == 'unit-rest' || matrix.group == 'slow-gate-codegen' || matrix.group == 'slow-gate-rest'
        run: make dist-lua

      # THE Goose PIN for the test steps below: internal/codegen/goose and
      # internal/codegen/goosetable run generated Goose under the pinned compiler
      # and fail, never skip, without it. make/goose.mk's dist-goose installs it
      # at the sha256 it names, into the dist/ path the leg's default names.
      - name: install the Goose pin
        if: matrix.group == 'unit-codegen' || matrix.group == 'unit-rest'
        run: make dist-goose

      # THE SQUIRREL PIN, on the three rows that run generated Squirrel and on
      # no other. Under SCHEMA_SLOW=1 internal/codegen/squirrel and
      # squirreltable (unit-codegen), compiler's TestSquirrel* (unit-compiler-2;
      # no Squirrel test matches the first half's pattern) and internal/ci's
      # hostile-corpus runner (unit-rest) fail, never skip, without it. The
      # slow-gate rows run plain `go test`, where every Squirrel test skips at
      # internal/slowtest.Gate before the interpreter is resolved, so they pay
      # nothing. make/squirrel.mk's dist-squirrel builds sq at the sha256 it
      # names, into the dist/ path the leg's default names.
      - name: install the Squirrel pin
        if: matrix.group == 'unit-codegen' || matrix.group == 'unit-compiler-2' || matrix.group == 'unit-rest'
        run: make dist-squirrel

      # THE EMITTERS' OWN TESTS, which are the slow half of `go test ./...`:
      # every codegen package generates and compiles something.
      # SCHEMA_SLOW=1 IS THE WHOLE OF THE SPLIT ON THIS LANE. internal/slowtest
      # gates the tests that shell out to cc, c++, dotnet, javac, cargo, dart,
      # node, elixir or the Go toolchain, so a child's default `go test` is
      # seconds instead of minutes (the owner's rule, twice today: "Remember the
      # 1-2 minute iteration rule on unit tests."). THIS LANE SETS IT, so the
      # merge and nightly runs check exactly what they checked before.
      #
      # LESS internal/codegen/elixirtable, which the unit-rest row runs in a
      # step of its own: its TestOffsetsComposeFromHalvesElixir measures
      # allocations and is load-sensitive, so it runs with no other package's
      # tests beside it, on a row of its own (2026-10-27).
      # THE MOO PIN for the emitter rows: internal/codegen/moo runs the
      # generated modules under the pinned interpreter and its analyzer, and
      # under SCHEMA_SLOW=1 fails, never skips, without them (make/moo.mk;
      # .github/actions/moo builds the pin once per runner image and caches it).
      - uses: ./.github/actions/moo
        if: matrix.group == 'unit-codegen' || matrix.group == 'slow-gate-codegen'

      # THE LOBSTER PIN for the emitter row: internal/codegen/lobster and
      # internal/codegen/lobstertable run generated Lobster under the pinned
      # compiler and fail, never skip, without it
      # (internal/codegen/lobster/lobsterrun). make/lobster.mk's dist-lobster
      # installs it at the sha256 it names, into the dist/ path the leg's
      # default names. The release binary links libOpenGL and libGLX, which the
      # fleet hosts carry and a hosted fallback does not.
      - name: install the Lobster pin
        if: matrix.group == 'unit-codegen'
        run: |
          set -euo pipefail
          if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libopengl0 libglx0
          fi
          make dist-lobster

      - name: go test the emitter packages
        if: matrix.group == 'unit-codegen'
        env:
          SCHEMA_SLOW: '1'
        run: go test $(go list ./internal/codegen/... | grep -v '/elixirtable$')

      # THE LOBSTER FIXED FORM AGAINST THE REFERENCE'S BYTES. The step above
      # runs internal/codegen/lobstertable without build/fixedform-corpus, so
      # its corpus-reading tests skip there as every leg's do; test-lobster
      # builds the corpus (the ../serialize checkout above is all it needs) and
      # sets SCHEMA_REQUIRE_CORPUS=1, under which a missing oracle is a
      # failure. The two packages' suites are seconds, so the repeat is cheap.
      - name: the Lobster fixed form reads the reference's bytes
        if: matrix.group == 'unit-codegen'
        run: make test-lobster

      # THE COMPILER PACKAGE, IN TWO ROWS, because on its own it is 441 s of
      # the complement below and one package is one test binary: the only cut
      # that splits it is by test name. ONE PATTERN, handed to -run on the
      # first row and to -skip on the second, so the two rows are complements
      # and a new test lands in the second row with no edit here. It is spelled
      # out on both lines because tools/slowgatescan reads these lines and
      # credits what they select (a shell variable would earn nothing), and
      # its TestCIFullGoTestRunsEveryTestExactlyOnce goes red if the two
      # spellings ever stop being complements. The pattern was balanced on a
      # -json timing of the package (2026-10-27: the C++ and issue tests 138 s,
      # the rest 142 s, at GOMAXPROCS=4); -v keeps each test's time in the log
      # for the next rebalance.
      - name: go test the compiler package, first half
        if: matrix.group == 'unit-compiler-1'
        env:
          SCHEMA_SLOW: '1'
        run: go test -v ./compiler -run '^Test(Cpp|CPP|Issue)'

      - name: go test the compiler package, second half
        if: matrix.group == 'unit-compiler-2'
        env:
          SCHEMA_SLOW: '1'
        run: go test -v ./compiler -skip '^Test(Cpp|CPP|Issue)'

      # AND THE COMPLEMENT, derived from `go list` rather than listed here, so a
      # new package lands in this row with no edit to this file.
      - name: go test everything that is not an emitter package or the compiler
        if: matrix.group == 'unit-rest'
        env:
          SCHEMA_SLOW: '1'
        run: go test $(go list ./... | grep -v '/internal/codegen/' | grep -v '/compiler$')

      # THE ELIXIR EMITTER'S PACKAGE, ALONE. Its allocation test measures heap
      # words and is load-sensitive, so it is not inside the emitter row's
      # `go test`, where every codegen package compiles and runs at once; it
      # runs on a row with nothing else on it.
      # -count=1 because a self-hosted runner keeps its Go test cache warm,
      # and a cached pass is a measurement taken on some earlier run's load.
      - name: go test the Elixir emitter package on its own
        if: matrix.group == 'unit-elixir'
        env:
          SCHEMA_SLOW: '1'
        run: go test -count=1 ./internal/codegen/elixirtable

      # AND THE ACCOUNTING FOR THE TWO STEPS ABOVE (schema#988, G5). The two
      # steps set SCHEMA_SLOW=1, so on this lane every gated test runs; that is
      # exactly why the accounting belongs here. It runs the DEFAULT half once
      # (no SCHEMA_SLOW — the point is to see what a developer's `make test`
      # skips), then places every gate skip in one of three buckets: run by a
      # make target that sets the variable, run only by the two steps above, or
      # run by NOBODY. The third bucket fails the job. The table is uploaded as
      # build/slowgate/coverage.tsv so the accounting is read, not believed.
      # TWO ROWS, ONE VERDICT: the accounting is per skip, so the emitter
      # packages and the rest, each read on its own row, reach the verdict one
      # plain `go test ./...` would, at half the wall time each.
      - name: every slowtest gate is run by somebody, by name (schema#988), emitter packages
        if: matrix.group == 'slow-gate-codegen'
        run: make slow-gate-coverage-codegen

      - name: every slowtest gate is run by somebody, by name (schema#988), every other package
        if: matrix.group == 'slow-gate-rest'
        run: make slow-gate-coverage-rest

      # THE GO CONFORMANCE ROWS (docs/SPEC-CARD-CONTRACT.md): the rows in
      # test/conformance/go/rows, which `go test ./...` never sees because they
      # live in the test/conformance/go module. The gate self-provisions its
      # build stamps and the C++ reference corpus.
      - name: the Go conformance rows
        if: matrix.group == 'versioning'
        run: make conformance-go-rows

      # THE FIXED FORM'S VERSIONING SUITE (§5 of docs/FIXED-FORM-ALGORITHM.md),
      # which the step above does NOT run. Its harness reads the C++
      # reference's byte oracle out of build/fixedform-corpus and SKIPS itself
      # when that directory is absent — which it always is under a bare
      # `go test ./...` — so until this step existed the whole of §5 was
      # unwatched on the diff that changes it, reporting green over a suite
      # that asserted nothing. `make tables-go-versioning` builds the oracle
      # with the reference's own dump first (~7 s) and sets
      # SCHEMA_REQUIRE_CORPUS=1, under which the skip is a failure: a corpus
      # that failed to build can no longer pass here quietly. About half a
      # minute, and the ../serialize checkout this job already makes is the
      # only thing the C++ dump needs.
      - name: the fixed form's versioning suite reads the reference's bytes
        if: matrix.group == 'versioning'
        run: make tables-go-versioning

      # THE SAME TWO COLUMNS ON THE C LEG (§5, and §5.9 #11: every leg owes both
      # gates). The C half generates a probe unit per row per column and compiles
      # it, because two generations of one table name cannot share a translation
      # unit — so it cannot ride inside `go test ./...` either, and it is hung
      # here beside the Go one for the same reason: under SCHEMA_REQUIRE_CORPUS a
      # missing oracle is a failure, never a quiet skip.
      - name: the fixed form's versioning suite on the C leg
        if: matrix.group == 'versioning'
        run: make tables-c-versioning

      # THE SAME SUITE ON THE RUST LEG, and it is in THIS job rather than a Rust
      # one because the harness is a Go test: internal/codegen/rusttable's
      # fixedversioning_test.go generates one cargo workspace of probe crates and
      # runs `cargo test` over it once, so the thing that must be installed is Go
      # plus cargo, and the corpus the step above already knows how to build. The
      # ubuntu runner image carries a stable cargo on PATH; $(RUSTUP_BIN) in
      # make/rust.mk is a homebrew keg that does not exist here, and prepending a
      # directory that is not there costs nothing and resolves the image's cargo.
      #
      # THE ../serialize.rs CHECKOUT comes from the job's checkout block above,
      # at the same pinned tag the rest of this file uses (it moved there when
      # unit-rest's compiler.TestRustEverySchemaNameIsReachable needed it too).
      # Every probe crate depends on `serialize-official` by path; without it the
      # suite fails by name on the missing sibling rather than skipping, which is
      # the behaviour this whole gate is for.
      - name: the fixed form's versioning suite on the Rust leg
        if: matrix.group == 'versioning'
        run: make tables-rust-versioning RUSTUP_BIN="$(dirname "$(command -v cargo)")"

      # THE SAME SUITE ON THE JAVA LEG (§5 of docs/FIXED-FORM-ALGORITHM.md), and
      # it is here rather than in a Java job for the reason the Go step above is:
      # the harness is a GO test that generates, compiles and runs Java probes,
      # so it rides the job that already has the Go toolchain and the ../serialize
      # checkout, and `make tables-java-versioning` brings the reference's dump
      # and the JDK pin with it. SCHEMA_REQUIRE_CORPUS=1 lives inside the recipe,
      # so a corpus that failed to build cannot pass here quietly.
      - name: the fixed form's versioning suite reads the reference's bytes, on the Java leg
        if: matrix.group == 'versioning'
        run: make tables-java-versioning

      # THE SAME GATE ON THE JAVASCRIPT LEG (§5.9 #11: every leg owes both
      # gates). The probes are generated modules run with $(NODE) — dist/ is not
      # in this job, so NODE=node uses the runner's own — and the corpus is the
      # one the step above already built.
      - name: the fixed form's versioning suite on the JavaScript leg
        if: matrix.group == 'versioning'
        run: make tables-js-versioning NODE=node

      # THE SAME SUITE ON THE DART LEG (§5.7 step 6: every leg owes BOTH gates,
      # the bytes and the versioning rows). Its probes are generated Dart, one
      # per row per column, so the job needs the SDK and nothing else — the
      # corpus it reads is the one the step above already built, and
      # SCHEMA_REQUIRE_CORPUS=1 makes a missing corpus or a missing SDK a
      # failure rather than a silent skip.
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        if: matrix.group == 'versioning' && runner.environment == 'github-hosted'
        with:
          sdk: 3.13.2
      - name: the Dart leg reads backward over every versioning row
        if: matrix.group == 'versioning'
        run: make tables-dart-versioning DART=dart

      # THE SAME TWO COLUMNS ON THE C# LEG (§5, and §5.9 #11: every leg owes both
      # gates). The harness is a GO test — internal/codegen/cstable generates one
      # probe per row per column into a single C# assembly and runs it once — so it
      # belongs in this job rather than a C# one: what must be installed is Go, the
      # .NET SDK this job already sets up, and the corpus the step above knows how
      # to build. The ../serialize.cs checkout this job already makes is the only
      # other thing the probes need. Under SCHEMA_REQUIRE_CORPUS a missing oracle is
      # a failure here, never a quiet skip.
      # Fast CI keeps Debug on its short path; this full tier retains both
      # configurations alongside the required versioning oracle.
      - name: the C# leg in Debug and Release, and its versioning suite
        if: matrix.group == 'versioning'
        run: make tables-cs-leg tables-cs-versioning

      # THE SAME SUITE ON THE ELIXIR LEG (§5.7 step 6). Its probes are generated
      # Elixir, one per row per column, run with the leg's own toolchain: the
      # runner's Elixir and OTP are handed in as PLAIN PATHS, because the
      # harness spawns the binary itself rather than going through a shell
      # launcher. The corpus it reads is the one the Rust step above already
      # built, and SCHEMA_REQUIRE_CORPUS=1 makes a missing corpus or a missing
      # Elixir a failure rather than a silent skip.
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        if: matrix.group == 'versioning' && runner.environment == 'github-hosted'
        with:
          otp-version: '27'
          elixir-version: '1.18'
      - name: the Elixir leg reads backward over every versioning row
        if: matrix.group == 'versioning'
        run: |
          make tables-elixir-versioning \
            ELIXIR_BIN="$(command -v elixir)" ERL_BIN="$(dirname "$(command -v erl)")"

      # THE SAME SUITE ON THE LUAU LEG (§5.7 step 6). Its probes are generated
      # Luau, one per row per column, run under the pinned interpreter, which
      # this row installs as make/luau.mk's dist-luau does (the sha256 refused
      # before anything is unpacked). The corpus is the one the steps above
      # already built, and SCHEMA_REQUIRE_CORPUS=1 makes a missing corpus a
      # failure rather than a silent skip. A few seconds of probes.
      - name: the Luau leg reads backward over every versioning row
        if: matrix.group == 'versioning'
        run: |
          make dist-luau
          make tables-luau-versioning

      # THE GOOSE LEG's fixed form against the same corpus (docs/PORT-GOOSE.md).
      # `make test-goose` runs both Goose packages under the pinned compiler and
      # sets SCHEMA_REQUIRE_CORPUS=1, so the byte-oracle suite
      # (TestGooseFixedFormAgreesWithTheByteOracle) and its negative control fail
      # rather than skip without the corpus the steps above built. The unit
      # groups' `go test` runs the same packages without the corpus, where
      # those two skip. `tables-goose-versioning` is §5.7's two columns over
      # every versioning row (make/goose-versioning.mk).
      - name: the Goose leg reads the reference's fixed-form bytes, and reads backward over every versioning row
        if: matrix.group == 'versioning'
        run: make dist-goose test-goose tables-goose-versioning tables-goose-message-form

      # The projection's three controls (SPEC §3.1): a projection that stopped
      # carrying enum and flags variant names, or a union's arm names, would
      # let a reorder ship as a false match, and one without the codec law line
      # would let a rounding change ship as one. Only a control that has gone
      # red proves a gate is watching. All three are Go-only and take seconds,
      # so they belong on the diff.
      - name: the projection's gates go red without what they watch
        if: matrix.group == 'unit-rest'
        run: |
          make projection-variant-order-negative-control
          make projection-wire-law-negative-control
          make projection-union-arm-order-negative-control

      # THE TOOLCHAIN GATE's control (issue #599), on the same reasoning and in
      # the same job. `make test` is the only thing that runs the gate, and no
      # job on a pull request runs `make test`, so until this step existed the
      # gate that stops a missing toolchain was itself unwatched on the diff
      # that changes it. The control needs no toolchain of its own: it points
      # each registered pin at a path that does not exist and reads the
      # refusal, which is the state this runner is already in, and takes about
      # a second.
      - name: the toolchain gate goes red without the toolchains it pins
        if: matrix.group == 'unit-rest'
        run: make toolchain-negative-control

      # THE PYTHON LEG (#1400). Each ported row is a self-checking script, and
      # until this step no job ran one: the row was documentation of a rule,
      # not a gate over it. The runner's own python3 is enough; the target
      # refuses a run that found no rows. Its control is in the base-3 group of
      # make/negative-controls.json. This is ci-full.yml's go-test job, the
      # stream's replacement for the ci.yml job the original step rode.
      - name: the python leg's rows pass
        if: matrix.group == 'unit-rest'
        run: make tables-py-packet

      # THE ONE LINUX WRITER, per the block at the top of this job. It is last
      # so that what it uploads is the cache AFTER vet and the whole test
      # suite have filled it, which is the widest cache this tree produces.
      # `actions/cache/save` cannot redden a job: a key another run reserved
      # first is a logged warning and this step's success.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: matrix.group == 'unit-rest' && runner.environment == 'github-hosted'
        with:
          path: ${{ env.GO_BUILD_CACHE }}
          key: go-build-${{ runner.os }}-${{ env.GO_CACHE_ID }}-${{ hashFiles('**/*.go', 'go.mod') }}

  # THE GENERATED TREE IS CURRENT (issue #30). The committed generated/ tree is
  # what this repo treats as ground truth — findings are receipted against its
  # line numbers — so a compiler change that moves the emitted text and leaves
  # the tree behind is a defect the next reader pays for.
  #
  # Every generation rule takes exactly one input, bin/schema, and no toolchain
  # and no sibling checkout: the emitted text of a Go, Rust, C#, Dart, Java or
  # Elixir unit is a function of the compiler alone. So this job emits the whole
  # tree with Go and nothing else — and it emits it into an EMPTY DIRECTORY
  # (#898's gate G3). In place, which is what this job used to do, a rule only
  # ever writes: a file the emitter STOPPED writing stays on disk byte-identical
  # to the index, and a rule that never ran leaves its whole directory standing,
  # and `git diff` calls both of those green. From nothing, the full listing and
  # the bytes answer in both directions, and every failing file is named.
  #
  # THE WHOLE VERDICT IS test/generated-tree/verify, which `make
  # generated-current` runs locally and the certify workflow runs on main — one
  # script, so the three cannot drift. Its own negative control is in `make
  # test`. The stamp list is DERIVED inside it from the Makefile and its
  # per-language includes rather than typed anywhere, so a port that adds
  # generated/<lang>/.stamp in its make/<lang>.mk is covered the moment it
  # rebases; that scan proves the rules EXIST, and the emission from nothing is
  # what proves one ran.
  generated:
    # Runs on EVERY pull request, not behind the `full-ci` label (issue #1421):
    # this is the one check that names a stale committed generated/ tree, and a
    # pull request into fixed-table-form runs no other — ci-fast.yml's leg gate is
    # `github.base_ref == 'main'` and every other job in this file carries the
    # label gate — so #1395 landed a stale
    # generated/bench/paired/rust/fixed_runtime.rs with nothing able to see it.
    # The tree-current question is an ITERATION gate and belongs on every pull
    # request. On a merge, the nightly and a dispatch it runs with the rest of
    # the file; carrying no job-level `if:` makes all of these unrepresentable to
    # skip.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false

      - name: the gate's own negative control
        run: make generated-tree-negative-controls

      - name: the committed generated/ tree is what this compiler emits, from an empty directory
        run: |
          test/generated-tree/verify || {
            echo "::error::the committed generated/ tree is not what the compiler at this sha emits. The lists above name every file: regenerate with 'make test' (or ./bin/schema generate --lang <lang> --out generated/<dir> <corpus>) and commit them, 'git rm' the ones it no longer emits, or name tracked build wiring in test/generated-tree/not-emitted."
            exit 1
          }

      - name: the tables goldens match a fresh generation (the block zero-cost gate, byte-identity half)
        run: make tables-block-zero-cost

  # THE PINS ARE CURRENT (issue #461). The job above asks this question of
  # generated/ and asks it of nothing under testdata/, so a pin regenerated
  # against an older main auto-merges clean and every job stays green against a
  # pin nobody wrote. That is not hypothetical: this job's first run found six,
  # testdata/golden/tables/maps/*Table.h, pinned on a branch cut before the
  # retain-unknown walk landed and merged after it.
  #
  # THE SHAPE IS THE GENERATED JOB'S, one door over. Every re-pinning rule takes
  # bin/schema, the C++ reference and the conformance harness, so this job
  # rewrites the whole of testdata/ IN PLACE and staleness is precisely a dirty
  # tree afterwards: a tracked pin that changed, or a newly written pin nobody
  # committed, which a diff-only check would miss.
  #
  # THE TARGETS ARE THE TREE'S OWN NAMES, `conformance-pin` and
  # `update-goldens`, so a rule that starts writing a new pin is covered the
  # moment it joins one of them, with no edit to this file. Locally the same
  # check is those two targets and the same `git diff`.
  #
  # The C++ reference writes the wire pins. The Go and C# sibling runtimes
  # supply the generated-code fixtures in update-goldens' closing compiler
  # tests. Each checkout uses its shared release pin above.
  #
  # MEASURED at 1m44s on the run that introduced it (34113070433), against
  # 4m27s for big-endian in the same run: this job is inside the two-minute
  # rule and it is not the binding constraint. Its own budget is the C++
  # reference binaries `update-goldens` builds plus that target's closing
  # `go test ./...`, which is the duplicate of go-test's and the first place
  # to look if this job ever wants the time back.
  #
  # AND IT GREW INTO THE CAP, which is why the budget below is 15 and no
  # longer 10. The duplicate `go test ./...` is now the whole of this job:
  # 419s of the base's 9m01s total on run 34585071032, and the C leg's own
  # tests carried it to 478s of 9m50s on 34584793329 — which is past a
  # 10-minute cap, so the job was cancelled MID-`go test` with nothing red in
  # it and every other job in the run green. A cap that a passing job sits at
  # 90% of reports the next leg's tests as a failure of the leg, so it is
  # raised here rather than paid for by trimming what the pins prove. The
  # paragraph above still names the real remedy: that closing `go test ./...`
  # duplicates the go-test job and is the time to reclaim when someone wants
  # it, which is a change to `update-goldens` and belongs to its own diff.
  pins:
    # Runs on EVERY same-repository pull request, not behind the `full-ci`
    # label (issue #1421): like `generated`, a stale pin is a "this diff is
    # self-consistent" failure, and a pull request into dev or
    # fixed-table-form runs no other leg gate. On a merge, the nightly and a
    # dispatch it runs with the rest of the file; a fork pull request is
    # skipped before it can reach the fleet runners.
    #
    # THE FLEET'S RUNNERS (standing rule, 2026-10-21: every CI job on fleet
    # runners, never GitHub-hosted). On a hosted two-core runner the re-pin
    # reached the 15-minute timeout; the timeout is not raised to fit that
    # runner. The setup steps below run only on a hosted fallback.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, fleet, schema]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out the C++, C# and Go serialize runtimes (pinned releases)
        run: |
          set -euo pipefail
          cd ..
          # A self-hosted runner's workspace PARENT persists between runs: the
          # previous run's clones are removed and re-cloned at the pinned tag
          # every time, never reused (as go-test does).
          rm -rf serialize serialize.cs serialize.go
          git clone --quiet --depth 1 --branch "$SERIALIZE_TAG" https://github.com/mas-bandwidth/serialize.git serialize
          git clone --quiet --depth 1 --branch "$SERIALIZE_CS_TAG" https://github.com/mas-bandwidth/serialize.cs.git serialize.cs
          git clone --quiet --depth 1 --branch "$SERIALIZE_GO_TAG" https://github.com/mas-bandwidth/serialize.go.git serialize.go

      # the runner's own pinned go already satisfies go.mod; hosted fallback only
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: runner.environment == 'github-hosted'
        with:
          go-version: '1.26'
          cache: false

      # The Go build cache, restore only — `go-test` is the one Linux writer.
      # The block on that job carries the reasoning. On a self-hosted runner
      # the build cache is the runner's own and warm.
      - name: where this runner keeps the Go build cache
        if: runner.environment == 'github-hosted'
        shell: bash
        run: |
          echo "GO_BUILD_CACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"
          echo "GO_CACHE_ID=$(go env GOVERSION)-$(go env GOARCH)" >> "$GITHUB_ENV"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: runner.environment == 'github-hosted'
        with:
          path: ${{ env.GO_BUILD_CACHE }}
          key: go-build-${{ runner.os }}-${{ env.GO_CACHE_ID }}-${{ hashFiles('**/*.go', 'go.mod') }}
          restore-keys: go-build-${{ runner.os }}-${{ env.GO_CACHE_ID }}-

      # update-goldens ends in `go test ./...`, which runs the Lua packages
      # under the pinned interpreter (make/lua.mk's dist-lua)
      - name: install the Lua pin
        run: make dist-lua

      # THE LUAU PIN: update-goldens runs the Luau type-wire golden tests, which
      # run generated Luau under the pinned interpreter and fail, never skip,
      # without it (internal/codegen/luau/luaurun; make/luau.mk dist-luau).
      - name: install the Luau pin
        run: make dist-luau

      # update-goldens ends in `go test ./...`, which runs the Goose packages
      # under the pinned compiler (make/goose.mk's dist-goose)
      - name: install the Goose pin
        run: make dist-goose
      # and the Lobster packages under the pinned compiler (make/lobster.mk's
      # dist-lobster).
      - name: install the Lobster pin
        run: |
          set -euo pipefail
          if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libopengl0 libglx0
          fi
          make dist-lobster

      - name: rewrite every pin under testdata/ from the reference
        run: make -j"$(nproc)" conformance-pin update-goldens

      - name: the pins are current
        run: |
          git diff --exit-code -- testdata/ || {
            echo "::error::a pin under testdata/ is stale: the current compiler and the C++ reference write different bytes. Run 'make conformance-pin update-goldens' and commit what changes."
            exit 1
          }
          untracked=$(git status --porcelain testdata/)
          if [ -n "$untracked" ]; then
            echo "$untracked"
            echo "::error::the re-pin wrote files that are not committed under testdata/. Add them."
            exit 1
          fi

  # THE CONFORMANCE MATRIX (test/conformance/README.md), one job per registered
  # driver. The same corpus as data, one driver per language, and the matrix
  # that says which surfaces a backend has: cross-language bit identity is the
  # property this project exists to provide, and it is an ITERATION gate — a
  # diff that moves a codec breaks it on the commit that does so.
  #
  # SHARDED PER LEG, which is what the numbers in the Makefile's `conformance`
  # comment said to do once the registry grew: a leg's wall is dominated by its
  # own toolchain and its own build, so one job per language keeps the SLOWEST
  # leg inside the two-minute rule instead of the SUM of them. It is also how
  # each leg's cost stays visible — a leg that stops fitting is named by the
  # job that missed, not buried in a total.
  #
  # THE MATRIX IS DISCOVERED, NOT TYPED. `conformance-matrix` runs the harness's
  # `matrix` command, which reads every test/conformance/<lang>/ci.json beside a
  # driver and prints one row per leg; `conformance` fans out over that. A row
  # names the make targets that build the leg, the sibling runtime it clones,
  # the toolchain step it needs and the make overrides CI passes, and every
  # step below is conditioned on a row's field rather than on a language.
  # Registering a port is its driver and its ci.json, and no edit here — unless
  # its toolchain has no step yet, in which case it adds one step keyed on a
  # new field, which is the one edit this file still takes.
  conformance-matrix:
    # Runs on a pull request only when it carries the `full-ci` label; on a
    # merge, the nightly and a dispatch it always runs. The expression is
    # repeated per job because a job-level `if:` cannot read `env`.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false

      # The Go build cache, restore only — `go-test` is the one Linux writer.
      # The block on that job carries the reasoning.
      - name: where this runner keeps the Go build cache
        shell: bash
        run: |
          echo "GO_BUILD_CACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"
          echo "GO_CACHE_ID=$(go env GOVERSION)-$(go env GOARCH)" >> "$GITHUB_ENV"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GO_BUILD_CACHE }}
          key: go-build-${{ runner.os }}-${{ env.GO_CACHE_ID }}-${{ hashFiles('**/*.go', 'go.mod') }}
          restore-keys: go-build-${{ runner.os }}-${{ env.GO_CACHE_ID }}-

      - id: discover
        name: the registry, as a matrix
        run: |
          matrix=$(go run ./test/conformance/harness matrix)
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  conformance:
    # Runs on a pull request only when it carries the `full-ci` label; on a
    # merge, the nightly and a dispatch it always runs. The expression is
    # repeated per job because a job-level `if:` cannot read `env`.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    name: conformance (${{ matrix.lang }})
    needs: conformance-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.conformance-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Siblings cloned exactly where README.md tells a newcomer to put them —
      # CI exercises the documented path rather than a special one. The
      # Makefile's SERIALIZE* defaults already point here, and the generated
      # go.mod / Cargo.toml and the C# driver's project embed relative paths
      # that only resolve under this layout. The row names the checkout and
      # the workflow variable that pins it; a leg whose generated code names no
      # runtime leaves both empty and clones nothing.
      - name: Check out the sibling runtime this leg needs (pinned release)
        if: matrix.runtime != ''
        run: |
          tag=$(printenv "${{ matrix.runtime_tag }}")
          git clone --quiet --depth 1 --branch "$tag" "https://github.com/mas-bandwidth/${{ matrix.runtime }}.git" "../${{ matrix.runtime }}"

      # bin/schema and the generated table units come out of Go in every leg.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false

      # The Go build cache, restore only — `go-test` is the one Linux writer.
      # The block on that job carries the reasoning.
      - name: where this runner keeps the Go build cache
        shell: bash
        run: |
          echo "GO_BUILD_CACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"
          echo "GO_CACHE_ID=$(go env GOVERSION)-$(go env GOARCH)" >> "$GITHUB_ENV"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GO_BUILD_CACHE }}
          key: go-build-${{ runner.os }}-${{ env.GO_CACHE_ID }}-${{ hashFiles('**/*.go', 'go.mod') }}
          restore-keys: go-build-${{ runner.os }}-${{ env.GO_CACHE_ID }}-

      # THE LUAU PIN, installed exactly as make/luau.mk's dist-luau does: the
      # same release archive, the same sha256 refused before it is unpacked,
      # and the same dist/luau-<version>/ layout the leg's LUAU default names.
      - name: install the Luau pin
        if: matrix.luau != ''
        run: make dist-luau LUAU_VERSION=${{ matrix.luau }}

      # One step per toolchain, each keyed on the row's field for it. The
      # version is the leg's to name, and it is the same pin the leg's
      # make/<lang>.mk documents for the repo-local dist/.
      #
      # .NET IS THE ONE VERSION THAT IS NOT THE LEG'S ALONE: nine csproj files
      # under test/ and bench/ name the same TargetFramework, and certify.yml
      # builds all of them. So the row names WHERE the pin lives and
      # .github/dotnet-version holds it, read by both files; internal/ci's gate
      # fails when a csproj and that pin disagree (issue #470).
      - name: read the .NET SDK pin
        if: matrix.dotnet != ''
        run: echo "DOTNET_SDK_PIN=$(cat .github/dotnet-version)" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: matrix.dotnet != ''
        with:
          dotnet-version: ${{ env.DOTNET_SDK_PIN }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.node != ''
        with:
          node-version: ${{ matrix.node }}

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # the stable BRANCH head — the SHA freezes the action, not the compiler: rustup resolves stable at run time
        if: matrix.rust != ''

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        if: matrix.dart != ''
        with:
          sdk: ${{ matrix.dart }}

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        if: matrix.java != ''
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}

      # The BEAM is two versions and one step. No ELIXIRC override is needed:
      # make/elixir.mk's default prefixes the repo-local dist/ onto PATH and
      # falls through to the toolchain this step installed.
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        if: matrix.otp != ''
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      # The LUA leg's toolchain is the pinned PUC-Rio interpreter, built from
      # source exactly as `make dist-lua` builds it (make/lua.mk holds the pin
      # and its sha256; the row's `lua` field is the version). The row's env
      # carries LUA=lua, so the built interpreter lands on PATH.
      - name: install the pinned Lua interpreter
        if: matrix.lua != ''
        run: |
          make dist-lua
          mkdir -p "$HOME/.local/bin"
          ln -sf "$PWD/dist/lua-${{ matrix.lua }}/src/lua" "$HOME/.local/bin/lua"

      # The moo pin (make/moo.mk, MOO_PIN), for a row whose ci.json or group
      # names `moo`: .github/actions/moo builds it once per runner image and
      # caches it under the pin.
      - uses: ./.github/actions/moo
        if: matrix.moo != ''

      # THE LOBSTER PIN, installed exactly as make/lobster.mk's dist-lobster
      # does: the same release archive, the same sha256 refused before it is
      # unpacked, and the same dist/lobster-<version>/ layout the leg's LOBSTER
      # default names. The row's field is the version. The release binary
      # links libOpenGL and libGLX, which the hosted ubuntu image does not carry.
      - name: install the Lobster pin
        if: matrix.lobster != ''
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopengl0 libglx0
          make dist-lobster LOBSTER_VERSION=${{ matrix.lobster }}

      # THE SQUIRREL STEP: the pinned interpreter is built from source, exactly
      # as `make dist-squirrel` does (make/squirrel.mk), and its binary is put
      # on PATH so the leg's `SQ=sq` (ci.json) resolves.
      - name: build and install the pinned Squirrel interpreter
        if: matrix.squirrel != ''
        run: |
          make dist-squirrel
          mkdir -p "$HOME/.local/bin"
          ln -sf "$PWD/dist/squirrel-3.2/bin/sq" "$HOME/.local/bin/sq"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Its own step so the run log carries the build cost and the run cost
      # separately — the two halves answer different questions when a leg
      # stops fitting. The row's env is the make overrides CI needs: a JDK on
      # PATH rather than in dist/, cargo not in a homebrew keg.
      - name: build the harness and the ${{ matrix.lang }} driver
        run: make ${{ matrix.targets }} ${{ matrix.env }}

      - name: the ${{ matrix.lang }} leg over every surface
        run: env ${{ matrix.env }} ./build/conformance-harness run --only ${{ matrix.lang }}

  # C# WIRE AND REGION FUZZ (issue #751).
  #
  # The C# table wire is one of the four live table-wire languages on the roadmap
  # (#748). Issue #751 found a wire-fuzz divergence in pointer arm trailing bytes.
  # In accordance with the owner's rule, tests that fit under 2 minutes belong on
  # the per-PR CI gate rather than solely in nightly certification.
  #
  # Running as its own matrix rows keeps each fuzz target well under 1 minute
  # (wire fuzz ~26 s, region fuzz ~39 s) without bloating the conformance (cs)
  # leg over the 2-minute ceiling.
  cs-fuzz:
    # Runs on a pull request only when it carries the `full-ci` label; on a
    # merge, the nightly and a dispatch it always runs. The expression is
    # repeated per job because a job-level `if:` cannot read `env`.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    name: C# fuzz (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: tables-cs-wire-fuzz
            name: wire
          - target: tables-cs-region-fuzz
            name: region

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out the serialize.cs runtime (pinned release)
        run: |
          git clone --quiet --depth 1 --branch "$SERIALIZE_CS_TAG" https://github.com/mas-bandwidth/serialize.cs.git ../serialize.cs

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false

      # The Go build cache, restore only — `go-test` is the one Linux writer.
      # The block on that job carries the reasoning.
      - name: where this runner keeps the Go build cache
        shell: bash
        run: |
          echo "GO_BUILD_CACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"
          echo "GO_CACHE_ID=$(go env GOVERSION)-$(go env GOARCH)" >> "$GITHUB_ENV"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GO_BUILD_CACHE }}
          key: go-build-${{ runner.os }}-${{ env.GO_CACHE_ID }}-${{ hashFiles('**/*.go', 'go.mod') }}
          restore-keys: go-build-${{ runner.os }}-${{ env.GO_CACHE_ID }}-

      - name: read the .NET SDK pin
        run: echo "DOTNET_SDK_PIN=$(cat .github/dotnet-version)" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_SDK_PIN }}

      - name: build the harness and the C# driver
        run: make build/conformance-harness build-conformance-cs

      - name: run C# ${{ matrix.name }} fuzz
        run: make ${{ matrix.target }}

  # JAVASCRIPT WIRE FUZZ (docs/PORTING.md I15, the js cell; #492).
  #
  # The harness's differential wire fuzzer over its whole default roster
  # through the JavaScript driver, the plain arm and the --retain arm, at the
  # Makefile's default SEED and N (the same as cs-fuzz). The enumerated pass is
  # most of the cost (about 154,000 mutants plain, 87,000 retain) and does not
  # change with N. Measured on a workstation: 43 s per arm, 88 s for the two in
  # one make call, so each arm is its own matrix row (make/js.mk's
  # tables-js-wire-fuzz-plain and -retain, the two halves of
  # tables-js-wire-fuzz-all) to keep a row well inside its five minutes once
  # the setup is paid. Node comes from the same pin the js
  # conformance row reads (test/conformance/js/ci.json), and NODE=node is that
  # row's env, so make/js.mk's repo-local dist/ default is not used here.
  # Its negative control, tables-js-wire-fuzz-negative-control, rides in the
  # js group of the negative-controls job.
  js-fuzz:
    # Runs on a pull request only when it carries the `full-ci` label; on a
    # merge, the nightly and a dispatch it always runs. The expression is
    # repeated per job because a job-level `if:` cannot read `env`.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    name: JavaScript fuzz (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: wire
            target: tables-js-wire-fuzz-plain
          - name: retain
            target: tables-js-wire-fuzz-retain

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false

      # The Go build cache, restore only — `go-test` is the one Linux writer.
      # The block on that job carries the reasoning.
      - name: where this runner keeps the Go build cache
        shell: bash
        run: |
          echo "GO_BUILD_CACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"
          echo "GO_CACHE_ID=$(go env GOVERSION)-$(go env GOARCH)" >> "$GITHUB_ENV"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GO_BUILD_CACHE }}
          key: go-build-${{ runner.os }}-${{ env.GO_CACHE_ID }}-${{ hashFiles('**/*.go', 'go.mod') }}
          restore-keys: go-build-${{ runner.os }}-${{ env.GO_CACHE_ID }}-

      - name: read the node pin of the js conformance row
        run: echo "JS_NODE_PIN=$(jq -r .node test/conformance/js/ci.json)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.JS_NODE_PIN }}

      - name: build the harness and the generated JavaScript units
        run: make build/conformance-harness build/tables-generated-js/.stamp cards-js-generate

      - name: run the JavaScript ${{ matrix.name }} fuzz
        run: make ${{ matrix.target }} NODE=node


  # DART WIRE FUZZ (docs/PORTING.md I15). The tolerant wire's differential
  # fuzzer, with the compiler's own engine as the oracle, over every file root
  # the Dart wire surface carries: the plain Load/Save run and the message arm.
  # Its own job keeps the target off the conformance (dart) leg's clock. The
  # Dart leg clones no runtime (generated Dart is self-contained), so the job is
  # Go and the pinned SDK only.
  dart-fuzz:
    # Runs on a pull request only when it carries the `full-ci` label; on a
    # merge, the nightly and a dispatch it always runs. The expression is
    # repeated per job because a job-level `if:` cannot read `env`.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    name: Dart fuzz (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: tables-dart-wire-fuzz
            name: wire

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false

      # The Go build cache, restore only — `go-test` is the one Linux writer.
      # The block on that job carries the reasoning.
      - name: where this runner keeps the Go build cache
        shell: bash
        run: |
          echo "GO_BUILD_CACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"
          echo "GO_CACHE_ID=$(go env GOVERSION)-$(go env GOARCH)" >> "$GITHUB_ENV"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GO_BUILD_CACHE }}
          key: go-build-${{ runner.os }}-${{ env.GO_CACHE_ID }}-${{ hashFiles('**/*.go', 'go.mod') }}
          restore-keys: go-build-${{ runner.os }}-${{ env.GO_CACHE_ID }}-

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: '3.13.2'

      - name: build the harness and the Dart driver
        run: make build/conformance-harness build/conformance-dart DART=dart

      - name: run Dart ${{ matrix.name }} fuzz
        run: make ${{ matrix.target }} DART=dart


  # THE C# TABLES LEG, PER PULL REQUEST. Before this job the leg ran in no
  # pull-request job at all — it was reached only through `make test` and the
  # nightly certification — and on 2026-09-08 #728's pull-request checks were
  # all green while its head had this leg red across five SharedVocabSplice
  # checks (the fix landed as #734). Nothing on the gate named it, so nothing
  # said a word.
  #
  # It is sharded one matrix row per build configuration because the owner's
  # rule is per job and a matrix row is a job: Debug and Release are the two
  # commands the leg's recipe already runs, so each row fits the rule on its
  # own rather than the leg being cut to fit as a whole. Measured on this
  # bench, the leg ran both configurations in 7m51s wall clock (1m48s user) on
  # a one-core runner carrying a ~17 load from sibling jobs, so a single
  # configuration measured over the two-minute rule here — that is a contention
  # artifact, not a reason to stay nightly; the issue's nightly branch is the
  # owed alternative if it proves real on a dedicated runner. The umbrella
  # target still runs both halves in order for `make test` and the nightly;
  # this job runs one half per row.
  #
  # internal/ci/tableslegs_test.go is what keeps this job from being quietly
  # deleted: TestEveryNamedTableLegRunsOnEveryPullRequest refuses a named leg
  # with no pull-request coverage.
  cs-tables:
    name: C# tables leg (${{ matrix.config }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        config: [debug, release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out the serialize.cs runtime (pinned release)
        run: |
          git clone --quiet --depth 1 --branch "$SERIALIZE_CS_TAG" https://github.com/mas-bandwidth/serialize.cs.git ../serialize.cs

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false

      # The Go build cache, restore only — `go-test` is the one Linux writer.
      # The block on that job carries the reasoning.
      - name: where this runner keeps the Go build cache
        shell: bash
        run: |
          echo "GO_BUILD_CACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"
          echo "GO_CACHE_ID=$(go env GOVERSION)-$(go env GOARCH)" >> "$GITHUB_ENV"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GO_BUILD_CACHE }}
          key: go-build-${{ runner.os }}-${{ env.GO_CACHE_ID }}-${{ hashFiles('**/*.go', 'go.mod') }}
          restore-keys: go-build-${{ runner.os }}-${{ env.GO_CACHE_ID }}-

      - name: read the .NET SDK pin
        run: echo "DOTNET_SDK_PIN=$(cat .github/dotnet-version)" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_SDK_PIN }}

      - name: generate the C# table corpus once
        run: make -j"$(nproc)" bin/schema build/tables-generated-cs/.stamp

      - name: run the leg
        run: make tables-cs-leg-${{ matrix.config }}


  # DOGFOOD BIG-ENDIAN (issue #303). docs/SPEC-TABLES.md §3 says the wire is
  # little-endian and byte-oriented throughout; §7 says a cook is produced in
  # the byte order of the build it is cooked for, and that Open refuses any
  # other. Every host this repo has built on is little-endian, so both rules
  # were assertions on a page: a generated codec that reached for HOST order
  # anywhere would have passed every other leg in this file, and the goldens
  # would have said nothing.
  #
  # This leg builds the tables battery for s390x — big-endian, and the target
  # both qemu-user and the Ubuntu gcc cross packages support best — and runs it
  # under emulation, plus a cross-endian cook pair the host and the target hand
  # to each other. Its negative control puts one byte-order-neutral store back
  # to a host-order copy and proves the leg goes red on the target while
  # staying green here, which is the whole argument for having it.
  #
  # It is an iteration gate, not a certification one — it answers a question
  # about the code in the diff, not about the compiler that built it — and it
  # fits the budget now that it is sharded by unit (issue #684): one row per
  # independent piece, so the run pays the longest piece rather than the sum.
  # The controls keep their own rows, so nothing runs less than it did.
  #
  # THE PINS. The runner image is named rather than `-latest`, because package
  # versions are only meaningful against one archive; the cross compiler and
  # the emulator are then installed by EXACT version, so this leg proves the
  # same thing next month as today. Bumping either is a deliberate one-line
  # edit, the same act as the golangci-lint pin below, and the versions come
  # from the policy the failing install prints. The step after the install
  # records the resolved closure both pins pull in.
  big-endian:
    name: big-endian (${{ matrix.leg }})
    # Runs on a pull request only when it carries the `full-ci` label; on a
    # merge, the nightly and a dispatch it always runs. The expression is
    # repeated per job because a job-level `if:` cannot read `env`.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # ONE PIECE PER ROW (issue #684). The pieces share nothing but bin/schema
      # and the generated tree, which each row rebuilds in about fifteen
      # seconds; in one job the run paid their SUM. The Makefile carries the
      # same pieces as targets of their own and
      # `tables-big-endian-negative-control` still runs the leg and the control
      # in order.
      #
      # The `control` row is `tables-big-endian-control-only`: the C++ negative
      # control's own recipe, without the leg in front of it, because the leg
      # is the `tables` and `collections` rows and the pair is the same pair
      # whether one job runs them or three. `c-control` is the C twin. They are
      # what prove the matrix can go red.
      matrix:
        include:
          - leg: tables
            target: tables-big-endian-tables
          - leg: collections
            target: tables-big-endian-collections
          - leg: cook
            target: tables-cook-endian
          - leg: c
            target: tables-c-big-endian
          - leg: control
            target: tables-big-endian-control-only
          - leg: c-control
            target: tables-c-big-endian-negative-control
          - leg: go
            target: conformance-big-endian
          - leg: go-control
            target: conformance-big-endian-negative-control
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false

      # The Go build cache, restore only — `go-test` is the one Linux writer.
      # The block on that job carries the reasoning.
      - name: where this runner keeps the Go build cache
        shell: bash
        run: |
          echo "GO_BUILD_CACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"
          echo "GO_CACHE_ID=$(go env GOVERSION)-$(go env GOARCH)" >> "$GITHUB_ENV"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GO_BUILD_CACHE }}
          key: go-build-${{ runner.os }}-${{ env.GO_CACHE_ID }}-${{ hashFiles('**/*.go', 'go.mod') }}
          restore-keys: go-build-${{ runner.os }}-${{ env.GO_CACHE_ID }}-

      - name: the pinned cross toolchain and emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-13-s390x-linux-gnu=13.3.0-6ubuntu2~24.04.1cross1 \
            qemu-user=1:8.2.2+ds-0ubuntu1.18

      - name: what the pins resolved to
        run: |
          s390x-linux-gnu-g++-13 --version | head -1
          qemu-s390x --version | head -1
          dpkg-query -W -f='${Package} ${Version}\n' | grep -E 's390x|^qemu-user'

      # BOTH siblings in every row, the argument the negative-control rows make
      # one door over: a table unit declaring a 128-bit field takes its storage
      # type from serialize.h, a generated unit's PACKET sources import the Go
      # runtime, and which of those a leg reaches for belongs to the leg rather
      # than to this list. Two shallow clones cost two seconds and remove the
      # whole class of "the row forgot a sibling".
      - name: Check out the serialize runtimes (pinned releases)
        run: |
          cd ..
          git clone --quiet --depth 1 --branch "$SERIALIZE_TAG"    https://github.com/mas-bandwidth/serialize.git    serialize
          git clone --quiet --depth 1 --branch "$SERIALIZE_GO_TAG" https://github.com/mas-bandwidth/serialize.go.git serialize.go

      # -j BECAUSE EVERY ROW STILL HAS BINARIES TO BUILD. BE_CXX and BE_CC name
      # the pinned compilers: the exact-version package installs the SUFFIXED
      # drivers, and the Makefile's unsuffixed defaults are for a workstation
      # that installed the metapackage. The C leg needs the C driver because the
      # tolerant wire has a C reader too, and the g++ cross package pulls its
      # gcc sibling in.
      #
      # The Go row cross-compiles, so the conformance driver is one env var away
      # from a big-endian binary, and the harness's own goldens become the gate:
      # a big-endian reader loads what a little-endian host wrote, writes it
      # back, and is byte-compared over the wire, the read report and the text
      # form. It needs the Go runtime checkout even though the table codec names
      # no runtime at all: a generated unit's PACKET sources sit in the same
      # package as its table sources, and those import it — hence both siblings
      # above, in every row.
      - name: ${{ matrix.target }}
        run: make -j"$(nproc)" ${{ matrix.target }} BE_CXX=s390x-linux-gnu-g++-13 BE_CC=s390x-linux-gnu-gcc-13

  # Self-contained Go lint job; .golangci.yml carries the config.
  lint:
    # Runs on a pull request only when it carries the `full-ci` label; on a
    # merge, the nightly and a dispatch it always runs. The expression is
    # repeated per job because a job-level `if:` cannot read `env`.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # PINNED to the module's own Go version, and it moves WITH the
      # golangci-lint pin below. golangci-lint links a copy of the Go
      # typechecker, so a linter release can only typecheck the toolchains
      # that existed when it shipped: `stable` + a pinned linter is a pairing
      # that goes red on its own, with no commit, the day Go releases.
      # Bumping the linter is a two-line, deliberate act: this version and
      # that one, together.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false

      # The Go build cache, restore only — `go-test` is the one Linux writer.
      # The block on that job carries the reasoning.
      - name: where this runner keeps the Go build cache
        shell: bash
        run: |
          echo "GO_BUILD_CACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"
          echo "GO_CACHE_ID=$(go env GOVERSION)-$(go env GOARCH)" >> "$GITHUB_ENV"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GO_BUILD_CACHE }}
          key: go-build-${{ runner.os }}-${{ env.GO_CACHE_ID }}-${{ hashFiles('**/*.go', 'go.mod') }}
          restore-keys: go-build-${{ runner.os }}-${{ env.GO_CACHE_ID }}-

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "$out"
            echo "::error::gofmt differs — run gofmt -w on the files above"
            exit 1
          fi
      - name: go mod tidy
        run: go mod tidy -diff
      # CI LINTS ITSELF (issues #470, #472). Two invariants a reader cannot hold
      # by hand across three workflow files: every `uses:` names a full commit
      # SHA and no tool runs `@latest`, and every csproj's TargetFramework
      # matches the one .NET SDK pin. It is a Go test, so `go test ./...` and
      # `make test` carry it too; this step is where the verdict is named.
      - name: CI lints itself — action pins and the .NET SDK pin
        run: go test ./internal/ci/
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # pinned so releases with new checks break CI deliberately, not
          # randomly; bump by hand
          version: v2.12.2
      # PINNED for the same reason as golangci-lint above: a release with new
      # rules breaks CI deliberately, not overnight. The version is gopls's own
      # module tag; bump by hand.
      - name: modernize
        run: go run golang.org/x/tools/gopls/internal/analysis/modernize/cmd/modernize@v0.23.0 ./...
      - name: bench scripts parse
        run: bash -n bench/run.sh
      # Both locked legs (cpp and c) hold their curve on their own machine,
      # and on every (machine, corpus_id) axis the NEWEST certified pass that
      # publishes a figure keeps c inside §2.8's tie band of cpp. Older
      # certified passes on the axis are history: they print, one line each,
      # and gate nothing.
      # stdout is the series; the verdicts are on stderr and stay visible.
      - name: absolute ledger — the cpp and c curves hold, and the pair stays locked
        run: go run ./bench/tools ledger --check > /dev/null
      - name: render smoke — the headline table renders from a committed CSV
        run: |
          # newest committed sweep: older CSVs predate the round_trip contract
          # and the render REFUSES them by design (#175). A plan-read sitting's
          # raw rounds (bench/BENCH-STANDARD.md, the plan-read arm) are not a
          # sweep and have no headline section, so they are not candidates.
          csv=$(ls bench/results/*.csv | grep -v -- '-plan-read-' | tail -1)
          out=$(./bench/run.sh --render "$csv" 2>&1)
          echo "$out"
          echo "$out" | grep -q "language        %" || { echo "::error::render printed no table header"; exit 1; }
          rows=$(echo "$out" | grep -cE "^  [a-z]+ ")
          [ "$rows" -ge 1 ] || { echo "::error::render printed zero language rows"; exit 1; }

  # A new CVE lands with no commit, so govulncheck is the one gate whose
  # verdict changes on its own. It rides the pull request here AND the nightly
  # in certify.yml — the same job in both files, deliberately, because neither
  # trigger substitutes for the other.
  vuln:
    # Runs on a pull request only when it carries the `full-ci` label; on a
    # merge, the nightly and a dispatch it always runs. The expression is
    # repeated per job because a job-level `if:` cannot read `env`.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      # The Go build cache, restore only — `go-test` is the one Linux writer.
      # The block on that job carries the reasoning.
      - name: where this runner keeps the Go build cache
        shell: bash
        run: |
          echo "GO_BUILD_CACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"
          echo "GO_CACHE_ID=$(go env GOVERSION)-$(go env GOARCH)" >> "$GITHUB_ENV"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GO_BUILD_CACHE }}
          key: go-build-${{ runner.os }}-${{ env.GO_CACHE_ID }}-${{ hashFiles('**/*.go', 'go.mod') }}
          restore-keys: go-build-${{ runner.os }}-${{ env.GO_CACHE_ID }}-

      # THE PIN AND THE RETRIES LIVE IN THE TREE, NOT IN THIS FILE. `make vuln`
      # runs tools/vuln/govulncheck.sh, which carries the scanner's pin (the
      # Makefile's GOVULNCHECK_VERSION, bumped by hand), three attempts 15 s
      # then 45 s apart, and the classifier that decides whether a red one is
      # this tree's fault. `make` is the one entry (AGENTS.md rule 6), and a
      # classifier that lives in the tree is one `make test` can hold to its
      # fixtures — which is what tools/vuln/testdata/cases.txt does, including
      # the two log excerpts a looser classifier read as an outage.
      #
      # ONLY THE TRANSPORT IS RETRIED AND ONLY THE TRANSPORT IS EVER FORGIVEN:
      # a finding fails on the first attempt, and so does any other failure.
      # THIS gate forgives a database that never answers, because a
      # contributor's diff cannot be judged by vuln.go.dev's uptime; the
      # nightly in certify.yml runs `make vuln-strict` and goes RED on the same
      # outage, so an outage is never green everywhere at once.
      #
      # INSIDE THE 10-MINUTE CAP with room to spare: the scan measures 35 s on
      # this runner and 9.4 s on a 64-core bench, so three attempts and two
      # sleeps is 3 x 35 s + 15 s + 45 s = 2:45 worst case. The cap is there for
      # a scan that HANGS instead of failing, and it still ends the job.
      - name: govulncheck
        run: make vuln

  # The compiler that generates C++ for a Windows-targeting game engine, run on
  # Windows: vet + build, cheap enough to ride every pull request. What it
  # EMITS is compiled with cl by the `msvc` job below.
  windows:
    # Runs on a pull request only when it carries the `full-ci` label; on a
    # merge, the nightly and a dispatch it always runs. The expression is
    # repeated per job because a job-level `if:` cannot read `env`.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      # The Go build cache. This job is the Windows half of the pair — it
      # restores here and saves at the bottom. The block on `go-test` carries
      # the reasoning. GOCACHE is read rather than written down because on
      # this runner it is not ~/.cache/go-build at all.
      - name: where this runner keeps the Go build cache
        shell: bash
        run: |
          echo "GO_BUILD_CACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"
          echo "GO_CACHE_ID=$(go env GOVERSION)-$(go env GOARCH)" >> "$GITHUB_ENV"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GO_BUILD_CACHE }}
          key: go-build-${{ runner.os }}-${{ env.GO_CACHE_ID }}-${{ hashFiles('**/*.go', 'go.mod') }}
          restore-keys: go-build-${{ runner.os }}-${{ env.GO_CACHE_ID }}-

      - run: go vet ./...
      - run: go build ./...

      # THE ONE WINDOWS WRITER. Vet and build above cover the whole module, so
      # this is the widest Windows cache available, and `msvc` — which builds
      # bin/schema.exe and nothing else in Go — restores it.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GO_BUILD_CACHE }}
          key: go-build-${{ runner.os }}-${{ env.GO_CACHE_ID }}-${{ hashFiles('**/*.go', 'go.mod') }}

  # MSVC over the generated corpus (issue #286). The estate's standing rule is
  # that Visual C++ is a hard requirement — emulate extensions, never require
  # them — and until this job existed nothing in this file compiled a single
  # line of what the compiler EMITS with cl. The `windows` job above proves the
  # COMPILER runs on Windows; this one proves its OUTPUT builds there.
  #
  # AN ITERATION GATE: it runs on every pull request, and the one-to-two
  # minute rule is what says it may. Whole job, three runs on identical input:
  # 1:18, 1:08, 1:09. The corpus step itself is 19, 16 and 17 s of that; the
  # rest is checkout, Go, the serialize clone and vcvars.
  #
  # WHERE THE TIME GOES, per translation unit (and the reason this job compiles
  # one TU at a time): nothing dominates. The whole 44-TU corpus is about
  # twenty seconds, the first cl invocation of the job carries several of them
  # on its own — toolchain and STL headers cold — and no unit past it costs
  # more than half a second.
  #
  # WHAT IT GUARDS BEYOND COMPILING. cl's front end expands a
  # value-initialisation of a large aggregate element by element, at O(bytes)
  # — which is why the emitted header never writes `T{}` over a table and
  # prefills member by member instead (#320). One such `T{}` over
  # blockdemo::RenderFrame, a 7 879 320-byte aggregate, costs cl about six
  # seconds in a translation unit clang compiles whole in 0.15 s, and this job
  # is the only place in the tree where that is visible at all.
  #
  # THE PIN. The image is NAMED rather than `-latest`, the argument the
  # big-endian leg makes: which extensions cl accepts is exactly a
  # toolchain-version fact, so the image it comes from has to be a decision
  # rather than whatever `-latest` moved to overnight. windows-2025 carries
  # Visual Studio 2026 (cl 19.51.x); the compile step prints what the pin
  # actually resolved to on the day.
  #
  # THE CORPUS is the tables corpus plus every packet header emitted beside it,
  # not `make test` — `make test` needs the six sibling runtime clones, the
  # three self-contained targets' toolchains and a POSIX toolchain. This job
  # needs one sibling (serialize, header-only, and only the packet headers
  # include it) and cl.
  #
  # THE TIMING IS PART OF THE OUTPUT. One cl invocation per translation unit,
  # each preceded by a clock line, so the log shows where the cost is and how
  # far it swings between runs. That is what turned #316's "the corpus does not
  # compile" into two named emitter defects and #320's ~20 s per TU into one
  # named one. It is also why /MP is absent: parallel TUs are faster and
  # unmeasurable, and here the measurement is worth more than the seconds.
  msvc:
    # Runs on a pull request only when it carries the `full-ci` label; on a
    # merge, the nightly and a dispatch it always runs. The expression is
    # repeated per job because a job-level `if:` cannot read `env`.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      # The Go build cache, restore only — `windows` is the one Windows
      # writer. The block on `go-test` carries the reasoning.
      - name: where this runner keeps the Go build cache
        shell: bash
        run: |
          echo "GO_BUILD_CACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"
          echo "GO_CACHE_ID=$(go env GOVERSION)-$(go env GOARCH)" >> "$GITHUB_ENV"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GO_BUILD_CACHE }}
          key: go-build-${{ runner.os }}-${{ env.GO_CACHE_ID }}-${{ hashFiles('**/*.go', 'go.mod') }}
          restore-keys: go-build-${{ runner.os }}-${{ env.GO_CACHE_ID }}-

      # The one sibling this leg needs, at the same pin every other job uses.
      # Header-only, and only the PACKET headers (<Base>.h / <Base>Wire.h)
      # reach for it — a table header includes nothing of it.
      - name: Check out the serialize runtime (pinned release)
        shell: bash
        run: git clone --quiet --depth 1 --branch "$SERIALIZE_TAG" https://github.com/mas-bandwidth/serialize.git ../serialize

      # Generation and script emission happen in bash because they are readable
      # there; the cl steps stay short. The corpus list mirrors the Makefile's
      # tables_generate macro and cannot reuse it — the runner image carries no
      # make, and installing one to share ten lines would cost more than the
      # ten lines.
      - name: Generate the corpus and the cl scripts
        shell: bash
        run: |
          set -e
          go build -o bin/schema.exe ./cmd/schema
          rm -rf build/msvc build/msvc-negative build/msvc-obj
          mkdir -p build/msvc
          while read -r out src; do
            ./bin/schema.exe generate --lang cpp --out "build/msvc/$out" "$src"
          done <<'UNITS'
          examples tables/examples
          pointers tables/pointers
          block tables/block
          blockhome tables/blockhome
          v1 test/tables/V1.schema
          v2 test/tables/V2.schema
          p1 test/tables/P1.schema
          p2 test/tables/P2.schema
          p3 test/tables/P3.schema
          jsonkeys test/tables/JsonKeys.schema
          UNITS

          # Every unit gets an _AllHeaders.cpp, because compiling only the
          # emitted .cpp files would leave two classes of header unbuilt: the
          # packet headers have no .cpp of their own, and a unit whose tables
          # are ALL variable-length emits no .cpp at all (test/tables/P2.schema
          # is that unit). A header that HAS a .cpp is left out of it — it is
          # already a translation unit, and on the block unit compiling it
          # twice costs more than the whole rest of the corpus.
          for d in build/msvc/*/; do
            u=$(basename "$d")
            : > "$d/_AllHeaders.cpp"
            for h in "$d"*.h; do
              b=$(basename "$h" .h)
              [ -f "$d$b.cpp" ] && continue
              echo "#include \"$b.h\"" >> "$d/_AllHeaders.cpp"
            done
            echo "int schema_msvc_all_$u = 0;" >> "$d/_AllHeaders.cpp"
          done

          # vcvars, once, for both cl steps to call: a step's environment does
          # not survive into the next one.
          {
            echo "@echo off"
            echo "for /f \"usebackq tokens=*\" %%i in (\`\"%ProgramFiles(x86)%\\Microsoft Visual Studio\\Installer\\vswhere.exe\" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath\`) do set \"VSPATH=%%i\""
            echo "call \"%VSPATH%\\VC\\Auxiliary\\Build\\vcvars64.bat\""
          } > build/msvc/vc.cmd

          # One cl per translation unit, each with a clock line in front of it.
          # /Itest\tables for the same reason the Makefile's tables legs carry
          # -Itest/tables: a `cpp_native` type names its own header through
          # `cpp_include`, and tables/pointers' Colour names one that lives
          # with the tests.
          {
            echo "@echo off"
            for d in build/msvc/*/; do
              u=$(basename "$d")
              echo "mkdir build\\msvc-obj\\$u"
              for f in "$d"*.cpp; do
                n=$(basename "$f")
                echo "echo [%TIME%] $u/$n"
                echo "cl /nologo /c /W4 /WX /std:c++17 /permissive- /EHsc /Ibuild\\msvc\\$u /Itest\\tables /I..\\serialize /Fobuild\\msvc-obj\\$u\\ build\\msvc\\$u\\$n || exit /b 1"
              done
            done
            echo "echo [%TIME%] corpus done"
          } > build/msvc/compile.cmd

          # THE NEGATIVE CONTROL. A GNU statement expression — gcc and clang
          # take it under -Wall -Wextra -Werror without a word, cl cannot parse
          # it — planted in one generated header of a copied tree. The green
          # above proves nothing unless this goes red.
          cp -r build/msvc/examples build/msvc-negative
          rm -f build/msvc-negative/_AllHeaders.cpp
          printf '\nnamespace tabledemo { inline int schema_msvc_negative_control() { return ({ 1; }); } }\n' >> build/msvc-negative/GuardedTable.h
          {
            echo "@echo off"
            echo "mkdir build\\msvc-obj\\negative"
            echo "cl /nologo /c /W4 /WX /std:c++17 /permissive- /EHsc /Ibuild\\msvc-negative /Fobuild\\msvc-obj\\negative\\ build\\msvc-negative\\GuardedTable.cpp"
          } > build/msvc/negative.cmd

      - name: cl /W4 /WX over the generated corpus, one translation unit at a time
        shell: cmd
        run: |
          call build\msvc\vc.cmd || exit /b 1
          echo ---- what the windows-2025 pin resolved to ----
          cl 2>&1 | findstr /C:"Version"
          echo ---- the corpus, one cl per translation unit ----
          call build\msvc\compile.cmd || exit /b 1

      # Its own step, and it ASSERTS the failure: a control that is merely run
      # proves nothing. The planted extension must make cl refuse, and if cl
      # accepts it the step goes red saying exactly why that matters.
      - name: negative control — cl must REFUSE a GNU extension in a generated header
        shell: cmd
        run: |
          call build\msvc\vc.cmd || exit /b 1
          call build\msvc\negative.cmd && (echo ::error::NEGATIVE CONTROL FAILED: cl accepted a GNU statement expression in a generated header, so this leg cannot catch the class it exists for & exit /b 1)
          echo negative control red as required: cl refused the planted extension
          rem the control's FAILURE is this step's success, and echo does not
          rem clear ERRORLEVEL — without this the step inherits the exit code of
          rem the compile that was SUPPOSED to fail
          exit /b 0

  # The one-benchmark rule, made mechanical. The estate has exactly one
  # sanctioned benchmark — this repo's data-driven bench — and shape knowledge
  # belongs in bench/corpus and the generated code. This job refuses a commit
  # that hand-codes measurement of a schema shape anywhere else. Every current
  # exception is named in a SHAPE-GATE.allow — bench/SHAPE-GATE.allow for shared
  # tooling, one beside each leg for its own — with an exact count that can
  # only shrink.
  shape-gate:
    # Runs on a pull request only when it carries the `full-ci` label; on a
    # merge, the nightly and a dispatch it always runs. The expression is
    # repeated per job because a job-level `if:` cannot read `env`.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false

      # The Go build cache, restore only — `go-test` is the one Linux writer.
      # The block on that job carries the reasoning.
      - name: where this runner keeps the Go build cache
        shell: bash
        run: |
          echo "GO_BUILD_CACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"
          echo "GO_CACHE_ID=$(go env GOVERSION)-$(go env GOARCH)" >> "$GITHUB_ENV"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GO_BUILD_CACHE }}
          key: go-build-${{ runner.os }}-${{ env.GO_CACHE_ID }}-${{ hashFiles('**/*.go', 'go.mod') }}
          restore-keys: go-build-${{ runner.os }}-${{ env.GO_CACHE_ID }}-

      - name: refuse hand-coded shape measurement
        run: go run ./bench/tools/shapegate

  # The C/C++ reference lock (owner ruling 2026-08-31, issue #170): while
  # bench/LOCK exists, a change touching any locked prefix refuses. The lift is
  # a pull request whose whole diff is bench/LOCK itself — visible by
  # construction.
  #
  # IT NO LONGER SKIPS ITSELF OUTSIDE `pull_request` (issue #368). A worker
  # whose pull request gets no run — the conflicted-merge-ref case in this
  # file's header — falls back to `gh workflow run`, and a fallback that
  # quietly drops the lock is a fallback that lets a locked path through. The
  # base is the pull request's own when there is one and `main` otherwise,
  # which is the same comparison a dispatch on a branch wants. On a push to
  # main the diff against main is empty and the job is a no-op that says so.
  cpp-lock:
    # Runs on a pull request only when it carries the `full-ci` label; on a
    # merge, the nightly and a dispatch it always runs. The expression is
    # repeated per job because a job-level `if:` cannot read `env`.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: refuse locked-path changes
        run: |
          [ -f bench/LOCK ] || { echo "no bench/LOCK — guard inactive"; exit 0; }
          base="origin/${{ github.base_ref || 'main' }}"
          changed="$(git diff --name-only "$base"...HEAD)"
          echo "changed files vs $base:"; echo "$changed"
          if [ "$changed" = "bench/LOCK" ]; then
            echo "diff touches only bench/LOCK — the lift act, allowed"; exit 0
          fi
          prefixes="$(grep -v '^#' bench/LOCK | grep -v '^[[:space:]]*$' || true)"
          if [ -z "$prefixes" ]; then
            echo "bench/LOCK carries no active prefixes (a carve window) — guard inactive"; exit 0
          fi
          violations=""
          while IFS= read -r f; do
            while IFS= read -r p; do
              case "$f" in "$p"*) violations="$violations$f (locked: $p)"$'\n';; esac
            done <<< "$prefixes"
          done <<< "$changed"
          if [ -n "$violations" ]; then
            echo "C/C++ LOCK REFUSAL — these paths are frozen while bench/LOCK stands (issue #170):"
            printf '%s' "$violations"
            exit 1
          fi
          echo "no locked paths touched — clean"

  # EVERY NEGATIVE CONTROL, ON THE PULL REQUEST (issue #563).
  #
  # A negative control proves a gate is watching: it breaks what the gate
  # watches and requires the gate to go red. Each one already refuses when its
  # sabotage patches nothing, so a control whose sed pattern has drifted off its
  # target line says so out loud. That refusal only helps somebody who reads it,
  # and until this leg the only reader was `make test`, which lives in
  # certify.yml and runs AFTER a merge. Twice on 2026-09-05 main went red on a
  # merge whose pull-request run was 20 of 20 green, and one of the two was
  # exactly this: #562 rewrote the line the maps fit control's pattern aimed at,
  # the sabotage patched nothing, and the control refused on main.
  #
  # THE TARGET LIST IS ENUMERATED, NOT TYPED. `tools/negativecontrols` reads the
  # Makefile and every file the Makefile includes, and holds what it finds
  # against make/negative-controls.json. A control this tree defines is in a
  # group here or in that file's exclusion list with a reason, and the tool's
  # test, which `go-test` runs as part of `go test ./...` and which the matrix
  # job below runs again on its own, goes red on any other outcome. So a
  # control added tomorrow cannot be left out of this leg by forgetting a line
  # in a workflow.
  #
  # GROUPED BY TOOLCHAIN FIRST AND BY COST SECOND, one job per group. Most
  # controls need Go, a host C and C++ compiler and the C/C++ serialize siblings
  # and nothing else; the rest are per-port and need the port's runtime,
  # installed here the same way the conformance jobs above install it, keyed on
  # the row's field rather than on a language name. Inside a toolchain the
  # groups are families that share a compile, cut where the owner's rule cuts
  # them: a group runs in one `make -k` invocation and that invocation has to
  # fit inside two minutes with the job's own 25 s of checkout, sibling clones
  # and first build already spent.
  #
  # MEASURED, 2026-09-07 on the author's machine (arm64 macOS, one target per
  # make invocation, off one warm build) and then on the runner, on this
  # branch's own pull-request runs. 203 controls, 40 pull-request groups and
  # one nightly group. `go run ./tools/negativecontrols check` prints the
  # count, so it is one command rather than a number to keep in step by hand.
  #
  # The base toolchain carries 134 of them and takes twenty-eight jobs rather
  # than one: the map gate alone is 17 controls at 4 s each on the author's
  # machine and about 2x that on the runner, and the conformance driver's two
  # sabotage rebuilds are 45 s and 47 s of runner time on their own. The
  # tolerant-wire family is one control per job: each rebuilds the compiler
  # under a source overlay and then fuzzes the sabotaged wire, 55 s to 80 s
  # each, so no two of them fit together.
  #
  # THE FIRST CUT WAS MEASURED AND CUT AGAIN. On run 34115675206 every group
  # was inside the rule but eight of them sat between 100 s and 111 s, which is
  # a rule met by luck rather than by design, so those eight are the twelve
  # groups they are now. The per-group numbers live in
  # make/negative-controls.json's `why` lines, next to the targets they are
  # about.
  #
  # ONE CONTROL DOES NOT FIT THE RULE AT ANY GROUP SIZE, and it runs nightly
  # instead: tables-message-form-negative-control drives 49 sabotage rows one
  # submake each at 124 s, against a 120 s rule. It is the `nightly` group in
  # the plan, certify.yml runs that tier on the schedule it carries, and
  # `tools/negativecontrols` refuses a group that is in neither tier, so a
  # control cannot leave this file without landing on that one. The message
  # form's other blades stay here. The group keeps its name at one target,
  # because it is where the next control that outgrows the rule lands.
  #
  # AN UMBRELLA TARGET IS NOT A CONTROL. tables-wire-fuzz-retain-negative-control
  # carries no recipe: it names the retain oracle and the retain class leaves,
  # which the wire-fuzz-message-oracle and wire-fuzz-retain-class rows run
  # between them, so it sits in the plan's exclusion list beside the other
  # umbrellas rather than in a job that would run one of those leaves twice.
  negative-controls-matrix:
    # Runs on a pull request only when it carries the `full-ci` label; on a
    # merge, the nightly and a dispatch it always runs. The expression is
    # repeated per job because a job-level `if:` cannot read `env`.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false

      # The Go build cache, restore only — `go-test` is the one Linux writer.
      # The block on that job carries the reasoning.
      - name: where this runner keeps the Go build cache
        shell: bash
        run: |
          echo "GO_BUILD_CACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"
          echo "GO_CACHE_ID=$(go env GOVERSION)-$(go env GOARCH)" >> "$GITHUB_ENV"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GO_BUILD_CACHE }}
          key: go-build-${{ runner.os }}-${{ env.GO_CACHE_ID }}-${{ hashFiles('**/*.go', 'go.mod') }}
          restore-keys: go-build-${{ runner.os }}-${{ env.GO_CACHE_ID }}-

      # The enumeration gate, first and on its own, so a control that nothing
      # runs is named here rather than discovered by its absence from a log.
      - name: every negative control the makefiles define is in the plan
        run: go run ./tools/negativecontrols check

      - id: plan
        name: the plan, as a matrix
        run: |
          matrix=$(go run ./tools/negativecontrols matrix)
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  negative-controls:
    # Runs on a pull request only when it carries the `full-ci` label; on a
    # merge, the nightly and a dispatch it always runs. The expression is
    # repeated per job because a job-level `if:` cannot read `env`.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')
    name: negative controls (${{ matrix.name }})
    needs: negative-controls-matrix
    runs-on: ubuntu-latest
    # THE RULE, ENFORCING ITSELF. Every row here is cut to 120 s of control
    # time and pays about 25 s of checkout, sibling clones and first build on
    # top, so five minutes is generous and a row that reaches it is a row that
    # left the rule. A ceiling wide enough to hide that is not a timeout.
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.negative-controls-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # All six siblings in every group. A control reaches for a runtime through
      # the generated code it sabotages, and which one that is belongs to the
      # control rather than to the group; six shallow clones cost seconds and
      # remove the whole class of "the group forgot a sibling".
      - name: Check out the serialize runtimes (pinned releases)
        run: |
          cd ..
          git clone --quiet --depth 1 --branch "$SERIALIZE_TAG"    https://github.com/mas-bandwidth/serialize.git    serialize
          git clone --quiet --depth 1 --branch "$SERIALIZE_C_TAG"  https://github.com/mas-bandwidth/serialize.c.git  serialize.c
          git clone --quiet --depth 1 --branch "$SERIALIZE_GO_TAG" https://github.com/mas-bandwidth/serialize.go.git serialize.go
          git clone --quiet --depth 1 --branch "$SERIALIZE_RS_TAG" https://github.com/mas-bandwidth/serialize.rs.git serialize.rs
          git clone --quiet --depth 1 --branch "$SERIALIZE_CS_TAG" https://github.com/mas-bandwidth/serialize.cs.git serialize.cs
          git clone --quiet --depth 1 --branch "$SERIALIZE_JS_TAG" https://github.com/mas-bandwidth/serialize.js.git serialize.js

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false

      # The Go build cache, restore only — `go-test` is the one Linux writer.
      # The block on that job carries the reasoning.
      - name: where this runner keeps the Go build cache
        shell: bash
        run: |
          echo "GO_BUILD_CACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"
          echo "GO_CACHE_ID=$(go env GOVERSION)-$(go env GOARCH)" >> "$GITHUB_ENV"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GO_BUILD_CACHE }}
          key: go-build-${{ runner.os }}-${{ env.GO_CACHE_ID }}-${{ hashFiles('**/*.go', 'go.mod') }}
          restore-keys: go-build-${{ runner.os }}-${{ env.GO_CACHE_ID }}-

      # One step per toolchain, each keyed on the row's field for it, exactly as
      # the conformance matrix above does. A base row names none of them and
      # installs none of them.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # the stable BRANCH head; the SHA freezes the action, not the compiler, and rustup resolves stable at run time
        if: matrix.rust != ''

      - name: read the .NET SDK pin
        if: matrix.dotnet != ''
        run: echo "DOTNET_SDK_PIN=$(cat .github/dotnet-version)" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: matrix.dotnet != ''
        with:
          dotnet-version: ${{ env.DOTNET_SDK_PIN }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: matrix.node != ''
        with:
          node-version: ${{ matrix.node }}
      # The pinned eslint the JS leg's tables-js-clean gate requires (make/js.mk).
      - uses: ./.github/actions/eslint
        if: matrix.node != ''

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        if: matrix.dart != ''
        with:
          sdk: ${{ matrix.dart }}

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        if: matrix.java != ''
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}

      # The pinned formatter `make test-java` and the java negative controls require (make/java.mk).
      - uses: ./.github/actions/google-java-format
        if: matrix.java != ''

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        if: matrix.otp != ''
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      # THE LUAU PIN, as make/luau.mk's dist-luau installs it (sha256 refused
      # before unpacking), at the version the group's field names.
      - name: install the Luau pin
        if: matrix.luau != ''
        run: make dist-luau LUAU_VERSION=${{ matrix.luau }}

      # The moo pin (make/moo.mk, MOO_PIN), for a row whose ci.json or group
      # names `moo`: .github/actions/moo builds it once per runner image and
      # caches it under the pin.
      - uses: ./.github/actions/moo
        if: matrix.moo != ''

      # The Lobster pin, as the conformance row installs it (make dist-lobster
      # at the row's version, the two GL libraries the release binary links).
      - name: install the Lobster pin
        if: matrix.lobster != ''
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopengl0 libglx0
          make dist-lobster LOBSTER_VERSION=${{ matrix.lobster }}

      # THE SQUIRREL PIN, keyed on the row's field like every toolchain above:
      # a group naming `squirrel` runs controls that execute generated Squirrel
      # or pass the leg's toolchain gate (make/squirrel.mk's
      # toolchain-squirrel), which refuses by name when SQ does not resolve.
      # dist-squirrel builds the interpreter at the sha256 it names, into the
      # dist/ path SQ defaults to.
      - name: install the Squirrel pin
        if: matrix.squirrel != ''
        run: make dist-squirrel

      # THE C AND C++ FORMAT GATES' formatter, for a row naming `clang_format`:
      # clang-format from PyPI at the version make/c.mk's CLANG_FORMAT_PIN
      # names, as ci-fast's C and C++ legs install it.
      - name: the pinned clang-format
        if: matrix.clang_format != ''
        run: |
          set -euo pipefail
          pin="$(sed -n 's/^CLANG_FORMAT_PIN *?= *//p' make/c.mk)"
          python3 -m venv "$RUNNER_TEMP/clang-format"
          "$RUNNER_TEMP/clang-format/bin/pip" install --quiet "clang-format==$pin"
          echo "CLANG_FORMAT=$RUNNER_TEMP/clang-format/bin/clang-format" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/clang-format/bin/clang-format" --version

      # The compiler and the generated tree ONCE, in parallel, before any
      # control runs. Every control in the group hangs off these two, and
      # building them here keeps the build cost out of the first control's
      # timing and out of its log.
      # A row naming `lua` (make/negative-controls.json) runs the Lua port's
      # controls under the pinned PUC-Rio interpreter, which make/lua.mk's
      # dist-lua builds from source at the sha256 it names into the LUA default.
      - name: install the Lua pin
        if: matrix.lua != ''
        run: make dist-lua

      - name: build bin/schema and the generated tree once
        run: make -j"$(nproc)" bin/schema build/tables-generated/.stamp

      # ONE make invocation for the whole group, with -k so a control that
      # refuses does not hide the ones behind it: every control in the group
      # runs, and every failure is in one log. `-k` still exits nonzero.
      #
      # The exit status is the first gate. The log scan is the second, and it is
      # not redundant: a control's own refusal lines are the sentence a reader
      # needs (a sabotage that patched nothing, a gate that stayed green), and
      # this pulls them out of a log that is thousands of compiler lines long
      # and puts them in the run's annotations.
      #
      # The overrides are certify.yml's: RUSTUP_BIN defaults to a homebrew keg
      # on the author's machine, and DART, JAVA/JAVAC, ELIXIR/MIX and NODE
      # default to the repo-local dist/ toolchains, while on CI the setup steps
      # above put the pinned versions on PATH. They are harmless in a group that
      # runs no control needing them.
      - name: every negative control in the ${{ matrix.name }} group
        run: |
          set -o pipefail
          targets=$(go run ./tools/negativecontrols targets "${{ matrix.name }}")
          echo "$targets" | tr ' ' '\n'
          status=0
          # shellcheck disable=SC2086
          make -k $targets \
            RUSTUP_BIN=/usr/bin DART=dart JAVA=java JAVAC=javac ELIXIR=elixir MIX=mix NODE=node \
            2>&1 | tee controls.log || status=1
          if grep -qE '^NEGATIVE CONTROL( FAILED)?:' controls.log; then
            echo "::error::a negative control refused. Either its sabotage no longer patches the line it aims at, or the gate it watches stayed green under the sabotage. Both are stop-the-line: the control is watching nothing until it is repaired."
            grep -nE '^NEGATIVE CONTROL( FAILED)?:' controls.log
            status=1
          fi
          exit $status
