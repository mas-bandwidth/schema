name: Lobster integrity qualification
on:
  push:
    branches: [codex/schema-lobster-integrity-linux-check]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26'
          cache: false
      - name: Install the pinned Lobster runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libopengl0 libglx0
          make dist-lobster
      - name: Build cook compiler for native generated refresh
        run: |
          git fetch origin codex/schema-lobster-cook-text --depth=1
          git worktree add ../cook-source FETCH_HEAD
          mkdir -p build/cook-compiler
          git -C ../cook-source rev-parse HEAD > build/cook-compiler/product-head.txt
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go -C ../cook-source build -o "$GITHUB_WORKSPACE/build/cook-compiler/schema" ./cmd/schema
          shasum -a 256 build/cook-compiler/schema > build/cook-compiler/sha256.txt
      - name: Preserve cook compiler
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: lobster-cook-compiler
          path: build/cook-compiler/
          retention-days: 7
      - name: Cook unbounded text and storage regression
        env:
          SCHEMA_SLOW: '1'
        run: |
          export LOBSTER="$PWD/dist/lobster-v2026.8/bin/lobster"
          go test ./internal/codegen/lobstertable -run '^TestLobsterCook(UnboundedText|ExtentCoordinates|AuthoredOptionalMap)$' -count=1 -v
      - name: Shared CI repair regression
        run: go test ./internal/goldens ./internal/ci -run '^Test(Golden|SchemaSharedHostileCorpus)' -count=1 -v
      - name: JSON feature value identity
        env:
          SCHEMA_SLOW: '1'
        run: |
          export LOBSTER="$PWD/dist/lobster-v2026.8/bin/lobster"
          go test ./internal/codegen/lobstertable -run '^TestLobsterJSON(FeatureValues|Float32WriterSingleRounding)$' -count=1 -v
      - name: Whole-unit registry regression
        env:
          SCHEMA_SLOW: '1'
        run: |
          export LOBSTER="$PWD/dist/lobster-v2026.8/bin/lobster"
          go test ./internal/codegen/lobstertable -run '^TestLobster(UnitView|TableFree|RuntimePackage)' -count=1 -v
      - name: Packet native baseline and negative controls
        env:
          SCHEMA_SLOW: '1'
        run: |
          export LOBSTER="$PWD/dist/lobster-v2026.8/bin/lobster"
          go test ./internal/codegen/lobster/... -count=1 -timeout 480s -v
      - name: Native integrity regression and negative control
        env:
          SCHEMA_SLOW: '1'
        run: |
          export LOBSTER="$PWD/dist/lobster-v2026.8/bin/lobster"
          go test ./internal/codegen/lobstertable -run '^TestLobster(VariableWireIntegrity|MessageIntegrity)$' -count=1 -v
      - name: Fixed-form evolution and integrity
        env:
          SCHEMA_SLOW: '1'
          SCHEMA_REQUIRE_CORPUS: '1'
        run: |
          export LOBSTER="$PWD/dist/lobster-v2026.8/bin/lobster"
          make build/fixedform-corpus/.stamp
          go test ./internal/codegen/lobstertable -run '^TestLobsterFixedForm' -count=1 -timeout 300s -v
      - name: Complete native table baseline and compiler checks
        env:
          SCHEMA_SLOW: '1'
          SCHEMA_REQUIRE_CORPUS: '1'
        run: |
          export LOBSTER="$PWD/dist/lobster-v2026.8/bin/lobster"
          go test ./internal/codegen/lobstertable ./internal/tablenames -count=1 -timeout 600s -v
      - name: Compiler Lobster name contracts
        if: always()
        run: go test ./compiler -run 'TestLobster.*(Name|Registry|Runtime)' -count=1 -v
