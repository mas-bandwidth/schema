name: Lobster integrity qualification
on:
  push:
    branches: [codex/schema-lobster-integrity-linux-check]
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26'
          cache: false
      - name: Install the pinned Lobster runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libopengl0 libglx0
          make dist-lobster
      - name: Cook unbounded text and storage regression
        env:
          SCHEMA_SLOW: '1'
        run: |
          export LOBSTER="$PWD/dist/lobster-v2026.8/bin/lobster"
          go test ./internal/codegen/lobstertable -run '^TestLobsterCook(UnboundedText|ExtentCoordinates|AuthoredOptionalMap)$' -count=1 -v
