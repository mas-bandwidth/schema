name: schema luau nightly fuzz

# THE NIGHTLY LANE (make/schema-luau-nightly-fuzz.mk): the seeded mutation
# fuzzer over the Luau port's generated load, strict-read and text readers.
# The ten-minute budget runs ONLY here, on a schedule and on dispatch. A push
# that changes the harness or its saved corpus runs the REPLAY, which is one
# pass over every saved input and no real time at all.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [sprint/schema-luau]
    paths:
      - "make/schema-luau-nightly-fuzz.mk"
      - ".github/workflows/schema-luau-nightly-fuzz.yml"
      - "testdata/luau-nightly-fuzz/**"

jobs:
  replay:
    if: github.event_name == 'push'
    runs-on: [self-hosted, Linux, X64, fleet, schema]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Luau 0.741 (pinned release)
        run: make dist-luau
      - name: replay every saved input
        run: make luau-nightly-fuzz-replay

  nightly:
    if: github.event_name != 'push'
    runs-on: [self-hosted, Linux, X64, fleet, schema]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Luau 0.741 (pinned release)
        run: make dist-luau
      - name: ten minutes per reader port
        run: make luau-nightly-fuzz LUAU_FUZZ_TIME=600
