name: schema-luau resource bounds

# The luau port's resource-bounds lens (the card
# schema-luau-resource-bounds-r): hostile inputs — huge counts, deep nesting,
# recursion, giant strings, many unknown fields — must cost bounded memory and
# time. The generated textform reader refuses past the depth cap of 128 and
# the default text_limit bounds (docs/SPEC-TABLES.md §16.9.4), measured under
# the pinned interpreter with Luau's GC memstat as the allocation counter. The
# planted-pattern control proves the depth guard has a blade.
#
# The parts are fast: one unit's generation and a handful of small hostile
# reads cost a second or two on the bench, so push and pull_request run them
# directly, and the nightly schedule repeats the same gate. The job runs on
# the fleet (self-hosted, schema set), never a GitHub-hosted runner, and it
# carries the fork guard: a fork's pull request gets no CI run here.
#
# This workflow's zero-maintenance invariant: it is one of the few that has no
# slow-gate exception because it runs everything through the gate targets, so
# a slowtest skip in its log is a failure, and it names every gate it proves.

on:
  push:
    paths:
      - 'make/schema-luau-resource-bounds.mk'
      - 'make/luau.mk'
      - '.github/workflows/schema-luau-resource-bounds.yml'
      - 'internal/ci/schema_luau_resource_bounds_test.go'
      - 'internal/codegen/luau/**'
      - 'internal/codegen/luautable/**'
      - 'compiler/target_luau.go'
  pull_request:
    paths:
      - 'make/schema-luau-resource-bounds.mk'
      - 'make/luau.mk'
      - '.github/workflows/schema-luau-resource-bounds.yml'
      - 'internal/ci/schema_luau_resource_bounds_test.go'
      - 'internal/codegen/luau/**'
      - 'internal/codegen/luautable/**'
      - 'compiler/target_luau.go'
  schedule:
    # nightly, after the other language lenses
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  luau-resource-bounds:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [ self-hosted, Linux, X64, fleet, schema ]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: presence check pinned go 1.26
        run: |
          want='1.26'
          got=$(go version | sed -n 's/.*go\([0-9]\+\.[0-9]\+\)\(\.\([0-9]\+\)\)\{0,1\}.*/\1/p')
          if [ "$got" != "$want" ]; then
            echo "TOOL-MISSING go $want ${got:-absent} on $RUNNER_NAME"
            exit 1
          fi
      - name: presence check pinned luau 0.741
        run: |
          want='0.741'
          if ! command -v luau >/dev/null 2>&1; then
            echo "TOOL-MISSING luau $want absent on $RUNNER_NAME"
            exit 1
          fi
          got=$(readlink -f "$(command -v luau)")
          case "$got" in
            *"/luau-$want/"*) ;;
            *) echo "TOOL-MISSING luau $want ${got:-absent} on $RUNNER_NAME"; exit 1 ;;
          esac
          echo "LUAU=$(command -v luau)" >> "$GITHUB_ENV"
      - name: planted-pattern control (the depth guard fires)
        run: make schema-luau-resource-bounds-negative-control
      - name: hostile shape resource bounds
        run: make schema-luau-resource-bounds
