name: Schema shared analyzer CI gate over the full corpus

# THE AGGREGATE ANALYZER GATE (schema-per-language-lenses, this card). Every
# per-port analyzer target that exists on the shared base is discovered from
# the make include tree and wired into ONE target,
# schema-shared-analyzer-ci-gate-corpus, over the generated output of the full
# test-schema corpus (the schemas the Makefile's generate targets read -- the
# corpus variables in the Makefile and make/*.mk, not a second corpus). The
# target calls each target it discovers and skips, loudly and by name, the
# ports with no analyzer yet.
#
# SPLIT BY WHEN. The aggregate is heavy: a landed per-port analyzer runs over
# the whole corpus, and the checkers themselves (Frama-C EVA, Kani, CBMC,
# Miri, MSan, Dialyzer, differentials, fuzzing) are nightly tools by the
# owner's one-to-two-minute rule. So the aggregate runs on a schedule and on
# demand, never per push. The fast part is the Go test that proves the gate's
# mechanism (discovery, a failing wired gate, and a left-out port) and it runs
# on every push and pull request inside the one-minute budget.

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'make/checks/schema-shared-analyzer-ci-gate-corpus.mk'
      - 'make/rust.mk'
      - 'make/negative-controls.json'
      - 'internal/ci/schema_shared_analyzer_ci_gate_corpus_test.go'
      - '.github/workflows/schema-shared-analyzer-ci-gate-corpus.yml'
  pull_request:
    paths:
      - 'make/checks/schema-shared-analyzer-ci-gate-corpus.mk'
      - 'make/rust.mk'
      - 'make/negative-controls.json'
      - 'internal/ci/schema_shared_analyzer_ci_gate_corpus_test.go'
      - '.github/workflows/schema-shared-analyzer-ci-gate-corpus.yml'

concurrency:
  group: schema-shared-analyzer-ci-gate-corpus-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # THE AGGREGATE GATE. Nightly and on demand. Linux + the .NET SDK (the
  # GATE-NEEDS from the card) because a landed C# analyzer reads the generated
  # C# corpus; the sibling gates otherwise bring their own toolchains. The
  # negative control rides here so the gate's own proof runs whenever the gate
  # runs.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: read the .NET SDK pin
        run: echo "DOTNET_SDK_PIN=$(cat .github/dotnet-version)" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_SDK_PIN }}
      # The rust lens is cargo-clippy. Pin the same toolchain the Makefile
      # pins (SCHEMA_SHARED_ANALYZER_CARGO_PIN) and install clippy with it; a
      # host whose cargo does not match the pin reports tool missing rather
      # than analyzing with another clippy.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: '1.99.0'
          components: clippy
      - name: analyzer gate over the full corpus
        run: make --no-print-directory schema-shared-analyzer-ci-gate-corpus
      - name: the gate's planted-analyzer negative control
        run: make --no-print-directory schema-shared-analyzer-ci-gate-corpus-negative-control

  # THE FAST PROOF, per push. The Go test discovers the real
  # tables-rust-clippy target, plants a failing analyzer target and requires the
  # aggregate to take it down by name, plants an analyzer for an uncovered port
  # and requires the coverage check to take it down by name, then removes the
  # plants and requires the aggregate to pass. It is pure Go and make; it fits
  # the one-minute budget.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false
      - name: schema-shared-analyzer-ci-gate-corpus mechanism
        run: go test ./internal/ci/ -run TestSchemaSharedAnalyzerCIGateCorpus -count=1 -timeout 600s
