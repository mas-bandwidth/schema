name: schema-elixir-runs-hostile-corpus

# THE ELIXIR PORT RUNS THE SHARED HOSTILE CORPUS (docs/HOSTILE-CORPUS.md).
# The fast part runs on every push and pull request: generate the Elixir units
# the manifest names, compile them with the pinned BEAM, and check every input's
# verdict against the committed oracle. The planted-bad-pattern control changes
# the generated text reader in a scratch copy and requires the runner to go red;
# it runs on schedule and workflow_dispatch because it certifies the gate has a
# blade rather than the corpus's content.

on:
  push:
    branches: [ main, dev, fixed-table-form ]
  pull_request:
    branches: [ main, dev, fixed-table-form, 'sprint/**' ]
  schedule:
    - cron: "29 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOFLAGS: -mod=readonly
  NOVA_TEST_NO_HOST: '1'

jobs:
  corpus:
    # Fleet only: a fork pull request has no fleet runner and is skipped before
    # it can reach one.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, schema]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # no Actions cache: the post step uploaded a 4.9 GB module and build
          # cache at 3.5 MB/s and ran the corpus job past its timeout; the fleet
          # runner keeps its own warm Go cache
          cache: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        # the fleet's schema runners carry OTP and Elixir on PATH (the toolchains
        # role); setup-beam needs ImageOS, which only a hosted runner sets
        if: runner.environment == 'github-hosted'
        with:
          otp-version: '29.0.5'
          elixir-version: '1.20.4'
      - name: the corpus gate
        run: make schema-elixir-runs-hostile-corpus ELIXIR=elixir ELIXIRC=elixirc

  negative-control:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, x64, schema]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # no Actions cache: the post step uploaded a 4.9 GB module and build
          # cache at 3.5 MB/s and ran the corpus job past its timeout; the fleet
          # runner keeps its own warm Go cache
          cache: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        # the fleet's schema runners carry OTP and Elixir on PATH (the toolchains
        # role); setup-beam needs ImageOS, which only a hosted runner sets
        if: runner.environment == 'github-hosted'
        with:
          otp-version: '29.0.5'
          elixir-version: '1.20.4'
      - name: the planted-bad-pattern control
        run: make schema-elixir-runs-hostile-corpus-negative-control ELIXIR=elixir ELIXIRC=elixirc
