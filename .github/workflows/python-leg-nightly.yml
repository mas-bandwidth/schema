name: python leg nightly

# THE PYTHON LEG ON macOS (docs/PORT-PYTHON.md): the same `make test-python`
# as python-leg.yml, on a GitHub-hosted macOS runner, nightly and on
# dispatch. It does not fit a push or pull request's two minutes there, so it
# is off those events (internal/ci/nightly_test.go); python-leg.yml keeps the
# fleet's Linux leg on every push and pull request that touches the leg.
#
# A GITHUB-HOSTED RUNNER: the job runs the repository's own code against
# pinned tools and holds no secret.

# NIGHTLY RUNS HAVE NO TIMEOUT (the owner, 2026-11-16: "Nightly runs don't
# have a timeout... they can run as long as they need."). No job or step in
# this file carries timeout-minutes, and PGROUP_GO_TEST_TIMEOUT: '0' below has
# tools/pgroup give every go test under a step -timeout=0 in place of the one
# it names, so a slow row finishes and reports every test. GitHub's default
# 360-minute job limit is the only backstop, and a job it stops reads
# cancelled, never green. internal/ci/nightly_test.go holds the rule.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # the nightly rule in the header: no go test -timeout under tools/pgroup
  PGROUP_GO_TEST_TIMEOUT: '0'

jobs:
  macos:
    name: make test-python (macos-latest)
    runs-on: macos-latest
    defaults:
      run:
        shell: go run ./tools/pgroup -- bash -e {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/python
      # The C++ identity tests (TestPythonCardsCppIdentity,
      # TestPythonCookCppIdentity) compile against the pinned serialize
      # sibling at ../serialize, as python-leg.yml's rows do; without this
      # step they fail with "serialize.h: no such file or directory".
      - name: stage the sibling runtimes
        run: make serialize-siblings
      - name: make test-python
        run: make -j"$(getconf _NPROCESSORS_ONLN)" test-python
