name: schema python hostile corpus

# THE PYTHON PORT'S SHARED HOSTILE-CORPUS GATE
# (schema-python-runs-hostile-corpus; docs/HOSTILE-CORPUS.md). Every committed
# hostile input is decoded by the port's generated table or packet reader and
# held to the manifest's verdict, named refusal and decoded-value digest.
#
# THE HEAVY PART IS NIGHTLY ONLY, so the lane stays inside the fast lane's
# one-minute budget: the full corpus replay runs on the schedule and on
# workflow_dispatch. A dispatch also runs the planted-reader control, which is
# seconds of work and proves the comparison has a blade. The runner reads files
# only: no network, no clock, no service.
#
# FORK SAFETY: every fleet job carries the fork guard so a fork's pull request
# never runs on fleet hardware.

on:
  schedule:
    - cron: '19 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # NIGHTLY RUNS HAVE NO TIMEOUT: no go test -timeout under tools/pgroup
  PGROUP_GO_TEST_TIMEOUT: '0'

jobs:
  fast:
    if: (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [ self-hosted, Linux, X64, fleet, schema ]
    defaults:
      run:
        shell: go run ./tools/pgroup -- bash -e -o pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the pinned Python interpreters
        run: make dist-python
      - name: the planted reader bug is red
        run: make schema-python-runs-hostile-corpus-negative-control

  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [ self-hosted, Linux, X64, fleet, schema ]
    defaults:
      run:
        shell: go run ./tools/pgroup -- bash -e -o pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the pinned Python interpreters
        run: make dist-python
      - name: every shared hostile-corpus verdict, reason and digest
        run: make schema-python-runs-hostile-corpus
      - name: replay the corpus and require the planted reader bug to be observed
        run: make schema-python-runs-hostile-corpus-negative-control
