name: schema Go generated golangci-lint gate

# THE GOLANGCI-LINT LENS on the Go port's generated output (errcheck, gosec,
# ineffassign, go vet and a -race test run). The fast packet corpus runs on
# every push (on a pull request: ci-fast.yml lang-lint, by path); the table corpus is heavier and runs nightly and
# on demand. The lens is a ratchet: the pinned counts live in
# make/checks/schema-go-generated-golangci-lint-gate.ratchet.tsv.
# NIGHTLY RUNS HAVE NO TIMEOUT (the owner, 2026-11-16: "Nightly runs don't
# have a timeout... they can run as long as they need."). No job or step in
# this file carries timeout-minutes, and PGROUP_GO_TEST_TIMEOUT: '0' below has
# tools/pgroup give every go test under a step -timeout=0 in place of the one
# it names, so a slow row finishes and reports every test. GitHub's default
# 360-minute job limit is the only backstop, and a job it stops reads
# cancelled, never green. internal/ci/nightly_test.go holds the rule.

on:
  # NIGHTLY AND DISPATCH ONLY (the owner, 2026-11-15: "I want everything that is not light moved to
  # nightly test now." "no exceptions."). A push or pull request runs only the fast lane, ci-fast.yml.
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # the nightly rule in the header: no go test -timeout under tools/pgroup
  PGROUP_GO_TEST_TIMEOUT: '0'
  SERIALIZE_GO_TAG: v2.1.1

jobs:
  gate:
    # Fleet only: a fork pull request has no fleet runner and is skipped before
    # it can reach one. No hosted-runner fallback, and no action installs Go or
    # the checker: both are fleet-installed and pinned below.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ["self-hosted", "Linux", "X64", "fleet", "schema"]
    defaults:
      run:
        shell: go run ./tools/pgroup -- bash -e -o pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the fleet golangci-lint (presence and pinned version)
        run: |
          export PATH="$HOME/sdk/bin:$PATH"
          command -v golangci-lint >/dev/null 2>&1 || {
            echo "TOOL-MISSING: golangci-lint 2.12.2 (not on PATH; the fleet install is ~/sdk/bin/golangci-lint)"
            exit 1
          }
          golangci-lint version 2>&1 | grep '2.12.2' >/dev/null || {
            echo "TOOL-MISSING: golangci-lint 2.12.2 (found: $(golangci-lint version 2>&1 | head -1))"
            exit 1
          }
      - name: the fluent Go runtime
        run: |
          cd ..
          rm -rf serialize.go
          git clone --quiet --depth 1 --branch "$SERIALIZE_GO_TAG" https://github.com/mas-bandwidth/serialize.go.git serialize.go
      - name: the generated-Go golangci-lint gate (packet corpus, ratchet)
        run: |
          export PATH="$HOME/sdk/bin:$PATH"
          GOLANGCI_LINT_CACHE="$RUNNER_TEMP/golangci-lint-gate-cache" make schema-go-generated-golangci-lint-gate
      - name: the generated-Go golangci-lint gate (table corpus, nightly)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          export PATH="$HOME/sdk/bin:$PATH"
          GOLANGCI_LINT_CACHE="$RUNNER_TEMP/golangci-lint-gate-cache" make schema-go-generated-golangci-lint-gate-nightly
