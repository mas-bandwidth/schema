name: CI fast

# MEASUREMENT BRANCH ONLY (never merged): per-package go test timings on a
# fleet runner, one package per job, as go-test-touched runs them.
on:
  workflow_dispatch:

env:
  SERIALIZE_TAG: v2.1.3
  SERIALIZE_C_TAG: v2.1.1
  SERIALIZE_GO_TAG: v2.1.1
  SERIALIZE_RS_TAG: v5.0.0
  SERIALIZE_CS_TAG: v2.1.1
  SERIALIZE_JS_TAG: v2.1.2

jobs:
  measure:
    name: measure (${{ matrix.mode }} ${{ matrix.pkg }})
    runs-on: [self-hosted, Linux, X64, fleet, schema]
    timeout-minutes: 40
    defaults:
      run:
        shell: go run ./tools/pgroup -- bash -e {0}
    strategy:
      fail-fast: false
      max-parallel: 40
      matrix:
        include: [{"mode": "short", "pkg": "./compiler"}, {"mode": "short", "pkg": "./internal/ci"}, {"mode": "short", "pkg": "./internal/codegen/goosetable"}, {"mode": "short", "pkg": "./internal/codegen/jstable"}, {"mode": "short", "pkg": "./internal/codegen/lobstertable"}, {"mode": "short", "pkg": "./internal/docgate"}, {"mode": "short", "pkg": "./internal/goldens"}, {"mode": "short", "pkg": "./internal/slowtest"}, {"mode": "short", "pkg": "./internal/tablepack"}, {"mode": "short", "pkg": "./tools/fixedtwin"}, {"mode": "short", "pkg": "./tools/slowgatescan"}, {"mode": "plain", "pkg": "./compiler"}, {"mode": "plain", "pkg": "./internal/ci"}, {"mode": "plain", "pkg": "./internal/codegen/goosetable"}, {"mode": "plain", "pkg": "./internal/codegen/gotable"}, {"mode": "plain", "pkg": "./internal/codegen/gotable/fuzzunit"}, {"mode": "plain", "pkg": "./internal/codegen/javatable"}, {"mode": "plain", "pkg": "./internal/codegen/js"}, {"mode": "plain", "pkg": "./internal/codegen/jstable"}, {"mode": "plain", "pkg": "./internal/codegen/lobster"}, {"mode": "plain", "pkg": "./internal/codegen/lobster/lobsterrun"}, {"mode": "plain", "pkg": "./internal/codegen/lobstertable"}, {"mode": "plain", "pkg": "./internal/codegen/lua"}, {"mode": "plain", "pkg": "./internal/codegen/lua/luarun"}, {"mode": "plain", "pkg": "./internal/codegen/luatable"}, {"mode": "plain", "pkg": "./internal/codegen/luau"}, {"mode": "plain", "pkg": "./internal/codegen/luau/luaurun"}, {"mode": "plain", "pkg": "./internal/codegen/luautable"}, {"mode": "plain", "pkg": "./internal/codegen/moo"}, {"mode": "plain", "pkg": "./internal/codegen/moo/moorun"}, {"mode": "plain", "pkg": "./internal/codegen/mootable"}, {"mode": "plain", "pkg": "./internal/codegen/python"}, {"mode": "plain", "pkg": "./internal/codegen/python/pyrun"}, {"mode": "plain", "pkg": "./internal/codegen/rust"}, {"mode": "plain", "pkg": "./internal/codegen/rusttable"}, {"mode": "plain", "pkg": "./internal/codegen/squirrel"}, {"mode": "plain", "pkg": "./internal/codegen/squirrel/sqrun"}, {"mode": "plain", "pkg": "./internal/codegen/squirreltable"}, {"mode": "plain", "pkg": "./internal/docgate"}, {"mode": "plain", "pkg": "./internal/fixedproof"}, {"mode": "plain", "pkg": "./internal/fixedvector"}, {"mode": "plain", "pkg": "./internal/format"}, {"mode": "plain", "pkg": "./internal/fuzz"}, {"mode": "plain", "pkg": "./internal/goldens"}, {"mode": "plain", "pkg": "./internal/goname"}, {"mode": "plain", "pkg": "./internal/jsontestsuite"}, {"mode": "plain", "pkg": "./internal/listwalk"}, {"mode": "plain", "pkg": "./internal/lockfile"}, {"mode": "plain", "pkg": "./internal/mapwalk"}, {"mode": "plain", "pkg": "./internal/memceiling"}, {"mode": "plain", "pkg": "./internal/parser"}, {"mode": "plain", "pkg": "./internal/publicapi"}, {"mode": "plain", "pkg": "./internal/rfc3339"}, {"mode": "plain", "pkg": "./internal/scanner"}, {"mode": "plain", "pkg": "./internal/slowtest"}, {"mode": "plain", "pkg": "./internal/tablecook"}, {"mode": "plain", "pkg": "./internal/tablenames"}, {"mode": "plain", "pkg": "./internal/tablepack"}, {"mode": "plain", "pkg": "./internal/tabletext"}, {"mode": "plain", "pkg": "./internal/tablewire"}, {"mode": "plain", "pkg": "./internal/version"}, {"mode": "plain", "pkg": "./internal/viewlisting"}, {"mode": "plain", "pkg": "./ir"}, {"mode": "plain", "pkg": "./tables/goruntime"}, {"mode": "plain", "pkg": "./test/conformance/goose/wirefuzzdispatch"}, {"mode": "plain", "pkg": "./test/conformance/harness"}, {"mode": "plain", "pkg": "./test/conformance/lobster/hostile"}, {"mode": "plain", "pkg": "./test/conformance/lobster/wirefuzzhost"}, {"mode": "plain", "pkg": "./test/cookgen"}, {"mode": "plain", "pkg": "./test/cs-hostile/gen"}, {"mode": "plain", "pkg": "./test/elixir-view/emit"}, {"mode": "plain", "pkg": "./test/go-hostile/gen"}, {"mode": "plain", "pkg": "./test/packet-text/harness"}, {"mode": "plain", "pkg": "./test/packet-text/moo/driver"}, {"mode": "plain", "pkg": "./test/table-base64/harness"}, {"mode": "plain", "pkg": "./test/vocabgen"}, {"mode": "plain", "pkg": "./tools/agentsmap"}, {"mode": "plain", "pkg": "./tools/cellmerge"}, {"mode": "plain", "pkg": "./tools/fixedtwin"}, {"mode": "plain", "pkg": "./tools/hostilecorpus"}, {"mode": "plain", "pkg": "./tools/hostilecorpusexec"}, {"mode": "plain", "pkg": "./tools/matrix"}, {"mode": "plain", "pkg": "./tools/negativecontrols"}, {"mode": "plain", "pkg": "./tools/pgroup"}, {"mode": "plain", "pkg": "./tools/releasediff"}, {"mode": "plain", "pkg": "./tools/releasetag"}, {"mode": "plain", "pkg": "./tools/roadmap"}, {"mode": "plain", "pkg": "./tools/roadmap/cmd/roadmap-handtext"}, {"mode": "plain", "pkg": "./tools/sabotage"}, {"mode": "plain", "pkg": "./tools/slowgatescan"}, {"mode": "plain", "pkg": "./tools/treelock"}, {"mode": "plain", "pkg": "./working"}]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: siblings
        run: |
          set -euo pipefail
          cd ..
          rm -rf serialize serialize.c serialize.cs serialize.go serialize.rs
          git clone --quiet --depth 1 --branch "$SERIALIZE_TAG"    https://github.com/mas-bandwidth/serialize.git    serialize
          git clone --quiet --depth 1 --branch "$SERIALIZE_C_TAG"  https://github.com/mas-bandwidth/serialize.c.git  serialize.c
          git clone --quiet --depth 1 --branch "$SERIALIZE_CS_TAG" https://github.com/mas-bandwidth/serialize.cs.git serialize.cs
          git clone --quiet --depth 1 --branch "$SERIALIZE_GO_TAG" https://github.com/mas-bandwidth/serialize.go.git serialize.go
          git clone --quiet --depth 1 --branch "$SERIALIZE_RS_TAG" https://github.com/mas-bandwidth/serialize.rs.git serialize.rs
      - name: pins
        run: |
          make dist-lua || echo "MEASURE dist-lua failed"
          make dist-luau
          make dist-goose
          make dist-lobster
      - name: go test
        run: |
          set +e; set -uo pipefail
          echo "MEASURE cores $(nproc) host $(hostname)"
          flag=""; [ "${{ matrix.mode }}" = short ] && flag=-short
          start=$(date +%s)
          go test -v -count=1 $flag -timeout 35m "${{ matrix.pkg }}" > "$RUNNER_TEMP/out.txt" 2>&1; st=$?
          end=$(date +%s)
          grep -E '^(ok|FAIL|panic|\?)' "$RUNNER_TEMP/out.txt" || true
          grep -E '^--- (PASS|FAIL)' "$RUNNER_TEMP/out.txt" | sed 's/^/MEASURE-TEST /' || true
          echo "MEASURE-PKG ${{ matrix.mode }} ${{ matrix.pkg }} wall $((end-start)) status $st"
