name: CI fast

# MEASUREMENT BRANCH ONLY (never merged): per-package go test timings on a
# fleet runner, one package per job, as go-test-touched runs them.
on:
  workflow_dispatch:

env:
  SERIALIZE_TAG: v2.1.3
  SERIALIZE_C_TAG: v2.1.1
  SERIALIZE_GO_TAG: v2.1.1
  SERIALIZE_RS_TAG: v5.0.0
  SERIALIZE_CS_TAG: v2.1.1
  SERIALIZE_JS_TAG: v2.1.2

jobs:
  measure:
    name: measure (${{ matrix.mode }} ${{ matrix.pkg }})
    runs-on: [self-hosted, Linux, X64, fleet, schema]
    timeout-minutes: 40
    defaults:
      run:
        shell: go run ./tools/pgroup -- bash -e {0}
    strategy:
      fail-fast: false
      matrix:
        mode: [ short, plain ]
        pkg: ["./bench/corpus","./bench/paired","./bench/tools","./bench/tools/realpacket-gen","./bench/tools/shapegate","./cmd/schema","./compiler","./internal/ast","./internal/baseline","./internal/check","./internal/ci","./internal/ci/hostilecorpus","./internal/codegen/c","./internal/codegen/ccommon","./internal/codegen/cpp","./internal/codegen/cpptable","./internal/codegen/cqualify","./internal/codegen/csharp","./internal/codegen/cstable","./internal/codegen/ctable","./internal/codegen/dart","./internal/codegen/darttable","./internal/codegen/elixir","./internal/codegen/elixirtable","./internal/codegen/elixirtable/fixedclosure","./internal/codegen/golang","./internal/codegen/goose","./internal/codegen/goose/gooserun","./internal/codegen/goosetable","./internal/codegen/gotable","./internal/codegen/gotable/fuzzunit","./internal/codegen/java","./internal/codegen/javatable","./internal/codegen/js","./internal/codegen/jstable","./internal/codegen/lobster","./internal/codegen/lobster/lobsterrun","./internal/codegen/lobstertable","./internal/codegen/lua","./internal/codegen/lua/luarun","./internal/codegen/luatable","./internal/codegen/luau","./internal/codegen/luau/luaurun","./internal/codegen/luautable","./internal/codegen/moo","./internal/codegen/moo/moorun","./internal/codegen/mootable","./internal/codegen/python","./internal/codegen/python/pyrun","./internal/codegen/rust","./internal/codegen/rusttable","./internal/codegen/squirrel","./internal/codegen/squirrel/sqrun","./internal/codegen/squirreltable","./internal/docgate","./internal/fixedproof","./internal/fixedvector","./internal/format","./internal/fuzz","./internal/goldens","./internal/goname","./internal/jsontestsuite","./internal/listwalk","./internal/lockfile","./internal/mapwalk","./internal/memceiling","./internal/parser","./internal/publicapi","./internal/rfc3339","./internal/scanner","./internal/slowtest","./internal/tablecook","./internal/tablenames","./internal/tablepack","./internal/tabletext","./internal/tablewire","./internal/version","./internal/viewlisting","./ir","./tables/goruntime","./test/conformance/goose/wirefuzzdispatch","./test/conformance/harness","./test/conformance/lobster/hostile","./test/conformance/lobster/wirefuzzhost","./test/cookgen","./test/cs-hostile/gen","./test/elixir-view/emit","./test/go-hostile/gen","./test/packet-text/harness","./test/packet-text/moo/driver","./test/table-base64/harness","./test/vocabgen","./tools/agentsmap","./tools/cellmerge","./tools/fixedtwin","./tools/hostilecorpus","./tools/hostilecorpusexec","./tools/matrix","./tools/negativecontrols","./tools/pgroup","./tools/releasediff","./tools/releasetag","./tools/roadmap","./tools/roadmap/cmd/roadmap-handtext","./tools/sabotage","./tools/slowgatescan","./tools/treelock","./working"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: siblings
        run: |
          set -euo pipefail
          cd ..
          rm -rf serialize serialize.c serialize.cs serialize.go serialize.rs
          git clone --quiet --depth 1 --branch "$SERIALIZE_TAG"    https://github.com/mas-bandwidth/serialize.git    serialize
          git clone --quiet --depth 1 --branch "$SERIALIZE_C_TAG"  https://github.com/mas-bandwidth/serialize.c.git  serialize.c
          git clone --quiet --depth 1 --branch "$SERIALIZE_CS_TAG" https://github.com/mas-bandwidth/serialize.cs.git serialize.cs
          git clone --quiet --depth 1 --branch "$SERIALIZE_GO_TAG" https://github.com/mas-bandwidth/serialize.go.git serialize.go
          git clone --quiet --depth 1 --branch "$SERIALIZE_RS_TAG" https://github.com/mas-bandwidth/serialize.rs.git serialize.rs
      - name: pins
        run: |
          make dist-lua || echo "MEASURE dist-lua failed"
          make dist-luau
          make dist-goose
          make dist-lobster
      - name: go test
        run: |
          set -uo pipefail
          echo "MEASURE cores $(nproc) host $(hostname)"
          flag=""; [ "${{ matrix.mode }}" = short ] && flag=-short
          start=$(date +%s)
          go test -v -count=1 $flag -timeout 35m "${{ matrix.pkg }}" > "$RUNNER_TEMP/out.txt" 2>&1; st=$?
          end=$(date +%s)
          grep -E '^(ok|FAIL|panic|\?)' "$RUNNER_TEMP/out.txt" || true
          grep -E '^--- (PASS|FAIL)' "$RUNNER_TEMP/out.txt" | sed 's/^/MEASURE-TEST /' || true
          echo "MEASURE-PKG ${{ matrix.mode }} ${{ matrix.pkg }} wall $((end-start)) status $st"
