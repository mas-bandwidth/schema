name: CI fast

# THE PER-PR LANE IS THE HAPPY PATH, AND ONLY THE HAPPY PATH (the owner,
# 2026-11-25, live: per pull request, schema runs ONLY compile + one simple
# happy path per language, one job of two minutes or less; everything else is
# nightly).
#
# ONE JOB, `happy-path`, on the fleet's schema runners. It builds bin/schema
# once, then for every leg `make -s happy-legs` prints (make/happy-path.mk)
# runs `make happy-<lang>`: generate test/happy/Happy.schema for that
# language, compile it with test/happy/<lang>, and run one plain round trip (a
# ShipCreate written, read back, every field compared). Each leg is timed and
# the seconds are printed and written to the job summary. The budget is two
# minutes for the whole job, about 6.7 s a leg; a leg over budget is made
# faster, never moved out, and the limit is never raised.
#
# EVERYTHING THAT RAN HERE BEFORE RUNS NIGHTLY, unchanged, in
# ci-fast-nightly.yml (the plan, the lints, ci-policy, go test, the leg
# gates, the conformance, fuzz and input-family rows, schema-test, pins), with
# ci-full.yml, certify.yml and the per-language nightly workflows.
#
# internal/ci TestPerPRIsTheHappyPathOnly holds this file to that shape: one
# fleet job whose only make targets are bin/schema and the happy path, and no
# push or pull_request trigger on any other workflow that runs schema's code.
# A heavy job added back here is red there.
#
# A FORK'S PULL REQUEST never reaches the fleet: `happy-path` carries the fork
# guard, and the fork gets `fork-pull-request`, a hosted job with no
# permissions and no checkout that fails, saying so.

on:
  # every push to main: the sprint tells a card's red from main's own by this
  # lane's verdict on the base tip, so every main tip needs one
  push:
    branches: [main]
  # every pull request, whatever its base
  pull_request:
  workflow_dispatch:

concurrency:
  # a push to main is grouped by its own sha, so no main tip loses its verdict
  # to the next push
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.ref) }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The same sibling pins ci-full.yml, ci-fast-nightly.yml and certify.yml
# carry: a sibling merging to main mid-day must not change what a schema
# commit proves. The files move together.
env:
  SERIALIZE_TAG: v2.1.6
  SERIALIZE_C_TAG: v2.1.1
  SERIALIZE_GO_TAG: v2.1.1
  SERIALIZE_RS_TAG: v5.0.0
  SERIALIZE_CS_TAG: v2.2.1
  SERIALIZE_JS_TAG: v2.1.2

jobs:
  # A FORK'S PULL REQUEST: the one job it starts, and it is red. Hosted, with
  # no permissions and no checkout, so none of the fork's code runs anywhere.
  fork-pull-request:
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: a fork's pull request runs no CI here
        shell: bash
        run: |
          echo "::error title=No CI ran::This pull request comes from a fork. Fork code never runs on this repository's own runners, so no gate has run on it. A maintainer who has read the diff pushes its head to a branch in mas-bandwidth/schema and opens the pull request from that branch, where the fast lane runs."
          exit 1

  happy-path:
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, fleet, schema]
    timeout-minutes: 2
    defaults:
      run:
        shell: go run ./tools/pgroup -- bash -e -o pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/merge-main
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: runner.environment == 'github-hosted'
        with:
          go-version: '1.26'
          cache: false

      # the sibling runtimes the legs compile against, at their pins, cloned
      # in parallel; a failed clone fails the step by name
      - name: the sibling runtimes (pinned releases)
        run: |
          set -euo pipefail
          cd ..
          rm -rf serialize serialize.go serialize.c serialize.rs serialize.cs serialize.js
          pids=""
          clone() { git clone --quiet --depth 1 --branch "$1" "https://github.com/mas-bandwidth/$2.git" "$2" || { echo "::error::clone of $2 at $1 failed"; return 1; }; }
          clone "$SERIALIZE_TAG" serialize & pids="$pids $!"
          clone "$SERIALIZE_GO_TAG" serialize.go & pids="$pids $!"
          clone "$SERIALIZE_C_TAG" serialize.c & pids="$pids $!"
          clone "$SERIALIZE_RS_TAG" serialize.rs & pids="$pids $!"
          clone "$SERIALIZE_CS_TAG" serialize.cs & pids="$pids $!"
          clone "$SERIALIZE_JS_TAG" serialize.js & pids="$pids $!"
          bad=0
          for p in $pids; do wait "$p" || bad=1; done
          exit "$bad"

      - name: build bin/schema once
        run: make bin/schema

      # every leg, each timed; every leg runs even after one fails, so one run
      # names every red leg, and any red fails the step
      - name: compile + one round trip, every language
        run: |
          set -euo pipefail
          # the SDK env.sh nova-fleet sdk-toolchain writes: ~/sdk/env.sh is its contract (a link to
          # /opt/nova/sdk on most hosts, a real directory on captain), /opt/nova/sdk the old path
          for sdk_env in "$HOME/sdk/env.sh" /opt/nova/sdk/env.sh; do
            if [ -f "$sdk_env" ]; then . "$sdk_env"; break; fi
          done
          [ -n "${NOVA_SDK:-}" ] || { echo "::error::no SDK env.sh on $RUNNER_NAME (looked at ~/sdk/env.sh and /opt/nova/sdk/env.sh); run nova-fleet sdk-toolchain there"; exit 1; }
          legs=$(make -s happy-legs)
          [ -n "$legs" ] || { echo "::error::make happy-legs printed no legs"; exit 1; }
          failed=""
          total=0
          {
            echo "| leg | seconds | verdict |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for l in $legs; do
            echo "::group::happy-$l"
            s=$(date +%s%N)
            if make --no-print-directory "happy-$l"; then verdict=ok; else verdict=FAILED; failed="$failed $l"; fi
            ms=$(( ($(date +%s%N) - s) / 1000000 ))
            total=$(( total + ms ))
            echo "::endgroup::"
            secs=$(printf '%d.%03d' $(( ms / 1000 )) $(( ms % 1000 )))
            echo "happy-seconds $l $secs $verdict"
            echo "| $l | $secs | $verdict |" >> "$GITHUB_STEP_SUMMARY"
          done
          secs=$(printf '%d.%03d' $(( total / 1000 )) $(( total % 1000 )))
          echo "happy-seconds total $secs"
          echo "| total | $secs | |" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$failed" ]; then
            echo "::error::the happy path failed for:$failed"
            exit 1
          fi
