        include: [{"name":"conformance-leg-go","target":"conformance-leg-go","paths":"bin/schema build/conformance-go build/conformance-harness-vm build/tables-counted-min-variable build/tables-generated-go build/tables-generated-go-announce build/tables-generated-go-framing build/tables-generated-go-r19 build/tables-lists-variable build/tables-r1-variable"},{"name":"conformance-leg-goose","target":"conformance-leg-goose","paths":"bin/schema build/conformance-goose build/conformance-harness-vm build/schema-goose"},{"name":"conformance-leg-cpp","target":"conformance-leg-cpp","paths":"bin/schema build/conformance-cpp build/conformance-cpp-objs build/conformance-harness-vm build/schema_test_cook build/tables-generated"},{"name":"lint-cpp","target":"tables-cpp-clean-inputs","paths":"bin/schema build/tables-generated generated/cpp generated/bench/cpp generated/bench/tables/cpp generated/bench/paired/cpp"},{"name":"lint-js","target":"tables-js-clean-inputs","paths":"bin/schema build/tables-generated-js generated/js generated/js-ludicrous generated/bench/js generated/bench/paired/js"},{"name":"lint-rust","target":"tables-rust-clippy-inputs","paths":"bin/schema build/tables-generated-rust build/tables-generated-rust-witnesses"},{"name":"lint-lua","target":"tables-lua-luacheck-inputs","paths":"bin/schema build/lua-luacheck-corpus build/lua-luacheck.rc"}]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/merge-main
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: runner.environment == 'github-hosted'
        with:
          go-version: '1.26'
          cache: false
      - uses: ./.github/actions/schema-test-setup
        with:
          lang: none
      - uses: ./.github/actions/produce
        with:
          mode: produce
          name: ${{ matrix.name }}
          target: ${{ matrix.target }}
          paths: ${{ matrix.paths }}

  # THE REGISTRY'S PR GROUP, one job per row of docs/CI-TIERS.md's matrix,
