name: spec pins (section 8 and later)

# THE SECTION 8 PIN GATE (docs/SPEC-TABLES.md section 8 and every later
# section): every normative sentence carries a row id, every row is pinned in
# every port that carries its feature or owed by name, and every pin resolves
# to a test that runs. Unit tier, seconds, so it rides every pull request that
# can move a row or a pinned test, and repeats nightly so a drift in a port's
# test tree is caught without waiting for an edit.

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * *'

jobs:
  spec-pins-s8:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # the fleet's own Linux runners, never a GitHub-hosted one and never the
    # studio; `fleet` keeps the job off the slow benches
    runs-on: [self-hosted, Linux, fleet, schema]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false
      - name: the section 8 spec-pin gate
        # make/schema-spec-pin-s8.mk, included by the Makefile's
        # wildcard line after the design card's include (make/*.mk is the
        # discovered-port registry, so a check fragment does not live there)
        run: make schema-spec-pin-s8
