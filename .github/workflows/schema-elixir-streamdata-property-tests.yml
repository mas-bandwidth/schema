name: schema-elixir-streamdata-property-tests

# The Elixir leg's StreamData property lens. The fast pass runs on every push
# and pull request inside the one-minute budget; the nightly pass raises the
# number of generated values per table and is not on the change path.
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

jobs:
  property:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29.0.5"
          elixir-version: "1.20.4"
      - name: StreamData property tests over the generated Elixir
        run: make schema-elixir-streamdata-property-tests ELIXIR_STREAMDATA_RUNS=25
      - name: Planted corruption makes the gate red
        run: make schema-elixir-streamdata-property-tests-negative-control

  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "29.0.5"
          elixir-version: "1.20.4"
      - name: StreamData property tests, long pass
        run: make schema-elixir-streamdata-property-tests ELIXIR_STREAMDATA_RUNS=500
