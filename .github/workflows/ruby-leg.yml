name: ruby leg

# THE RUBY LEG (docs/PORT-RUBY.md): `make test-ruby` on the pinned
# interpreters, on Linux and macOS. The pins are CRuby 3.4.12 (the floor) and
# CRuby 4.0.9 (the current pin), with RuboCop 1.92.2, Steep 2.1.0 and RBS
# 4.2.0 in each, built and installed into dist/ by `make dist-ruby`;
# .github/actions/ruby restores them from a store keyed on every pin and the
# lock, and checks the restored tree against the pins before anything runs on
# it. No step runs an interpreter from PATH.
#
# Until the skeleton lands make/ruby.mk and defines test-ruby, this runs the
# toolchain check, and it always runs the toolchain control.
#
# A GITHUB-HOSTED RUNNER, so a fork's pull request may run it: the job runs
# the repository's own code against pinned tools and holds no secret.

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'make/ruby*'
      - '.github/workflows/ruby-leg.yml'
      - '.github/actions/ruby/**'
      - 'internal/ci/rubypins_test.go'
      - 'docs/PORT-RUBY.md'
  pull_request:
    paths:
      - 'make/ruby*'
      - '.github/workflows/ruby-leg.yml'
      - '.github/actions/ruby/**'
      - 'internal/ci/rubypins_test.go'
      - 'docs/PORT-RUBY.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: make test-ruby (${{ matrix.os }})
    if: startsWith(github.head_ref, 'sprint/') == false && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: fleet, runner: [self-hosted, Linux, X64, fleet, schema] }
          - { os: macos-latest, runner: macos-latest }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 2
    defaults:
      run:
        shell: go run ./tools/pgroup -- bash -e {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: runner.environment == 'github-hosted'
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/ruby
      - name: make test-ruby (or the toolchain check until the skeleton lands)
        run: |
          if make -n test-ruby >/dev/null 2>&1; then
            make -j"$(getconf _NPROCESSORS_ONLN)" test-ruby
          else
            make ruby-toolchain-check
          fi
      - name: make ruby-toolchain-negative-control
        run: make ruby-toolchain-negative-control
