name: schema leg

# REUSABLE WORKFLOW (issue #nx-g30). The nine schema legs — C, C++, C#,
# Dart, Elixir, Go, Java, JavaScript and Rust — run from one workflow with a
# matrix input. A tenth leg is one matrix entry, because the matrix is the
# registry under test/conformance/<lang>/: a <lang> directory with a
# `driver` and a `ci.json` is exactly what the matrix sees, and nothing else
# names a leg, so adding the two files grows the fan-out by one.
#
# The matrix is discovered from the tree rather than typed here for the same
# reason it isn't typed in ci.yml's conformance pair (`harness matrix README
# §"Registering a language"`): a port touches nothing else, and a leg whose
# make targets move do not touch this file. Repeating the discovery here is
# deliberate — the caller `uses:` this workflow with no inputs and gets the
# same set of legs, whatever the caller's own matrix looks like.
#
# ONLY certify.yml (nightly and dispatch) calls this file, so it is held to
# the nightly rule below: no row carries a timeout. Its env block repeats
# PGROUP_GO_TEST_TIMEOUT because a called workflow does not see its caller's.

# NIGHTLY RUNS HAVE NO TIMEOUT (the owner, 2026-11-16: "Nightly runs don't
# have a timeout... they can run as long as they need."). No job or step in
# this file carries timeout-minutes, and PGROUP_GO_TEST_TIMEOUT: '0' below has
# tools/pgroup give every go test under a step -timeout=0 in place of the one
# it names, so a slow row finishes and reports every test. GitHub's default
# 360-minute job limit is the only backstop, and a job it stops reads
# cancelled, never green. internal/ci/nightly_test.go holds the rule.

on:
  workflow_call:

# The runtimes the generated code targets, pinned to each sibling's latest
# RELEASED tag — never main, for the same reason ci.yml and certify.yml pin
# them: a sibling merging mid-day must not change what a certify run proves.
# The three files move together; bumping a pin here is the same edit as there.
env:
  # the nightly rule in the header: no go test -timeout under tools/pgroup
  PGROUP_GO_TEST_TIMEOUT: '0'
  SERIALIZE_TAG: v2.1.3
  SERIALIZE_C_TAG: v2.1.1
  SERIALIZE_GO_TAG: v2.1.1
  SERIALIZE_RS_TAG: v5.0.0
  SERIALIZE_CS_TAG: v2.1.1
  SERIALIZE_JS_TAG: v2.1.2

jobs:
  # THE SAME TWO-JOB SHAPE ci.yml's conformance pair carries. The first job
  # emits the matrix from the registry; the second fans out one run per row.
  # No inputs come from the caller: the matrix is the registry, full stop.
  leg-matrix:
    runs-on: [self-hosted, Linux, X64, fleet, schema]
    defaults:
      run:
        shell: go run ./tools/pgroup -- bash -e {0}
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: runner.environment == 'github-hosted'
        with:
          go-version: '1.26'
          cache: false

      - id: discover
        name: the registry, as a matrix
        run: |
          matrix=$(go run ./test/conformance/harness matrix)
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  legs:
    needs: leg-matrix
    if: needs.leg-matrix.outputs.matrix != '[]'
    name: leg (${{ matrix.lang }})
    runs-on: [self-hosted, Linux, X64, fleet, schema]
    defaults:
      run:
        shell: go run ./tools/pgroup -- bash -e {0}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.leg-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Sibling cloned exactly where ci.yml's conformance job clones it,
      # with the same conditional: a leg whose generated code names no
      # runtime leaves both fields empty and clones nothing. The tag comes
      # from the workflow pin the row names, never main.
      - name: Check out the sibling runtime this leg needs (pinned release)
        if: matrix.runtime != ''
        run: |
          tag=$(printenv "${{ matrix.runtime_tag }}")
          rm -rf "../${{ matrix.runtime }}"
          git clone --quiet --depth 1 --branch "$tag" "https://github.com/mas-bandwidth/${{ matrix.runtime }}.git" "../${{ matrix.runtime }}"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: runner.environment == 'github-hosted'
        with:
          go-version: '1.26'
          cache: false

      # The .NET SDK pin, read from the file every csproj's TargetFramework
      # also names — ci.yml and certify.yml's matrices name the FILE rather
      # than restating the version, and issue #470's gate is what keeps them
      # the same number.
      - name: read the .NET SDK pin
        if: matrix.dotnet != ''
        run: echo "DOTNET_SDK_PIN=$(cat .github/dotnet-version)" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        if: (matrix.dotnet != '') && runner.environment == 'github-hosted'
        with:
          dotnet-version: ${{ env.DOTNET_SDK_PIN }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.node != ''
        with:
          node-version: ${{ matrix.node }}

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # the stable BRANCH head — the SHA freezes the action, not the compiler: rustup resolves stable at run time
        with:
          components: clippy, rustfmt
        if: matrix.rust != ''

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        if: matrix.dart != ''
        with:
          sdk: ${{ matrix.dart }}

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        if: matrix.java != ''
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}

      - name: isolate Mix and Hex in the job temp directory
        if: matrix.otp != ''
        run: |
          echo "MIX_HOME=$RUNNER_TEMP/.mix" >> "$GITHUB_ENV"
          echo "HEX_HOME=$RUNNER_TEMP/.hex" >> "$GITHUB_ENV"

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        if: matrix.otp != '' && runner.environment == 'github-hosted'
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      # The Ruby pins (make/ruby-toolchain.mk), for a row naming `ruby`:
      # .github/actions/ruby restores or builds CRuby 3.4.12, CRuby 4.0.9 and
      # the locked analyzers under dist/.
      - uses: ./.github/actions/ruby
        if: matrix.ruby != ''

      # The moo pin (make/moo.mk, MOO_PIN), for a row whose ci.json or group
      # names `moo`: .github/actions/moo builds it once per runner image and
      # caches it under the pin.
      - uses: ./.github/actions/moo
        if: matrix.moo != ''

      # The Python pins (make/python-toolchain.mk: CPython 3.11.18, CPython
      # 3.15.2 and mypy), for a row whose ci.json names `python`: the leg's
      # driver runs only the pinned interpreter and refuses by name without
      # it. .github/actions/python builds them once per runner image and
      # keeps them under the pins.
      - uses: ./.github/actions/python
        if: matrix.python != ''

      # THE LOBSTER PIN, installed as make/lobster.mk's dist-lobster does, at
      # the row's version; the linux release links libOpenGL and libGLX, which
      # the hosted ubuntu image does not carry.
      - name: install the Lobster pin
        if: matrix.lobster != ''
        run: |
          set -euo pipefail
          if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libopengl0 libglx0
          fi
          make dist-lobster LOBSTER_VERSION=${{ matrix.lobster }}

      # THE SQUIRREL STEP, as ci-full.yml's conformance job has it: the pinned
      # interpreter is built from source by `make dist-squirrel` at the sha256
      # make/squirrel.mk names, and put on PATH so the leg's `SQ=sq` (ci.json)
      # resolves. Without it the certify run's squirrel row refuses at its
      # toolchain gate.
      - name: build and install the pinned Squirrel interpreter
        if: matrix.squirrel != ''
        run: |
          make dist-squirrel
          mkdir -p "$RUNNER_TEMP/bin"
          ln -sf "$PWD/dist/squirrel-3.2/bin/sq" "$RUNNER_TEMP/bin/sq"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # THE LUA STEP, as ci-full.yml's conformance job has it: the pinned
      # PUC-Rio interpreter is built from source by `make dist-lua` at the
      # sha256 make/lua.mk names, and put on PATH so the leg's `LUA=lua`
      # (ci.json) resolves. Without it the driver fails with "lua: not found".
      - name: install the pinned Lua interpreter
        if: matrix.lua != ''
        run: |
          make dist-lua
          mkdir -p "$RUNNER_TEMP/bin"
          ln -sf "$PWD/dist/lua-${{ matrix.lua }}/src/lua" "$RUNNER_TEMP/bin/lua"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # THE LUAU PIN, as ci-full.yml's conformance job installs it: make/luau.mk's
      # dist-luau, the sha256 refused before anything is unpacked, into the
      # dist/luau-<version>/ path the driver runs. Without it the driver fails
      # with "dist/luau-<version>/luau: not found".
      - name: install the Luau pin
        if: matrix.luau != ''
        run: make dist-luau LUAU_VERSION=${{ matrix.luau }}


      # The two halves split so a failing build fails the run before the
      # harness's overhead shows in the log; both run with the row's env so
      # a toolchain-on-PATH leg (java, elixir, js, dart, rust) sees the
      # CI-installed binary, not the repo-local dist/ one.
      - name: build the harness and the ${{ matrix.lang }} driver
        run: make ${{ matrix.targets }} ${{ matrix.env }}

      - name: the ${{ matrix.lang }} leg over every surface
        run: env ${{ matrix.env }} ./build/conformance-harness run --only ${{ matrix.lang }}
