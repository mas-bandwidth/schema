name: schema-luau generated analyze strict gate

# The Luau lens (ideas roadmap group schema-per-language-lenses; the card
# schema-luau-generated-analyze-strict-gate): luau-analyze --mode=strict over
# the generated Luau output for the schema corpus, plus the planted-pattern
# control that proves the gate fires.
#
# Fast parts run on push and pull request. There are no heavy parts: the
# corpus generation and one analyzer process cost about six seconds on the
# bench, so the scheduled run repeats the same gate rather than adding a
# nightly budget line.
#
# moo is deterministic Luau and emits the same .luau files; this run covers it.
#
# THIS JOB RUNS ON THE FLEET (self-hosted, schema set), never on a GitHub-hosted
# runner. Because the repository is public, a pull request from a FORK must
# never run on fleet hardware: the job carries the fork guard, so a fork's pull
# request gets no CI run here and a maintainer runs it by workflow_dispatch
# after reading the diff. The toolchains are pinned on the fleet's runners; the
# job presence-checks the pinned tools instead of installing them.

on:
  push:
    branches: [ main, dev, fixed-table-form ]
    paths:
      - 'make/schema-luau-generated-analyze-strict-gate.mk'
      - 'make/luau.mk'
      - '.github/workflows/schema-luau-generated-analyze-strict-gate.yml'
      - 'internal/ci/schema_luau_generated_analyze_strict_gate_test.go'
      - 'internal/codegen/luau/**'
      - 'internal/codegen/luautable/**'
      - 'compiler/target_luau.go'
      - 'examples/**'
      - 'examples128/**'
      - 'examples-wide/**'
      - 'bench/corpus/**'
      - 'tables/**'
      - 'test/tables/**'
      - 'testdata/conformance/tables/MANIFEST.txt'
  pull_request:
    paths:
      - 'make/schema-luau-generated-analyze-strict-gate.mk'
      - 'make/luau.mk'
      - '.github/workflows/schema-luau-generated-analyze-strict-gate.yml'
      - 'internal/ci/schema_luau_generated_analyze_strict_gate_test.go'
      - 'internal/codegen/luau/**'
      - 'internal/codegen/luautable/**'
      - 'compiler/target_luau.go'
      - 'examples/**'
      - 'examples128/**'
      - 'examples-wide/**'
      - 'bench/corpus/**'
      - 'tables/**'
      - 'test/tables/**'
      - 'testdata/conformance/tables/MANIFEST.txt'
  schedule:
    # nightly, after the other language lenses
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  luau-analyze-strict:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [ self-hosted, Linux, X64, fleet, schema ]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: presence check pinned go 1.26
        run: |
          want='1.26'
          got=$(go version | sed -n 's/.*go\([0-9]\+\.[0-9]\+\)\(\.\([0-9]\+\)\)\{0,1\}.*/\1/p')
          if [ "$got" != "$want" ]; then
            echo "TOOL-MISSING go $want ${got:-absent} on $RUNNER_NAME"
            exit 1
          fi
      - name: presence check pinned luau-analyze 0.741
        run: |
          want='0.741'
          if ! command -v luau-analyze >/dev/null 2>&1; then
            echo "TOOL-MISSING luau-analyze $want absent on $RUNNER_NAME"
            exit 1
          fi
          got=$(readlink -f "$(command -v luau-analyze)")
          case "$got" in
            *"/luau-$want/"*) ;;
            *) echo "TOOL-MISSING luau-analyze $want ${got:-absent} on $RUNNER_NAME"; exit 1 ;;
          esac
          echo "LUAU=$(command -v luau)" >> "$GITHUB_ENV"
          echo "LUAU_ANALYZE=$(command -v luau-analyze)" >> "$GITHUB_ENV"
      - name: planted-pattern control (the gate fires)
        run: make schema-luau-generated-analyze-strict-gate-negative-control
      - name: luau-analyze --mode=strict over the corpus
        run: make schema-luau-generated-analyze-strict-gate
