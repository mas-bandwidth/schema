name: schema-js generated checkJs strict + eslint gate

# THE JAVASCRIPT LENS on the generated output (make/schema-js-generated-checkjs-
# strict-eslint-gate.mk). The fast half is a lint pass over the committed
# generated trees plus the planted-pattern control; it runs on push and pull
# request and adds about two seconds to a runner that already has node. The
# strict TypeScript half is a heavier, whole-corpus analysis and runs nightly
# and on demand, never per push.

on:
  push:
    paths:
      - "make/schema-js-generated-checkjs-strict-eslint-gate.mk"
      - "make/js.mk"
      - "eslint.config.mjs"
      - "internal/codegen/js/**"
      - "generated/**"
      - ".github/workflows/schema-js-generated-checkjs-strict-eslint-gate.yml"
  pull_request:
    paths:
      - "make/schema-js-generated-checkjs-strict-eslint-gate.mk"
      - "make/js.mk"
      - "eslint.config.mjs"
      - "internal/codegen/js/**"
      - "generated/**"
      - ".github/workflows/schema-js-generated-checkjs-strict-eslint-gate.yml"
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eslint-strict:
    name: eslint strict + planted pattern (fast)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: false
      # eslint is the fleet pin; npx from the official registry is not used here.
      - run: npm install --global eslint@9.39.5
      - name: the lens and its planted control
        run: |
          make schema-js-generated-checkjs-strict-eslint-gate-eslint
          make schema-js-generated-checkjs-strict-eslint-gate-eslint-negative-control
      - name: the card's Go test (pins and the red/green plant)
        run: go test ./internal/ci -run '^TestSchemaJSGeneratedCheckJSEslintGate' -count=1 -timeout 600s -v

  checkjs-strict:
    name: checkJs --strict whole corpus (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: false
      - name: generate the tables corpus (same directories make/js.mk reads)
        run: |
          make bin/schema
          make build/tables-generated-js/.stamp
          make generated/js/.stamp generated/js-ludicrous/.stamp generated/bench/js/.stamp generated/bench/paired/js/.stamp
      - name: checkJs --strict over the whole corpus
        run: make schema-js-generated-checkjs-strict-eslint-gate-checkjs
      - name: keep the triage log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-js-checkjs-strict
          path: build/schema-js-checkjs/strict.log
          if-no-files-found: ignore
