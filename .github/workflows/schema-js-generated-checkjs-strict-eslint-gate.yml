name: schema-js generated checkJs strict + eslint gate

# THE JAVASCRIPT LENS on the generated output (make/schema-js-generated-checkjs-
# strict-eslint-gate.mk). Per push and pull request: the strict ESLint layer
# over the committed generated trees and the negative control, which plants a
# type error and a lint violation into generated/js/Degenerate.js (header kept)
# and proves both checkers go red on it. Nightly and on demand: the whole
# corpus, the build/tables-generated-js tree included, under both checkers.
# ON THE FLEET (all CI runs on our self-hosted runners, never GitHub-hosted):
# the schema runners carry Go, node, eslint 9.39.5 and TypeScript 5.9.3 on the
# runner PATH (~/sdk, installed by the fleet toolchains play from the official
# npm registry). Nothing is installed here; the make targets probe each pin and
# fail "tool missing" if a runner is off it.

on:
  push:
    paths:
      - "make/schema-js-generated-checkjs-strict-eslint-gate.mk"
      - "make/js.mk"
      - "eslint.config.mjs"
      - "internal/codegen/js/**"
      - "internal/codegen/jstable/**"
      - "generated/**"
      - ".github/workflows/schema-js-generated-checkjs-strict-eslint-gate.yml"
  pull_request:
    paths:
      - "make/schema-js-generated-checkjs-strict-eslint-gate.mk"
      - "make/js.mk"
      - "eslint.config.mjs"
      - "internal/codegen/js/**"
      - "internal/codegen/jstable/**"
      - "generated/**"
      - ".github/workflows/schema-js-generated-checkjs-strict-eslint-gate.yml"
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast:
    name: eslint strict over the committed trees + the planted control
    runs-on: [self-hosted, Linux, X64, fleet, schema]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the fleet pins on the runner PATH
        run: |
          set -eu
          go version
          node --version
          test "$(eslint --version)" = v9.39.5
          test "$(tsc --version)" = "Version 5.9.3"
      - name: the committed generated trees are what this compiler emits (stale trees fail)
        run: make generated-current
      - name: the checkJs ratchet's own refusals (synthetic tsc output)
        run: make schema-js-generated-checkjs-strict-eslint-gate-ratchet-self-test
      - name: eslint strict over the committed generated trees
        run: make schema-js-generated-checkjs-strict-eslint-gate-eslint SCHEMA_JS_GATE_CORPUS=fast
      - name: checkJs --strict over the committed generated trees, against the fast-corpus per-code pin
        run: make schema-js-generated-checkjs-strict-eslint-gate-checkjs SCHEMA_JS_GATE_CORPUS=fast
      - name: the negative control (plant in a real generated file, both checkers red)
        run: make schema-js-generated-checkjs-strict-eslint-gate-negative-control
      - name: the card's Go test (the pins and the registry entry)
        run: go test ./internal/ci -run '^TestSchemaJS(GeneratedCheckJSEslintGate(Pins|PlantIsInARealFile|ControlIsRegistered|RunsOnTheFleet)|CheckJSRatchet(SelfTestCoversPartialFailureAndGrowth|PinIsRecorded))$' -count=1 -timeout 600s -v

  full:
    name: both checkers over the whole corpus (nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64, fleet, schema]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the fleet pins on the runner PATH
        run: |
          set -eu
          go version
          node --version
          test "$(eslint --version)" = v9.39.5
          test "$(tsc --version)" = "Version 5.9.3"
      - name: generate the corpus (the directories make/js.mk's generate targets write)
        run: |
          make bin/schema
          make build/tables-generated-js/.stamp generated/js/.stamp generated/js-ludicrous/.stamp generated/bench/js/.stamp generated/bench/paired/js/.stamp
      - name: the negative control
        run: make schema-js-generated-checkjs-strict-eslint-gate-negative-control
      - name: eslint strict and checkJs --strict over the whole corpus
        run: make -k schema-js-generated-checkjs-strict-eslint-gate SCHEMA_JS_GATE_CORPUS=full
      - name: keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-js-gate
          path: build/schema-js-gate
          if-no-files-found: ignore
