name: Schema squirrel nightly fuzz

# FORKS: this repository is PUBLIC, so a pull request from a fork must never run
# on fleet hardware. The harness job carries the fork guard; a fork's pull
# request gets no CI run, and a maintainer reruns it by workflow_dispatch after
# reading the diff.
#
# THE SQUIRREL PORT'S NIGHTLY FUZZ (docs/PORT-SQUIRREL.md, THE CARD MAP;
# docs/SPEC-TABLES.md §4.2). The campaign itself is
# `make schema-squirrel-nightly-fuzz` (make/schema-squirrel-nightly-fuzz.mk):
# the port's seeded mutation differential over the tables conformance corpus,
# bounded by SQUIRREL_FUZZ_SECONDS, go test's -timeout (inside ten minutes a night).
#
# IT IS NIGHTLY, NEVER PER PUSH. Nothing about a search that runs for minutes
# belongs on the iteration path (owner's rule: CI that runs per commit finishes
# in one to two minutes). The pull-request job below is the REPLAY half only:
# the harness's own structural checks, no fuzzing, no foreign toolchain.
on:
  schedule:
    - cron: '47 9 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'make/schema-squirrel-nightly-fuzz.mk'
      - '.github/workflows/schema-squirrel-nightly-fuzz.yml'
      - 'internal/codegen/squirreltable/fuzz_test.go'
      - 'internal/codegen/squirreltable/nightly_fuzz_test.go'
      - 'internal/codegen/squirreltable/nightly_fuzz_readers_test.go'
      - 'internal/ci/schema_squirrel_nightly_fuzz_test.go'
      - 'testdata/conformance/tables/**'

concurrency:
  group: schema-squirrel-nightly-fuzz-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # THE FAST HALF: the target, the corpus file and the control exist and the
  # planted patterns are refused. Pure Go, no sq, no corpus build.
  harness:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, fleet, schema]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'Tool presence check: go'
        run: |
          want="$(sed -nE 's/^go ([0-9]+\.[0-9]+)$/\1/p' go.mod)"
          got="$(go version | sed -nE 's/.*go([0-9]+\.[0-9]+).*/\1/p')"
          if [ -z "$got" ] || [ "$got" != "$want" ]; then
            echo "TOOL-MISSING go $want $got ($RUNNER_NAME)"
            exit 1
          fi
      - run: go test -count=1 -timeout 600s ./internal/ci -run '^TestSquirrelNightlyFuzz'

  # THE NIGHTLY CAMPAIGN on the fleet's schema runners, where the pinned sq is
  # already installed by the toolchains role. A missing tool is named, never
  # skipped green.
  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64, fleet, schema]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'Tool presence check: go'
        run: |
          want="$(sed -nE 's/^go ([0-9]+\.[0-9]+)$/\1/p' go.mod)"
          got="$(go version | sed -nE 's/.*go([0-9]+\.[0-9]+).*/\1/p')"
          if [ -z "$got" ] || [ "$got" != "$want" ]; then
            echo "TOOL-MISSING go $want $got ($RUNNER_NAME)"
            exit 1
          fi
      - run: make dist-squirrel
      - run: make schema-squirrel-nightly-fuzz
      - run: make schema-squirrel-nightly-fuzz-negative-control
