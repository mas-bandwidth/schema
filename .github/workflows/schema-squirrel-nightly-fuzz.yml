name: Schema squirrel nightly fuzz

# FORKS: this repository is PUBLIC, so a pull request from a fork must never run
# on fleet hardware. The harness job carries the fork guard; a fork's pull
# request gets no CI run, and a maintainer reruns it by workflow_dispatch after
# reading the diff.
#
# THE SQUIRREL PORT'S NIGHTLY FUZZ (docs/PORT-SQUIRREL.md, THE CARD MAP;
# docs/SPEC-TABLES.md §4.2). The campaign itself is
# `make schema-squirrel-nightly-fuzz` (make/schema-squirrel-nightly-fuzz.mk):
# the port's seeded mutation differential over the tables conformance corpus,
# bounded by its mutant count (SQUIRREL_FUZZ_MUTANTS) and seed. The recipe's
# -timeout $(SQUIRREL_FUZZ_SECONDS)s bounds a workstation run; here the nightly
# rule below lifts it, so a slow night finishes and reports rather than dying.
#
# IT IS NIGHTLY, NEVER PER PUSH. Nothing about a search that runs for minutes
# belongs on the iteration path (owner's rule: CI that runs per commit finishes
# in one to two minutes). The pull-request job below is the REPLAY half only:
# the harness's own structural checks, no fuzzing, no foreign toolchain.
# NIGHTLY RUNS HAVE NO TIMEOUT (the owner, 2026-11-16: "Nightly runs don't
# have a timeout... they can run as long as they need."). No job or step in
# this file carries timeout-minutes, and PGROUP_GO_TEST_TIMEOUT: '0' below has
# tools/pgroup give every go test under a step -timeout=0 in place of the one
# it names, so a slow row finishes and reports every test. GitHub's default
# 360-minute job limit is the only backstop, and a job it stops reads
# cancelled, never green. internal/ci/nightly_test.go holds the rule.

on:
  # NIGHTLY AND DISPATCH ONLY (the owner, 2026-11-15: "I want everything that is not light moved to
  # nightly test now." "no exceptions."). A push or pull request runs only the fast lane, ci-fast.yml.
  schedule:
    - cron: '47 9 * * *'
  workflow_dispatch:

concurrency:
  group: schema-squirrel-nightly-fuzz-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # the nightly rule in the header: no go test -timeout under tools/pgroup
  PGROUP_GO_TEST_TIMEOUT: '0'

jobs:
  # THE FAST HALF: the target, the corpus file and the control exist and the
  # planted patterns are refused. Pure Go, no sq, no corpus build.
  harness:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, fleet, schema]
    defaults:
      run:
        shell: go run ./tools/pgroup -- bash -e {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'Tool presence check: go'
        run: |
          want="$(sed -nE 's/^go ([0-9]+\.[0-9]+)$/\1/p' go.mod)"
          got="$(go version | sed -nE 's/.*go([0-9]+\.[0-9]+).*/\1/p')"
          if [ -z "$got" ] || [ "$got" != "$want" ]; then
            echo "TOOL-MISSING go $want $got ($RUNNER_NAME)"
            exit 1
          fi
      - run: go test -count=1 -timeout 0 ./internal/ci -run '^TestSquirrelNightlyFuzz'

  # THE NIGHTLY CAMPAIGN on the fleet's schema runners, where the pinned sq is
  # already installed by the toolchains role. A missing tool is named, never
  # skipped green.
  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64, fleet, schema]
    defaults:
      run:
        shell: go run ./tools/pgroup -- bash -e {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'Tool presence check: go'
        run: |
          want="$(sed -nE 's/^go ([0-9]+\.[0-9]+)$/\1/p' go.mod)"
          got="$(go version | sed -nE 's/.*go([0-9]+\.[0-9]+).*/\1/p')"
          if [ -z "$got" ] || [ "$got" != "$want" ]; then
            echo "TOOL-MISSING go $want $got ($RUNNER_NAME)"
            exit 1
          fi
      - run: make dist-squirrel
      - run: make schema-squirrel-nightly-fuzz
      - run: make schema-squirrel-nightly-fuzz-negative-control
