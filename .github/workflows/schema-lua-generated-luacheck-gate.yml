name: schema Lua generated luacheck gate

# THE LUA LEG'S STRICT-CHECKER LENS (ideas roadmap group
# schema-per-language-lenses). luacheck 1.2.0 runs over the Lua the compiler
# generates for the Makefile's own schema corpus, and over the runtime emitted
# beside it. The target is the card's own make file; this workflow only names
# it, so a card landing the target and a card landing the schedule do not edit
# the same lines.
#
# THE SPLIT IS BY COST. The checker itself parses in seconds, but the corpus
# build generates 36 units (measured ~78 s cold on the bench, 23 s warm), so
# the whole lens and its planted control run on the nightly schedule and
# workflow_dispatch with a time budget. The fast half — the static test that
# holds this workflow and the gate's wiring to their shape — runs on a push or
# pull request that touches the lens and stays well inside the one-minute
# budget (a checkout, setup-go, and one package of Go tests).
on:
  push:
    paths:
      - 'make/schema-lua-generated-luacheck-gate.mk'
      - 'internal/codegen/lua/**'
      - 'internal/codegen/luatable/**'
      - 'internal/ci/schema_lua_generated_luacheck_gate_test.go'
      - '.github/workflows/schema-lua-generated-luacheck-gate.yml'
  pull_request:
    paths:
      - 'make/schema-lua-generated-luacheck-gate.mk'
      - 'internal/codegen/lua/**'
      - 'internal/codegen/luatable/**'
      - 'internal/ci/schema_lua_generated_luacheck_gate_test.go'
      - '.github/workflows/schema-lua-generated-luacheck-gate.yml'
  workflow_dispatch:
  schedule:
    # nightly, 03:17 UTC — not on the hour, so the fleet's jobs do not collide
    - cron: '17 3 * * *'

concurrency:
  group: schema-lua-luacheck-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly

jobs:
  static:
    name: the lens's wiring and cost split
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: [ self-hosted, Linux, X64, fleet, schema ]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # the runner's own pinned go already satisfies go.mod
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: runner.environment == 'github-hosted'
        with:
          go-version: '1.26'
          cache: false

      - name: the target and its workflow agree on the gate and the plant
        run: go test ./internal/ci -run 'LuaGeneratedLuacheck' -count=1 -timeout 600s

  luacheck:
    name: generated Lua under luacheck 1.2.0
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [ self-hosted, Linux, X64, fleet, schema ]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # the runner's own pinned go already satisfies go.mod
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: runner.environment == 'github-hosted'
        with:
          go-version: '1.26'
          cache: false

      # The checker is fleet software, installed through rowan-tools/fleet from
      # its official source and pinned by the make file at 1.2.0. A host that
      # does not carry it says so by name; it never reports a green it did not
      # run.
      - name: the pinned checker is present
        run: |
          set -euo pipefail
          if ! command -v luacheck >/dev/null 2>&1; then
            echo "::error::tool missing: luacheck 1.2.0 — install it fleet-wide from its official source (rowan-tools/fleet)"
            exit 1
          fi
          luacheck --version

      - name: the generated Lua is clean under luacheck
        run: make tables-lua-luacheck

      # THE NEGATIVE CONTROL RIDES THE SAME JOB, because a green checker that
      # has never named a plant is not a verdict. It plants a dead local in a
      # copy of the emitted runtime and requires luacheck to name it. It shares
      # the job's corpus build, so the plant costs the copy and one more pass.
      - name: the lens fires on a planted finding
        run: make tables-lua-luacheck-negative-control
