name: schema ruby nightly fuzz
on:
  schedule:
    - cron: '39 3 * * *'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
env:
  PGROUP_GO_TEST_TIMEOUT: '0'

jobs:
  nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [ self-hosted, Linux, X64, fleet, schema ]
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        seed: ['24845619678', '2']
        pin: [current, floor]
        arm: [plain, mixed, retain]
    defaults:
      run:
        shell: go run ./tools/pgroup -- bash -e -o pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pinned Ruby interpreters
        uses: ./.github/actions/ruby
      - name: Stage pinned siblings
        run: make serialize-siblings
      - name: Full-roster Ruby verdict pipe
        env:
          FUZZ_SEED: ${{ matrix.seed }}
          FUZZ_PIN: ${{ matrix.pin }}
          FUZZ_ARM: ${{ matrix.arm }}
        run: make "ruby-wirefuzz-${FUZZ_PIN}-${FUZZ_ARM}" "SEED=${FUZZ_SEED}" N=500000 RUBY_WIRE_FUZZ_DIR=build/ruby-wirefuzz-nightly
      - name: Preserve the row log and failing mutant
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ruby-wire-fuzz-${{ matrix.seed }}-${{ matrix.pin }}-${{ matrix.arm }}
          path: build/ruby-wirefuzz-nightly/
          if-no-files-found: ignore
          retention-days: 30
