name: Lobster single-read qualification
on:
  push:
    branches: [codex/schema-lobster-read-linux-check]
concurrency:
  group: lobster-single-read-qualification
  cancel-in-progress: true
permissions:
  contents: read
env:
  PRODUCT_REVISION: c655e64199c1ee739642a126ac5bfc60b93297f4
  SERIALIZE_TAG: v2.1.3
  SERIALIZE_GO_TAG: v2.1.1
  SCHEMA_SLOW: '1'
  SCHEMA_REQUIRE_CORPUS: '1'
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        lane: [reference]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PRODUCT_REVISION }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false
      - name: Verify exact source and install pinned dependencies
        run: |
          test "$(git rev-parse HEAD)" = "$PRODUCT_REVISION"
          git clone --quiet --depth 1 --branch "$SERIALIZE_TAG" https://github.com/mas-bandwidth/serialize.git ../serialize
          git clone --quiet --depth 1 --branch "$SERIALIZE_GO_TAG" https://github.com/mas-bandwidth/serialize.go.git ../serialize.go
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libopengl0 libglx0
          make dist-lobster
          echo "LOBSTER=$PWD/dist/lobster-v2026.8/bin/lobster" >> "$GITHUB_ENV"
          mkdir -p build/qualification
          git rev-parse HEAD > build/qualification/product-head.txt
      - name: Native package and compiler guards
        if: matrix.lane == 'native'
        run: |
          set -o pipefail
          make build/fixedform-corpus/.stamp
          go test ./internal/codegen/lobster/... ./internal/codegen/lobstertable/... -count=1 -timeout=15m -v 2>&1 | tee build/qualification/native.log
          go test ./compiler -run '^TestLobster' -count=1 -v 2>&1 | tee build/qualification/compiler.log
      - name: Shared protocol and reference packages
        if: matrix.lane == 'reference'
        run: |
          set -o pipefail
          go test ./internal/tablewire ./internal/tabletext ./internal/tablecook ./test/conformance/harness ./bench/corpus -count=1 -timeout=10m -v 2>&1 | tee build/qualification/reference.log
      - name: Complete Lobster matrix and planted controls
        if: matrix.lane == 'conformance'
        run: |
          set -o pipefail
          make build/conformance-harness build/conformance-lobster build/schema_test_cook
          printf 'lobster test/conformance/lobster/driver\n' > build/qualification/drivers.txt
          build/conformance-harness run --drivers build/qualification/drivers.txt --work build/qualification/matrix --results build/qualification/results.json 2>&1 | tee build/qualification/matrix.log
          for mode in walk framing report cycle; do
            sh test/conformance/lobster/negative-control "$mode" 2>&1 | tee "build/qualification/control-$mode.log"
          done
          make bench-lobster-gate bench-lobster-gate-negative-control 2>&1 | tee build/qualification/bench.log
          git diff --exit-code -- generated/bench/lobster generated/bench/tables/lobster
      - name: Preserve exact evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: strict-${{ matrix.lane }}-qualification
          path: build/qualification/
          retention-days: 14
