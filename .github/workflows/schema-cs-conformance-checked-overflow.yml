# schema-cs-conformance-checked-overflow: the C# checked-arithmetic lens.
#
# The lens is CheckForOverflowUnderflow (/checked+) over the generated C# and
# the serialize.cs runtime, run through the conformance corpus so an overflow
# bug becomes an OverflowException instead of a silent wrap. The gate is heavy
# (a full dotnet build plus a full conformance driver run), so it rides the
# nightly schedule and workflow_dispatch, not the per-push lane.

name: schema-cs-conformance-checked-overflow

env:
  SERIALIZE_CS_TAG: v1.9.1

on:
  schedule:
    - cron: '25 2 * * *'
  workflow_dispatch:

jobs:
  checked-overflow:
    name: C# conformance under checked arithmetic
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out the serialize.cs runtime (pinned release)
        run: |
          git clone --quiet --depth 1 --branch "$SERIALIZE_CS_TAG" https://github.com/mas-bandwidth/serialize.cs.git ../serialize.cs

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false

      - name: where this runner keeps the Go build cache
        shell: bash
        run: |
          echo "GO_BUILD_CACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"
          echo "GO_CACHE_ID=$(go env GOVERSION)-$(go env GOARCH)" >> "$GITHUB_ENV"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.GO_BUILD_CACHE }}
          key: go-build-${{ runner.os }}-${{ env.GO_CACHE_ID }}-${{ hashFiles('**/*.go', 'go.mod') }}
          restore-keys: go-build-${{ runner.os }}-${{ env.GO_CACHE_ID }}-

      - name: read the .NET SDK pin
        run: echo "DOTNET_SDK_PIN=$(cat .github/dotnet-version)" >> "$GITHUB_ENV"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_SDK_PIN }}

      - name: run the C# conformance gate under checked arithmetic
        run: |
          make tables-cs-checked-overflow-conformance
          make tables-cs-checked-overflow-negative-control
