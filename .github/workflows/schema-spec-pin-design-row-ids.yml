name: spec pins

# THE SPEC-PINS GUARD (docs/SPEC-TABLES.md, "Row ids and pins"): every normative
# sentence of the spec carries a row id, every row is pinned in every port that
# carries its feature or owed by name, and every pin resolves to a test that
# runs. Unit tier, seconds, so it rides every pull request that can move a row
# or a pinned test.

on:
  pull_request:
  workflow_dispatch:

jobs:
  spec-pins:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.base_ref == 'main') && '["self-hosted","studio"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false
      - name: the spec-pins guard
        # not a make target: make/*.mk is the language-leg registry (the
        # wide-scalar refusal gate runs `schema generate --lang` over every
        # make/<name>.mk), so a card's own .mk there reads as a tenth port
        run: go test -count=1 -timeout 600s -run '^TestSpecPins' -v ./internal/ci/
