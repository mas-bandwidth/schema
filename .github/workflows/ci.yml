name: CI

# The gate split (issue #133): pull requests run a FAST iteration gate;
# certification runs on every push to main, nightly, and on demand.
#
# What the split moves is WHEN the inline-budget gates run, not whether —
# nothing checks less. Measured basis (2026-08-25, runs 32826150095 /
# 32827197339): the full conformance run (`make test`) cost 31-45s — six
# languages when that was measured, nine today; the inline-budget gates
# cost ~9 of the ~10:30 wall minutes (go 2:44,
# cs 3:47, rust 1:16, cpp 0:36, c 0:32 on macOS; go 2:23 on ubuntu). So the
# PR leg KEEPS the entire conformance corpus — every construct class, every
# target, both OSes, the goldens, the fuzz seeds, the staleness check — and
# moves only the inline gates, which are certification instruments (they
# fire on compiler-version changes by design) rather than iteration ones.
# A cross-compiler inline regression a PR cannot see still fails loudly on
# main minutes after merge, and nightly re-certifies a quiet main.
#
# The `msvc` leg sits on the certification side for the same reason and by the
# same measurement (#286, #317): the job cost 2:27, 2:28 and 2:26 across three
# runs and 5:14 on a fourth, with byte-identical input — the longest job in the
# PR gate at its slow end, and a flake at any end. Its job comment carries the
# per-translation-unit numbers and where they come from.
#
# For a full run on a branch before merging (e.g. a change near the hot
# paths, or anything that moves the C++ emitters): gh workflow run ci.yml
# --ref <branch>. That is also the only way to exercise the msvc leg from a
# pull request, since it does not run on the pull_request event.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # a quiet main still gets certified daily (and govulncheck sees new CVEs)
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

# Superseded pushes to the same PR cancel each other; certification runs
# (main / nightly / dispatch) are NEVER cancelled — every main commit's
# full-matrix proof must run to completion. The event name is part of the
# group so a queued nightly and a queued push run can never displace each
# other (a group holds only one pending run).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The six runtimes the generated code targets, PINNED to each sibling's
# latest RELEASED tag, never main: a sibling merging to main mid-day must
# not change what a schema commit's CI proves — the sibling-HEAD race broke
# this gate three separate times (2026-08-16/17) with green schema commits
# going red on foreign pushes. One pin per sibling, exactly one place each
# (these lines), shared by every job that clones the siblings.
# To bump a pin: edit the *_TAG line to the new release tag — nothing else
# changes. Find the newest tag with:
#   gh release list --repo mas-bandwidth/<repo> --limit 1
env:
  SERIALIZE_TAG: v1.12.0
  SERIALIZE_C_TAG: v1.5.0
  SERIALIZE_GO_TAG: v1.14.0
  SERIALIZE_RS_TAG: v2.2.2
  SERIALIZE_CS_TAG: v1.5.0
  SERIALIZE_JS_TAG: v1.3.0

jobs:
  # The fast gate, and the conformance half of certification. `make test`
  # builds the corpus in all nine languages and compares their wire against
  # the C++-pinned goldens — that cross-language bit identity is the property
  # this project exists to provide, and CI is where it gets proven on
  # hardware we do not own. It runs on every trigger, PRs included, because
  # it is cheap (31-45s measured): the fast leg trims nothing from the
  # corpus.
  #
  # PRs run it on ubuntu ONLY (the one platform #133 budgeted): the shared
  # macOS pool is 5 runners wide and a certification run's gate fan-out
  # saturates it, so a PR macOS job pushed during those minutes queues behind
  # it and blows the 2-minute law (measured: 1:34 of queueing, 3:00 wall,
  # run 32830268855). The ubuntu pool is 20 wide. macOS conformance still
  # proves every main commit, minutes later, in this same job.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest","macos-latest"]') }}

    steps:
      - uses: actions/checkout@v7

      # Siblings cloned exactly where README.md tells a newcomer to put them —
      # CI exercises the documented path rather than a special one. The
      # Makefile's SERIALIZE* defaults already point here, and the generated
      # go.mod / Cargo.toml and the test/js* module-relative imports embed
      # relative paths that only resolve under this layout.
      - name: Check out the serialize runtimes (pinned releases)
        run: |
          cd ..
          git clone --quiet --depth 1 --branch "$SERIALIZE_TAG"    https://github.com/mas-bandwidth/serialize.git    serialize
          git clone --quiet --depth 1 --branch "$SERIALIZE_C_TAG"  https://github.com/mas-bandwidth/serialize.c.git  serialize.c
          git clone --quiet --depth 1 --branch "$SERIALIZE_GO_TAG" https://github.com/mas-bandwidth/serialize.go.git serialize.go
          git clone --quiet --depth 1 --branch "$SERIALIZE_RS_TAG" https://github.com/mas-bandwidth/serialize.rs.git serialize.rs
          git clone --quiet --depth 1 --branch "$SERIALIZE_CS_TAG" https://github.com/mas-bandwidth/serialize.cs.git serialize.cs
          git clone --quiet --depth 1 --branch "$SERIALIZE_JS_TAG" https://github.com/mas-bandwidth/serialize.js.git serialize.js

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0'

      # One node version, the runtime's floor (serialize.js engines >= 20):
      # the runtime's own CI carries the version matrix; this repo proves
      # wire identity, which does not vary by node version.
      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      # The Dart SDK, pinned to the same version the Makefile documents for
      # the repo-local dist/ (generated Dart is self-contained — the SDK is
      # the only Dart dependency, so there is no serialize.dart clone above).
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.2'

      # The JDK, same major as the Makefile's dist/ pin (generated Java is
      # self-contained — the JDK is the only Java dependency, so there is no
      # serialize.java clone above).
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      # The BEAM toolchain, same versions as the Makefile's dist/ pins
      # (generated Elixir is self-contained — Erlang/OTP + Elixir are the
      # only dependencies, so there is no serialize.elixir clone above).
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29.0.5'
          elixir-version: '1.20.4'

      # vet rides in the test job on both OSes: an emitter codebase built
      # almost entirely out of format strings is exactly where printf-verb
      # mismatches live (issue #31).
      - name: go vet
        run: go vet ./...

      # No SERIALIZE* overrides: the Makefile defaults already point at the
      # sibling layout cloned above. RUSTUP_BIN defaults to a homebrew keg on
      # the author's machine; on CI cargo is on PATH, so point it somewhere
      # harmless. DART, JAVA/JAVAC and ELIXIR/MIX likewise default to the
      # repo-local dist/ toolchains; on CI setup-dart, setup-java and
      # setup-beam put the pinned versions on PATH.
      - name: make test
        run: make test RUSTUP_BIN=/usr/bin DART=dart JAVA=java JAVAC=javac ELIXIR=elixir MIX=mix

      # The committed generated/ tree is what this repo treats as ground
      # truth — findings are receipted against its line numbers. `make test`
      # above regenerated every tracked file IN PLACE, so staleness is
      # precisely a dirty tree here: a tracked file that changed, or a newly
      # emitted file nobody committed (which a diff-only check would miss).
      # Locally: `make generated-current`.
      - name: generated tree is current
        run: |
          git diff --exit-code generated/ || {
            echo "::error::committed generated/ tree is stale — the current compiler emits different text. Run 'make test' (or ./bin/schema generate --lang <lang> --out generated/<dir> <corpus>) and commit the regenerated files."
            exit 1
          }
          untracked=$(git status --porcelain generated/)
          if [ -n "$untracked" ]; then
            echo "$untracked"
            echo "::error::the generator emitted files that are not committed under generated/ — add them."
            exit 1
          fi

      # Seeded corpus only — a short, bounded run that re-executes every
      # crasher ever found and checks the compiler still refuses bad input
      # cleanly. The long fuzzing campaigns run by hand, not on every push.
      - name: fuzz seeds
        run: go test ./internal/fuzz/

  # DOGFOOD BIG-ENDIAN (issue #303). SPEC-TABLES.md §3 says the wire is
  # little-endian and byte-oriented throughout; §7 says a cook is produced in
  # the byte order of the build it is cooked for, and that Open refuses any
  # other. Every host this repo has built on is little-endian, so both rules
  # were assertions on a page: a generated codec that reached for HOST order
  # anywhere would have passed every other leg in this file, and the goldens
  # would have said nothing.
  #
  # This leg builds the tables battery for s390x — big-endian, and the target
  # both qemu-user and the Ubuntu gcc cross packages support best — and runs it
  # under emulation, plus a cross-endian cook pair the host and the target hand
  # to each other. Its negative control puts one byte-order-neutral store back
  # to a host-order copy and proves the leg goes red on the target while
  # staying green here, which is the whole argument for having it.
  #
  # It runs on PRs: it is an iteration gate, not a certification one — it
  # answers a question about the code in the diff, not about the compiler that
  # built it — and it fits the budget.
  #
  # THE PINS. The runner image is named rather than `-latest`, because package
  # versions are only meaningful against one archive; the cross compiler and
  # the emulator are then installed by EXACT version, so this leg proves the
  # same thing next month as today. Bumping either is a deliberate one-line
  # edit, the same act as the golangci-lint pin below, and the versions come
  # from the policy the failing install prints. The step after the install
  # records the resolved closure both pins pull in.
  big-endian:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false

      - name: the pinned cross toolchain and emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-13-s390x-linux-gnu=13.3.0-6ubuntu2~24.04.1cross1 \
            qemu-user=1:8.2.2+ds-0ubuntu1.18

      - name: what the pins resolved to
        run: |
          s390x-linux-gnu-g++-13 --version | head -1
          qemu-s390x --version | head -1
          dpkg-query -W -f='${Package} ${Version}\n' | grep -E 's390x|^qemu-user'

      # The battery on the target, then the control that proves it can fail.
      # BE_CXX names the pinned compiler: the exact-version package installs
      # the SUFFIXED driver, and the Makefile's unsuffixed default is for a
      # workstation that installed the metapackage.
      - name: the big-endian leg, and its negative control
        run: make tables-big-endian-negative BE_CXX=s390x-linux-gnu-g++-13

  # The per-port inline-budget gate (issue #25; BENCH-STANDARD.md §4.3),
  # fanned out one leg per job so the legs run concurrently instead of
  # serially (they were ~9 minutes end to end in one job; the longest single
  # leg is ~4). Certification triggers only — these are certification
  # instruments, not iteration ones (the gate fires on compiler-version
  # changes by design, issue #25), so PRs skip them and main / nightly /
  # dispatch prove them minutes later.
  #
  # Every runtime's throughput depends on the serialize chain inlining end
  # to end, and until this gate nothing warned when it stopped. The
  # adversarial selftest runs FIRST and in EVERY leg job: the verdict
  # machinery must prove it CAN fail (out-of-line -> partial, cold never
  # counted hot, the 4dc9b62 namespace-join false-full caught) before that
  # leg's green is trusted. Each leg builds its own artifacts (one untimed
  # bench round), re-derives the §4.2 verdict from the current tree, and
  # fails the job if any hot-path partial:N exceeds bench/inline-budget.txt.
  # The go leg's remark scan runs under `go build -a` and REFUSES if it
  # prints nothing — without -a the build cache reads as a false clean bill
  # of health (§4.1).
  #
  # The go leg gates on BOTH OSes; the c/cpp/rust verdict passes are
  # otool/arm64-shaped (§4.1), so on linux inline-verdict.sh refuses
  # honestly rather than faking a full — those legs, and the JitDisasm-shaped
  # cs leg, gate on the macOS runner only. There is no js leg on purpose:
  # every verdict pass is ahead-of-time disassembly, and a JIT has no
  # build-time artifact to gate — faking one would be a green light that
  # proves nothing.
  # No explicit name: the default gives "inline-gate (os, leg)" per matrix
  # combination when it runs, and a clean single "inline-gate" placeholder on
  # PR runs — an expression name would show up raw there, because a skipped
  # job's matrix is never expanded.
  inline-gate:
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, leg: go }
          - { os: macos-latest,  leg: go }
          - { os: macos-latest,  leg: cpp }
          - { os: macos-latest,  leg: c }
          - { os: macos-latest,  leg: rust }
          - { os: macos-latest,  leg: cs }

    steps:
      - uses: actions/checkout@v7

      - name: Check out the serialize runtimes (pinned releases)
        run: |
          cd ..
          git clone --quiet --depth 1 --branch "$SERIALIZE_TAG"    https://github.com/mas-bandwidth/serialize.git    serialize
          git clone --quiet --depth 1 --branch "$SERIALIZE_C_TAG"  https://github.com/mas-bandwidth/serialize.c.git  serialize.c
          git clone --quiet --depth 1 --branch "$SERIALIZE_GO_TAG" https://github.com/mas-bandwidth/serialize.go.git serialize.go
          git clone --quiet --depth 1 --branch "$SERIALIZE_RS_TAG" https://github.com/mas-bandwidth/serialize.rs.git serialize.rs
          git clone --quiet --depth 1 --branch "$SERIALIZE_CS_TAG" https://github.com/mas-bandwidth/serialize.cs.git serialize.cs
          git clone --quiet --depth 1 --branch "$SERIALIZE_JS_TAG" https://github.com/mas-bandwidth/serialize.js.git serialize.js

      # All the toolchains regardless of leg: the `make test` precondition
      # step below builds the whole tree (nine languages), exactly as the
      # single-job flow did before the fan-out — the gate legs verdict the
      # same artifacts they always have.
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0'

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.2'

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29.0.5'
          elixir-version: '1.20.4'

      # The same preconditions the gates had when they ran after `make test`
      # in one job: bin/schema, the generated trees, and the bench units all
      # built (31-45s measured — cheap enough to repeat per leg rather than
      # invent a narrower target with different semantics).
      - name: make test
        run: make test RUSTUP_BIN=/usr/bin DART=dart JAVA=java JAVAC=javac ELIXIR=elixir MIX=mix

      - name: inline gate — adversarial selftest
        run: bench/tools/inline-gate.sh selftest

      - name: inline gate — ${{ matrix.leg }} leg
        run: bench/tools/inline-gate.sh leg ${{ matrix.leg }}

  # Self-contained Go lint job; .golangci.yml carries the config.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # PINNED to the module's own Go version, and it moves WITH the
      # golangci-lint pin below. golangci-lint links a copy of the Go
      # typechecker, so a linter release can only typecheck the toolchains
      # that existed when it shipped: `stable` + a pinned linter is a pairing
      # that goes red on its own, with no commit, the day Go releases.
      # Bumping the linter is a two-line, deliberate act: this version and
      # that one, together.
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "$out"
            echo "::error::gofmt differs — run gofmt -w on the files above"
            exit 1
          fi
      - name: go mod tidy
        run: go mod tidy -diff
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # pinned so releases with new checks break CI deliberately, not
          # randomly; bump by hand
          version: v2.12.2
      - name: modernize
        run: go run golang.org/x/tools/gopls/internal/analysis/modernize/cmd/modernize@latest ./...
      - name: bench scripts parse
        run: bash -n bench/run.sh
      - name: absolute ledger — the cpp curve holds or goes red
        run: go run ./bench/tools ledger --check > /dev/null
      - name: render smoke — the headline table renders from a committed CSV
        run: |
          # newest committed sweep: older CSVs predate the round_trip contract
          # and the render REFUSES them by design (#175)
          csv=$(ls bench/results/*.csv | tail -1)
          out=$(./bench/run.sh --render "$csv" 2>&1)
          echo "$out"
          echo "$out" | grep -q "language        %" || { echo "::error::render printed no table header"; exit 1; }
          rows=$(echo "$out" | grep -cE "^  (c|cpp|go|rust|cs|js|java|dart|elixir) ")
          [ "$rows" -ge 1 ] || { echo "::error::render printed zero language rows"; exit 1; }

  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # The compiler that generates C++ for a Windows-targeting game engine, run on
  # Windows: vet + build, cheap enough to ride every pull request. What it
  # EMITS is compiled with cl by the `msvc` job below, which runs on the
  # certification side.
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - run: go vet ./...
      - run: go build ./...

  # MSVC over the generated corpus (issue #286). The estate's standing rule is
  # that Visual C++ is a hard requirement — emulate extensions, never require
  # them — and until this job existed nothing in this file compiled a single
  # line of what the compiler EMITS with cl. The `windows` job above proves the
  # COMPILER runs on Windows; this one proves its OUTPUT builds there.
  #
  # A CERTIFICATION INSTRUMENT, NOT AN ITERATION ONE — same condition and same
  # reasoning as the inline-budget gates above, and it is a measurement rather
  # than a preference. Whole job, four runs: 2:27, 2:28, 2:26 — and one at
  # 5:14, on input BYTE-IDENTICAL to a 2:27. One run in four at 2.1x the
  # median is a flake in the PR gate, which is worse than a slow job, and at
  # 5:14 it was also the longest job in that gate. On push-to-main it costs
  # nothing anybody waits for, and a Windows regression fails loudly minutes
  # after merge.
  #
  # WHERE THE TIME GOES, per translation unit (runs 33640076155 / 33641197840,
  # and the reason this job compiles one TU at a time): the `block` unit is
  # 80.7 s of an 89.7 s corpus, spread almost evenly across its FOUR
  # translation units — 23.0 / 19.1 / 19.2 / 19.2 s, and 22.0 / 19.4 / 19.4 /
  # 19.3 s on the second run. It is not one pathological function, and the
  # per-TU cost reproduces to within a second: the 5:14 outlier was the whole
  # runner being slow, not this. Every one of those four includes
  # RenderTable.h — PaddedTable.h and RenderBlock.h include it directly,
  # PaddedBlock.h through PaddedTable.h — and that header defines
  # blockdemo::RenderFrame, a 7 879 320-byte aggregate. cl charges ~20 s per
  # translation unit for having that type in scope; clang compiles the same
  # four in 0.18, 0.14, 0.13 and 0.15 s. Roughly 130x, uniform.
  #
  # So moving this leg back into the PR gate is a question about what cl does
  # with a multi-megabyte aggregate, not about this file.
  #
  # THE PIN. The image is NAMED rather than `-latest`, the argument the
  # big-endian leg makes: which extensions cl accepts is exactly a
  # toolchain-version fact, so the image it comes from has to be a decision
  # rather than whatever `-latest` moved to overnight. windows-2025 carries
  # Visual Studio 2026 (cl 19.51.x); the compile step prints what the pin
  # actually resolved to on the day.
  #
  # THE CORPUS is the tables corpus plus every packet header emitted beside it,
  # not `make test` — `make test` needs the six sibling runtime clones, the
  # three self-contained targets' toolchains and a POSIX toolchain. This job
  # needs one sibling (serialize, header-only, and only the packet headers
  # include it) and cl.
  #
  # THE TIMING IS PART OF THE OUTPUT. One cl invocation per translation unit,
  # each preceded by a clock line, so the log shows where the cost is and how
  # far it swings between runs. That is what turned #316's "the corpus does not
  # compile" into two named emitter defects, and it is what any future argument
  # about this job's cost will be settled with. It is also why /MP is absent:
  # parallel TUs are faster and unmeasurable, and here the measurement is worth
  # more than the minute.
  msvc:
    if: github.event_name != 'pull_request'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      # The one sibling this leg needs, at the same pin every other job uses.
      # Header-only, and only the PACKET headers (<Base>.h / <Base>Wire.h)
      # reach for it — a table header includes nothing of it.
      - name: Check out the serialize runtime (pinned release)
        shell: bash
        run: git clone --quiet --depth 1 --branch "$SERIALIZE_TAG" https://github.com/mas-bandwidth/serialize.git ../serialize

      # Generation and script emission happen in bash because they are readable
      # there; the cl steps stay short. The corpus list mirrors the Makefile's
      # tables_generate macro and cannot reuse it — the runner image carries no
      # make, and installing one to share ten lines would cost more than the
      # ten lines.
      - name: Generate the corpus and the cl scripts
        shell: bash
        run: |
          set -e
          go build -o bin/schema.exe ./cmd/schema
          rm -rf build/msvc build/msvc-negative build/msvc-obj
          mkdir -p build/msvc
          while read -r out src; do
            ./bin/schema.exe generate --lang cpp --out "build/msvc/$out" "$src"
          done <<'UNITS'
          examples tables/examples
          pointers tables/pointers
          block tables/block
          blockhome tables/blockhome
          v1 test/tables/V1.schema
          v2 test/tables/V2.schema
          p1 test/tables/P1.schema
          p2 test/tables/P2.schema
          p3 test/tables/P3.schema
          jsonkeys test/tables/JsonKeys.schema
          UNITS

          # Every unit gets an _AllHeaders.cpp, because compiling only the
          # emitted .cpp files would leave two classes of header unbuilt: the
          # packet headers have no .cpp of their own, and a unit whose tables
          # are ALL variable-length emits no .cpp at all (test/tables/P2.schema
          # is that unit). A header that HAS a .cpp is left out of it — it is
          # already a translation unit, and on the block unit compiling it
          # twice costs more than the whole rest of the corpus.
          for d in build/msvc/*/; do
            u=$(basename "$d")
            : > "$d/_AllHeaders.cpp"
            for h in "$d"*.h; do
              b=$(basename "$h" .h)
              [ -f "$d$b.cpp" ] && continue
              echo "#include \"$b.h\"" >> "$d/_AllHeaders.cpp"
            done
            echo "int schema_msvc_all_$u = 0;" >> "$d/_AllHeaders.cpp"
          done

          # vcvars, once, for both cl steps to call: a step's environment does
          # not survive into the next one.
          {
            echo "@echo off"
            echo "for /f \"usebackq tokens=*\" %%i in (\`\"%ProgramFiles(x86)%\\Microsoft Visual Studio\\Installer\\vswhere.exe\" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath\`) do set \"VSPATH=%%i\""
            echo "call \"%VSPATH%\\VC\\Auxiliary\\Build\\vcvars64.bat\""
          } > build/msvc/vc.cmd

          # One cl per translation unit, each with a clock line in front of it.
          # /Itest\tables for the same reason the Makefile's tables legs carry
          # -Itest/tables: a `cpp_native` type names its own header through
          # `cpp_include`, and tables/pointers' Colour names one that lives
          # with the tests.
          {
            echo "@echo off"
            for d in build/msvc/*/; do
              u=$(basename "$d")
              echo "mkdir build\\msvc-obj\\$u"
              for f in "$d"*.cpp; do
                n=$(basename "$f")
                echo "echo [%TIME%] $u/$n"
                echo "cl /nologo /c /W4 /WX /std:c++17 /permissive- /EHsc /Ibuild\\msvc\\$u /Itest\\tables /I..\\serialize /Fobuild\\msvc-obj\\$u\\ build\\msvc\\$u\\$n || exit /b 1"
              done
            done
            echo "echo [%TIME%] corpus done"
          } > build/msvc/compile.cmd

          # THE NEGATIVE CONTROL. A GNU statement expression — gcc and clang
          # take it under -Wall -Wextra -Werror without a word, cl cannot parse
          # it — planted in one generated header of a copied tree. The green
          # above proves nothing unless this goes red.
          cp -r build/msvc/examples build/msvc-negative
          rm -f build/msvc-negative/_AllHeaders.cpp
          printf '\nnamespace tabledemo { inline int schema_msvc_negative_control() { return ({ 1; }); } }\n' >> build/msvc-negative/GuardedTable.h
          {
            echo "@echo off"
            echo "mkdir build\\msvc-obj\\negative"
            echo "cl /nologo /c /W4 /WX /std:c++17 /permissive- /EHsc /Ibuild\\msvc-negative /Fobuild\\msvc-obj\\negative\\ build\\msvc-negative\\GuardedTable.cpp"
          } > build/msvc/negative.cmd

      - name: cl /W4 /WX over the generated corpus, one translation unit at a time
        shell: cmd
        run: |
          call build\msvc\vc.cmd || exit /b 1
          echo ---- what the windows-2025 pin resolved to ----
          cl 2>&1 | findstr /C:"Version"
          echo ---- the corpus, one cl per translation unit ----
          call build\msvc\compile.cmd || exit /b 1

      # ---- TEMPORARY (#320): what a CONSUMER of the fixed table pays ----
      - name: probe — build the consumer variants
        shell: bash
        run: |
          set -e
          rm -rf build/probe
          mk() {
            mkdir -p "build/probe/$1"
            cp build/msvc/block/Render.h build/msvc/block/RenderTable.h "build/probe/$1/"
            { printf '#include "RenderTable.h"\n'; printf '%s\n' "$2"; } > "build/probe/$1/Probe.cpp"
          }
          mk k_include   'int probe_include = 0;'
          mk k_decl      'int probe_decl() { blockdemo::RenderFrame f; return (int) f.version; }'
          mk k_valueinit 'int probe_valueinit() { blockdemo::RenderFrame f{}; return (int) f.version; }'
          mk k_reset     'void probe_reset( void * p ) { blockdemo::RenderFrameReset( *(blockdemo::RenderFrame *) p ); }'
          {
            echo "@echo off"
            echo "mkdir build\\probe-obj"
            for d in build/probe/*/; do
              n=$(basename "$d")
              echo "echo [%TIME%] probe $n"
              echo "cl /nologo /c /W4 /std:c++17 /permissive- /EHsc /Ibuild\\probe\\$n /Fobuild\\probe-obj\\$n.obj build\\probe\\$n\\Probe.cpp || exit /b 1"
            done
            echo "echo [%TIME%] probes done"
          } > build/probe/probe.cmd

      - name: probe — cl over the consumer variants, one at a time
        shell: cmd
        run: |
          call build\msvc\vc.cmd || exit /b 1
          call build\probe\probe.cmd || exit /b 1
          echo ---- /Bt+ front end vs back end, the bare include ----
          cl /nologo /c /W4 /std:c++17 /permissive- /EHsc /Bt+ /Ibuild\probe\k_include /Fobuild\probe-obj\bt0.obj build\probe\k_include\Probe.cpp
          echo ---- /Bt+ front end vs back end, a declared RenderFrame ----
          cl /nologo /c /W4 /std:c++17 /permissive- /EHsc /Bt+ /Ibuild\probe\k_decl /Fobuild\probe-obj\bt1.obj build\probe\k_decl\Probe.cpp

      # Its own step, and it ASSERTS the failure: a control that is merely run
      # proves nothing. The planted extension must make cl refuse, and if cl
      # accepts it the step goes red saying exactly why that matters.
      - name: negative control — cl must REFUSE a GNU extension in a generated header
        shell: cmd
        run: |
          call build\msvc\vc.cmd || exit /b 1
          call build\msvc\negative.cmd && (echo ::error::NEGATIVE CONTROL FAILED: cl accepted a GNU statement expression in a generated header, so this leg cannot catch the class it exists for & exit /b 1)
          echo negative control red as required: cl refused the planted extension
          rem the control's FAILURE is this step's success, and echo does not
          rem clear ERRORLEVEL — without this the step inherits the exit code of
          rem the compile that was SUPPOSED to fail
          exit /b 0

  # The one-benchmark rule, made mechanical. The estate has exactly one
  # sanctioned benchmark — this repo's data-driven bench — and shape knowledge
  # belongs in bench/corpus and the generated code. This job refuses a commit
  # that hand-codes measurement of a schema shape anywhere else. Every current
  # exception is named in bench/SHAPE-GATE.allow with an exact count that can
  # only shrink. Runs on push AND pull_request: unlike the cpp-lock this is a
  # standing property of the tree, not a review-window freeze.
  shape-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: false
      - name: refuse hand-coded shape measurement
        run: go run ./bench/tools/shapegate

  # The C/C++ reference lock (owner ruling 2026-08-31, issue #170): while
  # bench/LOCK exists, a PR touching any locked prefix refuses. The lift is
  # a PR whose whole diff is bench/LOCK itself — visible by construction.
  cpp-lock:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: refuse locked-path changes
        run: |
          [ -f bench/LOCK ] || { echo "no bench/LOCK — guard inactive"; exit 0; }
          base="origin/${{ github.base_ref }}"
          changed="$(git diff --name-only "$base"...HEAD)"
          echo "changed files vs $base:"; echo "$changed"
          if [ "$changed" = "bench/LOCK" ]; then
            echo "diff touches only bench/LOCK — the lift act, allowed"; exit 0
          fi
          prefixes="$(grep -v '^#' bench/LOCK | grep -v '^[[:space:]]*$' || true)"
          if [ -z "$prefixes" ]; then
            echo "bench/LOCK carries no active prefixes (a carve window) — guard inactive"; exit 0
          fi
          violations=""
          while IFS= read -r f; do
            while IFS= read -r p; do
              case "$f" in "$p"*) violations="$violations$f (locked: $p)"$'\n';; esac
            done <<< "$prefixes"
          done <<< "$changed"
          if [ -n "$violations" ]; then
            echo "C/C++ LOCK REFUSAL — these paths are frozen while bench/LOCK stands (issue #170):"
            printf '%s' "$violations"
            exit 1
          fi
          echo "no locked paths touched — clean"
