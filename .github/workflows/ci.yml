name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]

    steps:
      - uses: actions/checkout@v4

      # The five runtimes the generated code targets. `make test` builds the
      # corpus in all five languages and compares their wire against the
      # C++-pinned goldens, so every one of them has to be present — that
      # cross-language bit identity is the property this project exists to
      # provide, and CI is where it gets proven on hardware we do not own.
      # Cloned as SIBLINGS of this repo, which is exactly what README.md tells a
      # newcomer to do — so CI exercises the documented path rather than a
      # special one. The Makefile's SERIALIZE* defaults already point here, and
      # the generated go.mod / Cargo.toml embed relative paths that only
      # resolve under this layout.
      - name: Check out the serialize runtimes
        run: |
          cd ..
          git clone --quiet --depth 1 https://github.com/mas-bandwidth/serialize.git    serialize
          git clone --quiet --depth 1 https://github.com/mas-bandwidth/serialize.c.git  serialize.c
          git clone --quiet --depth 1 https://github.com/mas-bandwidth/serialize.go.git serialize.go
          git clone --quiet --depth 1 https://github.com/mas-bandwidth/serialize.rs.git serialize.rs
          git clone --quiet --depth 1 https://github.com/mas-bandwidth/serialize.cs.git serialize.cs

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0'

      # No SERIALIZE* overrides: the Makefile defaults already point at the
      # sibling layout cloned above. RUSTUP_BIN defaults to a homebrew keg on
      # the author's machine; on CI cargo is on PATH, so point it somewhere
      # harmless.
      - name: make test
        run: make test RUSTUP_BIN=/usr/bin

      # Seeded corpus only — a short, bounded run that re-executes every
      # crasher ever found and checks the compiler still refuses bad input
      # cleanly. The long fuzzing campaigns run by hand, not on every push.
      - name: fuzz seeds
        run: go test ./internal/fuzz/
