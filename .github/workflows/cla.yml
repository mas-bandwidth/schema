# Contributor Assignment Agreement gate.
#
# Holds a pull request until its author has signed the CAA, by posting this
# exact sentence, on its own, as a comment on their pull request:
#
#   I have read the CAA and I hereby sign it, assigning copyright in my
#   contributions to Más Bandwidth LLC.
#
# The agreement, the workflow and the signature ledger all live in
# mas-bandwidth/.github. The ledger is signatures/caa.json on its
# cla-signatures branch, one entry per person, so a contributor signs once and
# it counts in every repository. Branch protection watches the commit status
# named `caa`, which the workflow sets on every run.
#
# CAA_LEDGER_TOKEN is an organization secret. It may write the contents of
# mas-bandwidth/.github and nothing else. Everything else this gate does runs on
# the GITHUB_TOKEN below.

name: Contributor Assignment Agreement

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  caa:
    uses: mas-bandwidth/.github/.github/workflows/caa.yml@6a7011c8e9f5952ce16a5e261336b7ac67736379 # mas-bandwidth/.github#2 head
    secrets:
      CAA_LEDGER_TOKEN: ${{ secrets.CAA_LEDGER_TOKEN }}
