name: schema-unity-runs-hostile-corpus

# THE C# PORT RUNS THE SHARED HOSTILE CORPUS (docs/HOSTILE-CORPUS.md).
# The fast part runs on every push and pull request: generate the C# units the
# manifest names, build the runner with the pinned .NET SDK, and check every
# input's verdict against the committed oracle, each case in a pooled worker
# process so a stack overflow or a hang fails only its own case. The
# planted-verdict control flips one passing accepted and one passing refused
# verdict in a scratch copy of the corpus and requires the runner to go red
# naming both; it runs on schedule and workflow_dispatch because it certifies
# the gate has a blade rather than the corpus's content.

# NIGHTLY RUNS HAVE NO TIMEOUT (the owner, 2026-11-16: "Nightly runs don't
# have a timeout... they can run as long as they need."). No job or step in
# this file carries timeout-minutes, and PGROUP_GO_TEST_TIMEOUT: '0' below has
# tools/pgroup give every go test under a step -timeout=0 in place of the one
# it names, so a slow row finishes and reports every test. GitHub's default
# 360-minute job limit is the only backstop, and a job it stops reads
# cancelled, never green. internal/ci/nightly_test.go holds the rule.

on:
  # NIGHTLY AND DISPATCH ONLY (the owner, 2026-11-15: "I want everything that is not light moved to
  # nightly test now." "no exceptions."). A push or pull request runs only the fast lane, ci-fast.yml.
  schedule:
    - cron: "49 3 * * *"
  workflow_dispatch:

env:
  # the nightly rule in the header: no go test -timeout under tools/pgroup
  PGROUP_GO_TEST_TIMEOUT: '0'
  GOFLAGS: -mod=readonly
  NOVA_TEST_NO_HOST: '1'
  SERIALIZE_CS_TAG: v2.2.1

jobs:
  corpus:
    # Fleet only: a fork pull request has no fleet runner and is skipped before
    # it can reach one.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, schema]
    defaults:
      run:
        shell: go run ./tools/pgroup -- bash -e -o pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out the serialize.cs runtime (pinned release)
        run: |
          rm -rf "$RUNNER_TEMP/serialize.cs"
          git clone --quiet --depth 1 --branch "$SERIALIZE_CS_TAG" https://github.com/mas-bandwidth/serialize.cs.git "$RUNNER_TEMP/serialize.cs"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          # no Actions cache: the fleet runner keeps its own warm Go cache
          cache: false
      - name: read the .NET SDK pin
        run: |
          echo "DOTNET_SDK_PIN=$(cat .github/dotnet-version)" >> "$GITHUB_ENV"
          # CLI first-use sentinels belong to this job, not the shared SDK home.
          mkdir -p "$RUNNER_TEMP/schema-unity-dotnet-home"
          echo "DOTNET_CLI_HOME=$RUNNER_TEMP/schema-unity-dotnet-home" >> "$GITHUB_ENV"
      # the fleet runner cannot write /usr/share/dotnet; the SDK installs
      # into the runner's own tool cache
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: ${{ env.DOTNET_SDK_PIN }}
      - name: the corpus gate
        run: make schema-unity-runs-hostile-corpus SERIALIZE_CS="$RUNNER_TEMP/serialize.cs"

  negative-control:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, x64, schema]
    defaults:
      run:
        shell: go run ./tools/pgroup -- bash -e -o pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out the serialize.cs runtime (pinned release)
        run: |
          rm -rf "$RUNNER_TEMP/serialize.cs"
          git clone --quiet --depth 1 --branch "$SERIALIZE_CS_TAG" https://github.com/mas-bandwidth/serialize.cs.git "$RUNNER_TEMP/serialize.cs"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          # no Actions cache: the fleet runner keeps its own warm Go cache
          cache: false
      - name: read the .NET SDK pin
        run: |
          echo "DOTNET_SDK_PIN=$(cat .github/dotnet-version)" >> "$GITHUB_ENV"
          # CLI first-use sentinels belong to this job, not the shared SDK home.
          mkdir -p "$RUNNER_TEMP/schema-unity-dotnet-home"
          echo "DOTNET_CLI_HOME=$RUNNER_TEMP/schema-unity-dotnet-home" >> "$GITHUB_ENV"
      # the fleet runner cannot write /usr/share/dotnet; the SDK installs
      # into the runner's own tool cache
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: ${{ env.DOTNET_SDK_PIN }}
      - name: the planted-verdict control
        run: make schema-unity-runs-hostile-corpus-negative-control SERIALIZE_CS="$RUNNER_TEMP/serialize.cs"
