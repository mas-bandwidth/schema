name: schema-rust-generated-clippy-miri-gate

# THE RUST CLIPPY AND MIRI GATE (lens: schema-per-language-lenses, Glenn
# 2026-10-18). Every language's strictest checker, run over the generated
# output for the schema repository's test-schema corpus, is a separate lens on
# bugs. THIS card's lens is the Rust port: clippy -D warnings (pedantic, with
# justified allows) over the generated runtime and units, Miri (undefined
# behaviour) over the generated unit tests, forbid(unsafe_code) where a unit
# needs no unsafe, and overflow-checks = true in release over the generated
# Rust output.
#
# THE FAST HALF (clippy, the small recursive compile) runs on every push and
# pull request; THE HEAVY HALF (Miri, a nightly interpreter) runs on schedule
# and workflow_dispatch only, because a Miri run is minutes and would blow the
# push budget.
#
# EACH JOB OPENS WITH A TOOL PROBE. The fleet installs these toolchains
# through its ansible play (rowan-tools/fleet); a machine that is missing one
# must FAIL BY NAME on the probe, never pass by skipping. That is the card's
# gate-with-a-blade rule: a gate that passes while its toolchain is missing is
# a gate with no blade.
#
# The clippy job needs the sibling Rust serialize runtime checkout at the pin
# this repository's other Rust legs use (SERIALIZE_RS_TAG), because the
# generated corpus crates depend on it.

on:
  push:
    branches: [ sprint/schema-rust ]
  pull_request:
    branches: [ sprint/schema-rust ]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: schema-rust-generated-clippy-miri-gate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SERIALIZE_RS_TAG: v2.4.0

jobs:
  clippy-gate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: the rust toolchain and the clippy component
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # the stable BRANCH head — the SHA freezes the action, not the compiler: rustup resolves stable at run time
        with:
          components: clippy

      - name: Check out the Rust serialize sibling runtime (pinned release)
        run: |
          set -euo pipefail
          cd ..
          rm -rf serialize.rs
          git clone --quiet --depth 1 --branch "$SERIALIZE_RS_TAG" \
            https://github.com/mas-bandwidth/serialize.rs.git serialize.rs

      - name: clippy component probe
        run: |
          cargo clippy --version || {
            echo "::error::tool missing: cargo-clippy on $(hostname) — the Rust clippy gate cannot run"
            exit 1
          }

      - name: clippy -D warnings (pedantic) over the generated runtime and units
        run: |
          set -euo pipefail
          # the generated corpus crates come from the existing tables-rust
          # stamp; refuse loudly when they are absent rather than pass on nothing
          [ -d build/tables-generated-rust ] || {
            echo "::error::the generated Rust corpus is missing — run make tables-rust-generate (or make test) first"
            exit 1
          }
          for unit in build/tables-generated-rust/*/; do
            [ -f "$unit/Cargo.toml" ] || continue
            cargo clippy --quiet --manifest-path "$unit/Cargo.toml" --all-targets -- -D warnings -W pedantic
          done

  miri-gate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: the nightly toolchain and Miri (heavy, so nightly-only)
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # the nightly BRANCH head — the SHA freezes the action, not the compiler: rustup resolves nightly at run time
        with:
          toolchain: nightly
          components: miri

      - name: Check out the Rust serialize sibling runtime (pinned release)
        run: |
          set -euo pipefail
          cd ..
          rm -rf serialize.rs
          git clone --quiet --depth 1 --branch "$SERIALIZE_RS_TAG" \
            https://github.com/mas-bandwidth/serialize.rs.git serialize.rs

      - name: Miri component probe
        run: |
          cargo +nightly miri --version || {
            echo "::error::tool missing: cargo-miri (nightly) on $(hostname) — the Rust Miri gate cannot run"
            exit 1
          }

      - name: Miri over the generated runtime and units tests
        run: |
          set -euo pipefail
          # the smallest test set that still covers every reader kind — the
          # generated corpus crates tests
          [ -d build/tables-generated-rust ] || {
            echo "::error::the generated Rust corpus is missing — run make tables-rust-generate (or make test) first"
            exit 1
          }
          for unit in build/tables-generated-rust/*/; do
            [ -f "$unit/Cargo.toml" ] || continue
            cargo +nightly miri test --manifest-path "$unit/Cargo.toml"
          done
