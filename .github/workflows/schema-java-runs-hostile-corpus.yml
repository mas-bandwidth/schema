name: schema-java-runs-hostile-corpus

# THE JAVA PORT RUNS THE SHARED HOSTILE CORPUS (docs/HOSTILE-CORPUS.md).
# The fast part runs on every push and pull request: generate the Java units
# the manifest names, compile them with the pinned JDK, and check every input's
# verdict against the committed oracle. The planted-bad-pattern control changes
# the generated text reader in a scratch copy and requires the runner to go red;
# it runs on schedule and workflow_dispatch because it certifies the gate has a
# blade rather than the corpus's content.

on:
  push:
    branches: [ main, dev, fixed-table-form, 'sprint/**' ]
  pull_request:
    branches: [ main, dev, fixed-table-form, 'sprint/**' ]
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

env:
  GOFLAGS: -mod=readonly
  NOVA_TEST_NO_HOST: '1'

jobs:
  corpus:
    # Fleet only: a fork pull request has no fleet runner and is skipped before
    # it can reach one.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, schema]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # no Actions cache: the post step uploaded a 4.9 GB module and build
          # cache at 3.5 MB/s and ran the corpus job past its timeout; the fleet
          # runner keeps its own warm Go cache
          cache: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: the corpus gate
        run: make schema-java-runs-hostile-corpus JAVA=java JAVAC=javac

  negative-control:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, x64, schema]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # no Actions cache: the post step uploaded a 4.9 GB module and build
          # cache at 3.5 MB/s and ran the corpus job past its timeout; the fleet
          # runner keeps its own warm Go cache
          cache: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: the planted-bad-pattern control
        run: make schema-java-runs-hostile-corpus-negative-control JAVA=java JAVAC=javac
