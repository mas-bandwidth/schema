name: schema C generated CBMC readers

# THE CBMC LENS ON THE GENERATED C READERS (ideas roadmap group
# schema-per-language-lenses; Glenn, 2026-10-18). CBMC is heavy, so this gate
# runs on a nightly schedule and on demand only — never per push. The one
# budget that matters here is the solver's, not the wall clock's; the unwind
# bound is pinned in make/checks/schema-c-generated-cbmc-readers.mk.
#
# The gate links the generated readers to the C serialize runtime, which lives
# in its own repository. It is cloned below at the same pinned release the rest
# of CI uses (SERIALIZE_C_TAG), beside the checkout, exactly as ci-fast.yml and
# ci-full.yml do.

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  group: schema-c-generated-cbmc-readers-${{ github.ref }}
  cancel-in-progress: true

env:
  SERIALIZE_C_TAG: v1.10.0

jobs:
  cbmc-readers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check out the C serialize runtime (pinned release)
        run: |
          set -euo pipefail
          cd ..
          rm -rf serialize.c
          git clone --quiet --depth 1 --branch "$SERIALIZE_C_TAG" \
            https://github.com/mas-bandwidth/serialize.c.git serialize.c

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false

      # CBMC 6.6.0 is the Makefile's pinned version; install it from the
      # project's official release asset (never a mirror). The hosted runner is
      # ubuntu-24.04; the asset name carries both versions so a bump is explicit.
      - name: Install CBMC 6.6.0 (official release)
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/cbmc.deb" \
            https://github.com/diffblue/cbmc/releases/download/cbmc-6.6.0/ubuntu-24.04-cbmc-6.6.0-Linux.deb
          sudo apt-get install -y "$RUNNER_TEMP/cbmc.deb"
          cbmc --version

      # The gate builds bin/schema to regenerate the committed C output, then
      # runs CBMC (pinned above) over the readers and the planted control.
      - name: CBMC over the generated C readers
        run: make schema-c-generated-cbmc-readers

      - name: CBMC negative control (planted OOB read must be caught)
        run: make schema-c-generated-cbmc-readers-negative-control
