name: schema-shared-hostile-corpus

# THE SHARED HOSTILE-INPUT CORPUS GATE. One committed corpus of adversarial
# inputs for schema with the engine's verdicts (internal/tablewire,
# internal/tabletext), shared by every port. The corpus is raw files plus a
# directory internal/ci/hostilecorpus/corpus (raw inputs plus manifest.tsv);
# the drift gate rebuilds every verdict from the engine and fails when the
# committed manifest differs.
#
# THE SPLIT IS BY WHEN, NOT BY WHETHER. The fast part runs on every push and
# pull request: the drift gate, the reason-coverage check, and the recursive
# source inventory (so a new uncited vector fails on the push). The planted
# bad-pattern controls run on schedule and workflow_dispatch, because they
# certify the gates have blades rather than the corpus's content.
#
# THE FLEET, AND THE FORK GUARD. Every job runs on the schema fleet
# ([self-hosted, Linux, X64, fleet, schema]) and takes the pinned Go toolchain
# from ~/sdk; there is no hosted runner and no setup-go. A self-hosted runner
# executes a pull request's own code on our hardware, so every job carries
#   if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
# and a fork's pull request therefore gets no CI run at all: a maintainer runs
# it by workflow_dispatch after reading the diff, never on a hosted runner.
on:
  push:
    branches: [ main, 'sprint/**' ]
  pull_request:
    branches: [ main, 'sprint/**' ]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  GOFLAGS: -mod=readonly
  NOVA_TEST_NO_HOST: '1'
  SCHEMA_SLOW: '1'

jobs:
  drift:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, fleet, schema]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the Go toolchain is on PATH at the fleet pin
        run: |
          want=go1.26
          got=$(go version 2>/dev/null | awk '{print $3}' || true)
          if [ "$got" != "$want" ]; then
            echo "TOOL-MISSING go $want ${got:-absent} on ${RUNNER_NAME:-unknown}" >&2
            exit 1
          fi
      - name: the drift gate
        run: make schema-shared-hostile-corpus

  negative-control:
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, X64, fleet, schema]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the Go toolchain is on PATH at the fleet pin
        run: |
          want=go1.26
          got=$(go version 2>/dev/null | awk '{print $3}' || true)
          if [ "$got" != "$want" ]; then
            echo "TOOL-MISSING go $want ${got:-absent} on ${RUNNER_NAME:-unknown}" >&2
            exit 1
          fi
      - name: the planted-bad-pattern control
        run: make schema-shared-hostile-corpus-negative-control
