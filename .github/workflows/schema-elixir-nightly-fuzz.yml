name: schema elixir nightly fuzz

# THE NIGHTLY PASS (Glenn, 2026-10-18): the Elixir port's generated readers,
# load, strict read and text/JSON parse, fuzzed over every table of the schema
# corpus the Makefile's elixir generate target reads. The timed pass (its own
# ten-minute default budget) runs on a schedule and on workflow_dispatch;
# push and pull_request run only the fast arms (the planted-pattern test and
# the saved-input replay, no clock and no mutation).
#
# The same shape as certify.yml: setup-go and setup-beam pinned, the pinned
# Elixir is the one the Makefile probes for, and no fork reaches anything.

on:
  schedule:
    - cron: '43 3 * * *'
  workflow_dispatch:
    inputs:
      time:
        description: 'time budget for the timed pass (make time syntax)'
        required: false
        default: '10m'
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fast:
    name: fast (pins, planted pattern, replay)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: '29.0.5'
          elixir-version: '1.20.4'
      - name: fast arms
        run: make schema-elixir-nightly-fuzz-ci SCHEMA_ELIXIR_FUZZ_ELIXIR_VERSION=1.20.4

  nightly:
    name: nightly (timed pass)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: '29.0.5'
          elixir-version: '1.20.4'
      - name: timed pass
        run: make schema-elixir-nightly-fuzz SCHEMA_ELIXIR_FUZZ_TIME=${{ github.event.inputs.time || '10m' }}
      - name: save a finding for the replay arm
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: schema-elixir-nightly-fuzz-findings
          path: internal/ci/testdata/schema-elixir-nightly-fuzz/saved
          if-no-files-found: ignore
