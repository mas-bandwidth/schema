name: Lobster fixed proof qualification
on:
  push:
    branches: [codex/schema-lobster-fixed-proof, 'sprint/schema-lobster-fixedproof-2809.*']
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false
      - name: Install pinned Lobster runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libopengl0 libglx0
          make dist-lobster
      - name: Check action pins
        run: go test -p 4 -parallel 4 -timeout 600s ./internal/ci -run "^TestEveryActionIsPinnedToACommit$" -count=1
      - name: Build the canonical C++ fixed-form corpus
        run: make -j 4 tables-fixedform-corpus
      - name: Compare all 49 rows with the live C++ oracle
        env:
          SCHEMA_SLOW: '1'
          SCHEMA_REQUIRE_CORPUS: '1'
          SERIALIZE: ${{ github.workspace }}/build/serialize
        run: |
          export LOBSTER="$PWD/dist/lobster-v2026.8/bin/lobster"
          test -f "$SERIALIZE/serialize.h"
          go test -p 4 -parallel 4 -timeout 600s ./internal/codegen/lobstertable -run '^TestLobsterFixed(ProofSuite|ProofEvolution|NestedUnionGuardNames)' -count=1 -v
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false
      - name: Install pinned Lobster runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libopengl0 libglx0
          make dist-lobster
      - name: Check workflow, source goldens and table emitter
        env:
          LOBSTER: ${{ github.workspace }}/dist/lobster-v2026.8/bin/lobster
        run: go test -p 4 -parallel 4 -count=1 -timeout 600s ./internal/ci ./internal/goldens ./internal/codegen/lobstertable
