name: Squirrel all-port differential

# THE SQUIRREL LENS (ROADMAP.md, docs/roadmap.sexp, group
# schema-per-language-lenses). Squirrel has no static checker of its own over
# the generated output, so its lens is a differential against every other port:
# the same conformance corpus and the same random vectors through each port,
# with identical accept/refuse verdicts, refusal reasons and decoded values
# (make/schema-squirrel-all-port-differential.mk).
#
# THE SPLIT IS BY WHEN, NOT BY WHETHER:
#   * push and pull_request run the FAST half only: the comparison and its
#     planted-bad-pattern control on a t.TempDir() tree. It needs no port and
#     no toolchain, and the whole job is well inside the owner's one-minute
#     rule.
#   * the WHOLE differential builds every leg and runs every driver, so it is
#     HEAVY and runs nightly and on demand, never per commit. The wall budget
#     is the job's timeout-minutes, and the make target's own go test carries
#     -timeout 600s.

on:
  push:
    paths:
      - 'make/schema-squirrel-all-port-differential.mk'
      - '.github/workflows/schema-squirrel-all-port-differential.yml'
      - 'internal/ci/schema_squirrel_all_port_differential_test.go'
      - 'testdata/conformance/tables/**'
      - 'internal/tablewire/**'
  pull_request:
    paths:
      - 'make/schema-squirrel-all-port-differential.mk'
      - '.github/workflows/schema-squirrel-all-port-differential.yml'
      - 'internal/ci/schema_squirrel_all_port_differential_test.go'
      - 'testdata/conformance/tables/**'
      - 'internal/tablewire/**'
  schedule:
    - cron: '43 7 * * *'
  workflow_dispatch:

concurrency:
  group: squirrel-all-port-differential-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fast:
    name: fast (comparison and planted control)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false
      - name: The differential's fast half
        run: |
          export GOFLAGS=-mod=readonly
          make schema-squirrel-all-port-differential-fast

  nightly:
    name: whole differential (every registered port)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64, fleet, schema]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false
      - name: The pinned Squirrel interpreter
        run: |
          export GOFLAGS=-mod=readonly
          make dist-squirrel
      - name: The same corpus and the same vectors through every port
        run: |
          export GOFLAGS=-mod=readonly NOVA_TEST_NO_HOST=1
          time make schema-squirrel-all-port-differential
