name: schema-java generated SpotBugs gate

# The Java SpotBugs lens (ROADMAP schema-per-language-lenses): SpotBugs plus
# find-sec-bugs over the COMPILED generated Java of the schema test corpus.
#
# The whole corpus (2319 sources, ~30 s javac, ~7 min SpotBugs) is a nightly job
# with its own budget, and so is the planted control over the whole corpus. The
# per-push half is the planted control narrowed to the committed generated/java:
# the corpus target itself, with one real generated class carrying the plant.
# Fleet runners carry the pinned tools (rowan-tools fleet/packages.yml).

on:
  push:
  pull_request:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

concurrency:
  group: schema-java-spotbugs-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  planted-pattern:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: [self-hosted, Linux, X64, fleet, schema]
    timeout-minutes: 5
    env:
      GOFLAGS: -mod=readonly
      NOVA_TEST_NO_HOST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the plant in a real generated class must turn the gate red
        run: make schema-java-generated-spotbugs-gate-negative-control

  corpus:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64, fleet, schema]
    timeout-minutes: 40
    env:
      GOFLAGS: -mod=readonly
      NOVA_TEST_NO_HOST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: generate, compile and analyse the whole corpus
        run: make schema-java-generated-spotbugs-gate
      - name: the plant must turn the whole-corpus gate red
        if: always()
        run: make schema-java-generated-spotbugs-gate-negative-control SPOTBUGS_NC_CORPUS=full
      - name: keep the finding list
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: schema-java-spotbugs-findings
          path: build/schema-java-spotbugs/findings.xml
          if-no-files-found: ignore
