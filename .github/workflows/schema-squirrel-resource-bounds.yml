name: Schema squirrel resource bounds

# FORKS: this repository is PUBLIC, so a pull request from a fork must never run
# on fleet hardware. The fast job carries the fork guard; a fork's pull request
# gets no CI run, and a maintainer reruns it by workflow_dispatch after reading
# the diff.
#
# THE SQUIRREL PORT'S RESOURCE BOUNDS (docs/SPEC-TABLES.md §16.9.4): hostile
# inputs — huge counts, deep nesting, recursion, giant strings, many unknown
# fields — must cost bounded memory and time, with nesting capped at 128 and
# refused as text_limit (make/schema-squirrel-resource-bounds.mk). The gate and
# the allocation-counter proof in internal/ci/schema_squirrel_resource_bounds_test.go
# are pure Go and are the fast half; the whole campaign drives the pinned sq
# over the generated tables corpus and is nightly.
#
# THE SPLIT IS BY WHEN, NOT BY WHETHER:
#   * push and pull_request run the FAST half only: the gate and the counter
#     proof, no sq, no corpus. The whole job is inside the owner's one-minute
#     rule.
#   * the WHOLE campaign drives the pinned interpreter over the corpus, so it
#     is HEAVY and runs nightly and on demand, never per commit.

on:
  push:
    branches: [ main, dev, fixed-table-form ]
    paths:
      - 'make/schema-squirrel-resource-bounds.mk'
      - '.github/workflows/schema-squirrel-resource-bounds.yml'
      - 'internal/ci/schema_squirrel_resource_bounds_test.go'
  pull_request:
    paths:
      - 'make/schema-squirrel-resource-bounds.mk'
      - '.github/workflows/schema-squirrel-resource-bounds.yml'
      - 'internal/ci/schema_squirrel_resource_bounds_test.go'
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  fast:
    name: fast (gate and allocation counter)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, fleet, schema]
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'Tool presence check: go'
        run: |
          want="$(sed -nE 's/^go ([0-9]+\.[0-9]+)$/\1/p' go.mod)"
          got="$(go version | sed -nE 's/.*go([0-9]+\.[0-9]+).*/\1/p')"
          if [ -z "$got" ] || [ "$got" != "$want" ]; then
            echo "TOOL-MISSING go $want $got ($RUNNER_NAME)"
            exit 1
          fi
      - name: The resource bounds gate
        run: |
          export GOFLAGS=-mod=readonly
          make schema-squirrel-resource-bounds-fast

  nightly:
    name: whole campaign (hostile inputs, bounded)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64, fleet, schema]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 'Tool presence check: go'
        run: |
          want="$(sed -nE 's/^go ([0-9]+\.[0-9]+)$/\1/p' go.mod)"
          got="$(go version | sed -nE 's/.*go([0-9]+\.[0-9]+).*/\1/p')"
          if [ -z "$got" ] || [ "$got" != "$want" ]; then
            echo "TOOL-MISSING go $want $got ($RUNNER_NAME)"
            exit 1
          fi
      - name: The pinned Squirrel interpreter
        run: |
          export GOFLAGS=-mod=readonly
          make dist-squirrel
      - name: Hostile inputs on the generated tables corpus
        run: |
          export GOFLAGS=-mod=readonly NOVA_TEST_NO_HOST=1
          make schema-squirrel-resource-bounds
      - name: Negative control
        run: |
          export GOFLAGS=-mod=readonly NOVA_TEST_NO_HOST=1
          make schema-squirrel-resource-bounds-negative-control
