name: schema-luau runs hostile corpus

# The Luau port's run of the shared hostile-input corpus
# (docs/HOSTILE-CORPUS.md; schema-shared-hostile-corpus). The fast half is the
# corpus runner itself: every manifest input through the generated Luau reader,
# held to the manifest's verdict, reason and decoded-value digest. The nightly
# half repeats it with a reader bug planted in a scratch copy, so a runner that
# cannot go red is caught the same night.
#
# THIS JOB RUNS ON THE FLEET (self-hosted, schema set), never on a GitHub-hosted
# runner. Because the repository is public, a pull request from a FORK must
# never run on fleet hardware: the job carries the fork guard, so a fork's pull
# request gets no CI run here and a maintainer runs it by workflow_dispatch
# after reading the diff. The toolchains are pinned on the fleet's runners; the
# job presence-checks the pinned tools instead of installing them.

on:
  push:
    paths:
      - 'make/schema-luau-runs-hostile-corpus.mk'
      - '.github/workflows/schema-luau-runs-hostile-corpus.yml'
      - 'internal/ci/schema_luau_runs_hostile_corpus_test.go'
      - 'internal/ci/hostilecorpus/corpus/**'
      - 'internal/codegen/luau/**'
      - 'internal/codegen/luautable/**'
      - 'compiler/target_luau.go'
      - 'tables/**'
      - 'docs/HOSTILE-CORPUS.md'
  pull_request:
    paths:
      - 'make/schema-luau-runs-hostile-corpus.mk'
      - '.github/workflows/schema-luau-runs-hostile-corpus.yml'
      - 'internal/ci/schema_luau_runs_hostile_corpus_test.go'
      - 'internal/ci/hostilecorpus/corpus/**'
      - 'internal/codegen/luau/**'
      - 'internal/codegen/luautable/**'
      - 'compiler/target_luau.go'
      - 'tables/**'
      - 'docs/HOSTILE-CORPUS.md'
  schedule:
    # nightly, after the other language lenses
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  luau-hostile-corpus:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [ self-hosted, Linux, X64, fleet, schema ]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: presence check pinned go 1.26
        run: |
          want='1.26'
          got=$(go version | sed -n 's/.*go\([0-9]\+\.[0-9]\+\)\(\.\([0-9]\+\)\)\{0,1\}.*/\1/p')
          if [ "$got" != "$want" ]; then
            echo "TOOL-MISSING go $want ${got:-absent} on $RUNNER_NAME"
            exit 1
          fi
      - name: presence check pinned luau 0.741
        run: |
          want='0.741'
          if ! command -v luau >/dev/null 2>&1; then
            echo "TOOL-MISSING luau $want absent on $RUNNER_NAME"
            exit 1
          fi
          got=$(readlink -f "$(command -v luau)")
          case "$got" in
            *"/luau-$want/"*) ;;
            *) echo "TOOL-MISSING luau $want ${got:-absent} on $RUNNER_NAME"; exit 1 ;;
          esac
          echo "LUAU=$(command -v luau)" >> "$GITHUB_ENV"
      - name: every hostile input through the Luau reader
        run: make schema-luau-runs-hostile-corpus
      - name: planted reader bug must go red (nightly)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: make schema-luau-runs-hostile-corpus-negative-control
