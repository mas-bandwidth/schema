name: Release

# A RELEASE vX.Y.Z IS MADE HERE AND NOWHERE ELSE (Glenn, 2026-10-15): dispatched
# by hand with the version, on main, it runs `make release`, which refuses by
# name a version that does not parse as vMAJOR.MINOR.PATCH, one not greater
# than the newest v tag, a commit that is not on main, and a patch release
# that moves the build version's form (ir.BuildVersionForm), and, first of all,
# a commit whose compiler encodes different wire bytes than the newest v tag's
# under an equal protocol id (the previous-release differential, #463), and
# otherwise tags
# that one commit with that one annotated tag and pushes only that tag, and
# then publishes the GitHub release on that tag. The
# number is the dispatcher's choice under docs/VERSIONING.md's rules; CI,
# including a certify.yml run on the commit, must be green first.
# And the proof table must be green AT THAT COMMIT: `make release` refuses
# unless ci-full's `proof` job left a green report for it (tools/matrix
# VerifyRelease), naming the red cells when it is not.
#
# THE BINARIES come after the tag, in the `assets` job, which runs only when
# the `release` job, and so every refusal above, passed. It is a job here and
# not a workflow on `push: tags`, because a tag pushed with this run's
# github.token starts no other workflow (GitHub runs no workflow for an event
# the GITHUB_TOKEN caused, except workflow_dispatch and repository_dispatch).
# It checks out the new tag, refuses unless the tag names the commit the
# release job tagged, cross-compiles cmd/schema for six platforms with cgo off
# and -trimpath (`make release-binaries`, tools/releasebin:
# schema_<version>_<os>_<arch>.tar.gz, .zip for Windows, and SHA256SUMS), and
# uploads them to the GitHub release the release job's publish step made. It
# never creates a release: a missing one fails the job, naming that step. It
# moves no tag and decides nothing about the version.
#
#   gh workflow run release.yml --ref main -f version=vX.Y.Z

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'the release version, vMAJOR.MINOR.PATCH, greater than the newest v tag'
        required: true
        type: string

# Releases are serial: two dispatches must not both read the same newest tag.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  # the proof report: read from the ci-full run on the commit being released
  actions: read

jobs:
  release:
    runs-on: [self-hosted, Linux, X64, fleet, schema]
    # two compilers built, three C++ packet drivers built twice, the
    # conformance instances packed twice
    timeout-minutes: 20
    defaults:
      run:
        shell: go run ./tools/pgroup -- bash -e {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # every tag (the newest v tag) and main's whole ancestry are inputs
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: runner.environment == 'github-hosted'
        with:
          go-version: '1.26'
          cache: false
      # THE RELEASE LOCK: the proof report ci-full's `proof` job wrote at this
      # exact commit. `make release` refuses unless it is there and green
      # (tools/matrix VerifyRelease), naming the red cells; a commit with no
      # completed ci-full run has no report, and the release refuses on that.
      - name: the proof report at this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=$(gh run list --workflow ci-full.yml --commit "$GITHUB_SHA" --status completed --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run" ]; then echo "no completed ci-full run at $GITHUB_SHA: no proof report, and make release will refuse"; exit 0; fi
          gh run download "$run" --name proof --dir build/proof || echo "the ci-full run $run at $GITHUB_SHA kept no proof report; make release will refuse"
      - name: make the release tag
        env:
          GOFLAGS: -mod=readonly
          # passed through the environment, never interpolated into the script
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          make release RELEASE_COMMIT="$GITHUB_SHA" PROOF=build/proof/proof.json PUSH=1
      # A RELEASE IS A TAG AND A GITHUB RELEASE (Glenn, 2026-11-21: "make sure
      # schema latest releases aren't just tags, but are real github
      # releases"). v3.0.0 and v3.0.1 left here as bare tags. This step runs
      # only after `make release` pushed the tag, publishes the release on that
      # tag and never makes a tag itself (--verify-tag). The body is GitHub's
      # generated change list; the dispatcher replaces it with written notes,
      # and a release that moves a protocol id or the build version says so
      # first (docs/VERSIONING.md). If this step fails the tag is already
      # pushed and a re-dispatch refuses the version, so finish by hand:
      #
      #   gh release create vX.Y.Z --verify-tag --title vX.Y.Z --generate-notes --latest
      - name: publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          # passed through the environment, never interpolated into the script
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" --verify-tag --title "$VERSION" --generate-notes --latest

  assets:
    needs: release
    runs-on: [self-hosted, Linux, X64, fleet, schema]
    # six cross-compiled builds of one Go program, packed, and one upload
    timeout-minutes: 15
    defaults:
      run:
        shell: go run ./tools/pgroup -- bash -e {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the tag the release job just pushed
          ref: refs/tags/${{ inputs.version }}
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: runner.environment == 'github-hosted'
        with:
          go-version: '1.26'
          cache: false
      - name: build the release binaries
        env:
          GOFLAGS: -mod=readonly
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "the tag $VERSION names $(git rev-parse HEAD), not the released commit $GITHUB_SHA: no binaries"
            exit 1
          fi
          make release-binaries VERSION="$VERSION" RELEASE_BINARIES_MTIME="$(git log -1 --format=%ct HEAD)"
      # uploads only: the release job's "publish the GitHub release" step is
      # the one place a release is created
      - name: attach them to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! gh release view "$VERSION" > /dev/null 2>&1; then
            echo "no GitHub release $VERSION: the release job's \"publish the GitHub release\" step did not create it; publish it as that step's comment says, then re-run this job"
            exit 1
          fi
          gh release upload "$VERSION" build/release-binaries/schema_"$VERSION"_* build/release-binaries/SHA256SUMS --clobber
