name: Release

# A RELEASE vX.Y.Z IS MADE HERE AND NOWHERE ELSE (Glenn, 2026-10-15): dispatched
# by hand with the version, on main, it runs `make release`, which refuses by
# name a version that does not parse as vMAJOR.MINOR.PATCH, one not greater
# than the newest v tag, a commit that is not on main, and a patch release
# that moves the build version's form (ir.BuildVersionForm), and, first of all,
# a commit whose compiler encodes different wire bytes than the newest v tag's
# under an equal protocol id (the previous-release differential, #463), and
# otherwise tags
# that one commit with that one annotated tag and pushes only that tag. The
# number is the dispatcher's choice under docs/VERSIONING.md's rules; CI,
# including a certify.yml run on the commit, must be green first.
# And the proof table must be green AT THAT COMMIT: `make release` refuses
# unless ci-full's `proof` job left a green report for it (tools/matrix
# VerifyRelease), naming the red cells when it is not.
#
#   gh workflow run release.yml --ref main -f version=vX.Y.Z

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'the release version, vMAJOR.MINOR.PATCH, greater than the newest v tag'
        required: true
        type: string

# Releases are serial: two dispatches must not both read the same newest tag.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  # the proof report: read from the ci-full run on the commit being released
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    # two compilers built, three C++ packet drivers built twice, the
    # conformance instances packed twice
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # every tag (the newest v tag) and main's whole ancestry are inputs
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache: false
      # THE RELEASE LOCK: the proof report ci-full's `proof` job wrote at this
      # exact commit. `make release` refuses unless it is there and green
      # (tools/matrix VerifyRelease), naming the red cells; a commit with no
      # completed ci-full run has no report, and the release refuses on that.
      - name: the proof report at this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=$(gh run list --workflow ci-full.yml --commit "$GITHUB_SHA" --status completed --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run" ]; then echo "no completed ci-full run at $GITHUB_SHA: no proof report, and make release will refuse"; exit 0; fi
          gh run download "$run" --name proof --dir build/proof || echo "the ci-full run $run at $GITHUB_SHA kept no proof report; make release will refuse"
      - name: make the release tag
        env:
          GOFLAGS: -mod=readonly
          # passed through the environment, never interpolated into the script
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          make release RELEASE_COMMIT="$GITHUB_SHA" PROOF=build/proof/proof.json PUSH=1
