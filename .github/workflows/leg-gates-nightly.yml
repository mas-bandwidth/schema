# THE LEG GATES, NIGHTLY (2026-11-24). Moved whole out of ci-fast.yml, where
# they ran on `workflow_dispatch` only and showed SKIPPED on every push to
# main and every pull request: a job that only ever shows SKIPPED in the
# per-commit lane is not allowed (the owner, 2026-11-24: "I have zero
# patience for tests not running when they are supposed to"). Their rows do
# not fit the two-minute per-commit cap (measured on bench vision, 2026-11-24,
# a loaded host: lobster conformance 193-310 s, elixir 570 s, dart 280 s, go
# 302 s; and 547 s for lobster and 387 s for goose over 40 green fleet runs),
# so they run here, every night and on dispatch, over every leg, with no
# timeout (the nightly rule: PGROUP_GO_TEST_TIMEOUT 0). The per-commit lane
# runs each leg's fast forms: verify-leg, input-family, nightly-fast.
#
# goose-fuzz-whole is the long half of the Goose fuzz gate: every unit at
# 60000 mutants per pass. ci-fast.yml's verify-goose-fuzz runs a fixed slice
# of it at 5000 (make/verify-vm.mk verify-goose-fuzz-part-1, -part-2).
#
# docs/CI-TIERS.md names every job here (internal/ci
# TestEveryJobHasItsTierInCITiers).
name: leg gates nightly

on:
  schedule:
    - cron: '40 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

# The same sibling pins ci-full.yml, ci-fast.yml and certify.yml carry.
env:
  # the nightly rule: no go test -timeout under tools/pgroup
  PGROUP_GO_TEST_TIMEOUT: '0'
  SERIALIZE_TAG: v2.1.6
  SERIALIZE_C_TAG: v2.1.1
  SERIALIZE_GO_TAG: v2.1.1
  SERIALIZE_RS_TAG: v5.0.0
  SERIALIZE_CS_TAG: v2.2.1
  SERIALIZE_JS_TAG: v2.1.2

jobs:
  # THE TOUCHED LEG'S TWO GATES: the fixed form's bytes and §5's versioning
  # rows, one matrix row per leg so nine legs cost nine parallel jobs rather
  # than nine serial minutes. A leg gate is 5-30 s of work once its toolchain
  # is up; the rest is the floor named at the top of this file.
  #
  # BOTH GATES, per §5.9 #11 — a leg that proved its bytes and not its
  # versioning rows has proved half of what it owes. The Java leg has no
  # versioning target yet and the C++ reference IS the oracle, so those two
  # rows run what exists; ci-full.yml is unchanged for both.
  #
  # ON DISPATCH ONLY. These rows do not fit the two-minute cap (lobster 547 s
  # and goose 387 s at worst, measured below), so a push or a pull request
  # skips them (`github.event_name == 'workflow_dispatch'`), and a pull request
  # has not proved its leg's two gates when this lane is green. They run here on
  # `gh workflow run ci-fast.yml --ref <branch>`, and for every leg in
  # ci-full.yml's nightly.
  #
  # SCHEMA_REQUIRE_CORPUS=1 is inside every one of these make targets: a corpus
  # that failed to build is a failure here, never a quiet skip.
  leg-gate:
    name: fixed form + versioning (${{ matrix.leg }})
    runs-on: [ self-hosted, Linux, X64, fleet, schema ]
    # measured over 40 green runs: lobster 547 s and goose 387 s at worst
    defaults:
      run:
        shell: go run ./tools/pgroup -- bash -e -o pipefail {0}
    strategy:
      fail-fast: false
      matrix:
        leg: [cpp, go, c, rust, js, cs, java, dart, elixir, goose, lobster, luau, squirrel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # THE C++ REFERENCE IS EVERY LEG'S ORACLE: build/fixedform-corpus is dumped
      # by ../serialize, so every row clones it. The leg's own sibling runtime
      # comes with it where the probes link one.
      - name: Check out the sibling runtimes this leg needs (pinned releases)
        run: |
          set -euo pipefail
          cd ..
          # A self-hosted runner's workspace PARENT persists between runs, so a
          # previous run's clones are still sitting here. They are removed and
          # re-cloned at the pinned tag every time, never reused: the sibling
          # pins are part of what a green means.
          rm -rf serialize serialize.go serialize.c serialize.rs serialize.cs serialize.js
          git clone --quiet --depth 1 --branch "$SERIALIZE_TAG" https://github.com/mas-bandwidth/serialize.git serialize
          case "${{ matrix.leg }}" in
            go)   git clone --quiet --depth 1 --branch "$SERIALIZE_GO_TAG" https://github.com/mas-bandwidth/serialize.go.git serialize.go ;;
            c)    git clone --quiet --depth 1 --branch "$SERIALIZE_C_TAG"  https://github.com/mas-bandwidth/serialize.c.git  serialize.c ;;
            rust) git clone --quiet --depth 1 --branch "$SERIALIZE_RS_TAG" https://github.com/mas-bandwidth/serialize.rs.git serialize.rs ;;
            cs)   git clone --quiet --depth 1 --branch "$SERIALIZE_CS_TAG" https://github.com/mas-bandwidth/serialize.cs.git serialize.cs ;;
          esac

      # the runner's own pinned go already satisfies go.mod; hosted fallback only
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: runner.environment == 'github-hosted'
        with:
          go-version: '1.26'
          cache: false

      - name: where this runner keeps the Go build cache
        if: runner.environment == 'github-hosted'
        shell: bash
        run: |
          echo "GO_BUILD_CACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"
          echo "GO_CACHE_ID=$(go env GOVERSION)-$(go env GOARCH)" >> "$GITHUB_ENV"

      # On a self-hosted runner the build cache is the runner dir's own and already warm: there
      # is nothing to restore, and no stale entry can forge a green.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: runner.environment == 'github-hosted'
        with:
          path: ${{ env.GO_BUILD_CACHE }}
          key: go-build-${{ runner.os }}-${{ env.GO_CACHE_ID }}-${{ hashFiles('**/*.go', 'go.mod') }}
          restore-keys: go-build-${{ runner.os }}-${{ env.GO_CACHE_ID }}-

      # The leg's own toolchain, and only the leg's: a row that is not C# does
      # not wait for the .NET SDK. The pins are the ones ci-full.yml carries.
      - name: read the .NET SDK pin
        if: matrix.leg == 'cs'
        run: echo "DOTNET_SDK_PIN=$(cat .github/dotnet-version)" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        if: matrix.leg == 'cs' && runner.environment == 'github-hosted'
        with:
          dotnet-version: ${{ env.DOTNET_SDK_PIN }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.leg == 'js' && runner.environment == 'github-hosted'
        with:
          # the version test/conformance/js/ci.json names
          node-version: '26'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # the stable BRANCH head — the SHA freezes the action, not the compiler: rustup resolves stable at run time
        with:
          components: clippy, rustfmt
        if: matrix.leg == 'rust' && runner.environment == 'github-hosted'
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        if: matrix.leg == 'dart' && runner.environment == 'github-hosted'
        with:
          sdk: 3.13.2
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        if: matrix.leg == 'java' && runner.environment == 'github-hosted'
        with:
          distribution: temurin
          java-version: '21'
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        if: matrix.leg == 'elixir' && runner.environment == 'github-hosted'
        with:
          otp-version: '27'
          elixir-version: '1.18'

      # THE LOBSTER PIN (make/lobster.mk's dist-lobster: the release archive,
      # its sha256 refused before it is unpacked, into dist/lobster-<version>/).
      # A hosted fallback adds the two GL libraries the release binary links.
      - name: the pinned Lobster (Lobster leg)
        if: matrix.leg == 'lobster'
        run: |
          set -euo pipefail
          if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libopengl0 libglx0
          fi
          make dist-lobster

      # THE C AND C++ FORMAT GATES' formatter, pinned: clang-format from PyPI at
      # the version make/c.mk's CLANG_FORMAT_PIN names, in a venv under the
      # runner's temp so a self-hosted runner keeps nothing between runs.
      # A host without the python3-venv package (ensurepip absent) gets the
      # same venv with the system pip installing into it.
      - name: the pinned clang-format (C leg)
        if: matrix.leg == 'c'
        run: |
          set -euo pipefail
          pin="$(sed -n 's/^CLANG_FORMAT_PIN *?= *//p' make/c.mk)"
          if python3 -m venv "$RUNNER_TEMP/clang-format" >/dev/null 2>&1; then
            "$RUNNER_TEMP/clang-format/bin/pip" install --quiet "clang-format==$pin"
          else
            rm -rf "$RUNNER_TEMP/clang-format"
            python3 -m venv --without-pip "$RUNNER_TEMP/clang-format"
            python3 -m pip --python "$RUNNER_TEMP/clang-format/bin/python3" install --quiet "clang-format==$pin"
          fi
          echo "CLANG_FORMAT=$RUNNER_TEMP/clang-format/bin/clang-format" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/clang-format/bin/clang-format" --version

      # C# runs Debug here; full CI keeps both Debug and Release.
      # THE TWO GATES. The target names are the tree's own — the same ones
      # `make test` and ci-full.yml run — so a leg that renames a gate renames
      # it in one place and this row follows.
      - name: the ${{ matrix.leg }} leg's fixed form and versioning rows
        run: |
          set -euo pipefail
          case "${{ matrix.leg }}" in
            # the plain half here; the sanitized half and the clean gates
            # are leg-gate-cpp's parts below
            cpp)    make -j"$(nproc)" tables-fixedform-plain ;;
            go)     make tables-go-fixed-form tables-go-versioning ;;
            c)      make tables-c-fixedform tables-c-versioning
                    make tables-c-clean tables-c-format-negative-control SCHEMA_REQUIRE_CLANG_FORMAT=1 CLANG_FORMAT="$CLANG_FORMAT" ;;
            # the fixed form and the framing-text versioning rows, which drive
            # tables-rust-fixedform again on the build it just made; the probe
            # workspace's half is leg-gate-rust below
            rust)   make tables-rust-fixedform tables-rust-versioning-t12 RUSTUP_BIN="$(dirname "$(command -v cargo)")" ;;
            js)     make tables-js-fixed-form tables-js-versioning NODE=node ;;
            cs)     make tables-cs-leg-debug tables-cs-versioning ;;
            java)   make tables-java-fixedform JAVA=java JAVAC=javac ;;
            dart)   make tables-dart-fixed-form tables-dart-versioning DART=dart ;;
            elixir) make tables-elixir-fixed-form tables-elixir-versioning \
                      ELIXIR_BIN="$(command -v elixir)" ERL_BIN="$(dirname "$(command -v erl)")" ;;
            luau)   make dist-luau
                    make tables-luau-fixed-form tables-luau-versioning
                    make bench-luau-gate ;;
            # the Goose leg's fixed form against the reference's bytes (make/goose.mk)
            # and its versioning rows (make/goose-versioning.mk), under the pinned compiler
            goose)  make dist-goose test-goose tables-goose-versioning tables-goose-message-form ;;
            # the strict gate compiles every generated unit with zero
            # warnings; the bench legs' gate runs both runners over their
            # corpus, no clock. test-lobster, which holds the fixed form to the
            # reference's byte oracle beside both packages' suites, runs in
            # the leg-gate-lobster rows below.
            lobster) make tables-lobster-clean bench-lobster-gate ;;
            # the Squirrel card leg under the pinned interpreter
            # (make/squirrel-cards.mk). This row is dist-squirrel plus the
            # facade's unit tests. The card corpus and the three negative
            # controls are leg-gate-squirrel, one part each: the combined
            # step measured 132 s wall on run 42599413205 (job 129101577381),
            # past the two-minute per-commit cap. Each part pays dist-squirrel
            # because a job starts from a clean workspace.
            # row-seconds test 93
            squirrel) make dist-squirrel
                      make cards-squirrel-test ;;
            *)      echo "::error::no fixed-form gate is registered for leg '${{ matrix.leg }}' — add it here and in ci-full.yml"; exit 1 ;;
          esac

  # THE LOBSTER LEG'S test-lobster, IN ROWS. As one leg-gate row the Lobster
  # leg ran 128-913 s (40 runs, 2026-11-08; 462 s on amd-2, where the four
  # conformance controls were 131 s, the wire-fuzz trio 100 s, the forgery
  # fuzz 133 s, its control 145 s and the two packages' suites 152 s), and
  # the fleet kills a per-commit job at two minutes. So test-lobster's work
  # is cut into rows by make target, each a job of its own:
  #   conformance-a / -b  — the four conformance controls, two each
  #   wire-fuzz           — tables-lobster-wire-fuzz
  #   packages            — test-lobster-packages, the two packages' suites
  #                         under SCHEMA_REQUIRE_CORPUS=1 (make/lobster.mk)
  #   gates               — EVERY OTHER prerequisite of test-lobster, read
  #                         from make itself at run time, so a prerequisite
  #                         added to test-lobster lands here with no edit
  # THE FORGERY FUZZ PAIR (tables-lobster-fuzz and its control, 133 s and
  # 145 s alone) is the one thing not on this per-commit lane: a fuzz oracle
  # over the whole corpus is nightly-class work, and its control is already
  # the nightly `lobster-forgery` negative-control group. Both still run, and
  # still go red on their own failure, in `make test-lobster` on ci-full.yml's
  # go-test unit-codegen row on the nightly and on a dispatch.
  leg-gate-lobster:
    name: fixed form + versioning (lobster ${{ matrix.part }})
    runs-on: [ self-hosted, Linux, X64, fleet, schema ]
    defaults:
      run:
        shell: go run ./tools/pgroup -- bash -e -o pipefail {0}
    strategy:
      fail-fast: false
      matrix:
        part: [ conformance-a, conformance-b, conformance-c, wire-fuzz, packages, gates ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # the C++ reference dumps build/fixedform-corpus, every leg's oracle
      - name: Check out the C++ serialize reference (pinned release)
        run: |
          set -euo pipefail
          cd ..
          rm -rf serialize
          git clone --quiet --depth 1 --branch "$SERIALIZE_TAG" https://github.com/mas-bandwidth/serialize.git serialize

      # the runner's own pinned go already satisfies go.mod; hosted fallback only
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: runner.environment == 'github-hosted'
        with:
          go-version: '1.26'
          cache: false

      # THE LOBSTER PIN (make/lobster.mk's dist-lobster: the release archive,
      # its sha256 refused before it is unpacked, into dist/lobster-<version>/).
      # A hosted fallback adds the two GL libraries the release binary links.
      - name: the pinned Lobster
        run: |
          set -euo pipefail
          if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libopengl0 libglx0
          fi
          make dist-lobster

      - name: test-lobster, ${{ matrix.part }}
        env:
          PART: ${{ matrix.part }}
        run: |
          set -euo pipefail
          a="conformance-negative-control-lobster conformance-negative-control-lobster-walk"
          b="conformance-negative-control-lobster-framing conformance-negative-control-lobster-cycle"
          c="conformance-negative-control-lobster-write-refusal conformance-negative-control-lobster-write-refusal-message"
          w="tables-lobster-wire-fuzz"
          p="test-lobster-packages"
          nightly="tables-lobster-fuzz tables-lobster-fuzz-negative-control"
          case "$PART" in
            conformance-a) make toolchain-lobster $a ;;
            conformance-b) make toolchain-lobster $b ;;
            conformance-c) make toolchain-lobster $c ;;
            wire-fuzz)     make toolchain-lobster $w ;;
            packages)      make $p ;;
            gates)
              # test-lobster's prerequisites as make reads them, less the
              # rows above and the nightly pair
              # make -q exits 1 for a target that is out of date: 0 and 1 are answers,
              # any other status is make failing. The database goes to a file, so no
              # early-quitting reader can SIGPIPE make.
              db="$RUNNER_TEMP/test-lobster-db.txt"
              rc=0
              make -pq test-lobster >"$db" 2>/dev/null || rc=$?
              [ "$rc" -le 1 ] || { echo "::error::make -pq test-lobster exited $rc"; exit 1; }
              all=$(sed -n '/^test-lobster: /{s///p;q;}' "$db")
              [ -n "$all" ] || { echo "::error::make printed no prerequisites for test-lobster"; exit 1; }
              rest=""
              for t in $all; do
                case " $a $b $c $w $p $nightly " in *" $t "*) continue ;; esac
                rest="$rest $t"
              done
              echo "gates:$rest"
              # shellcheck disable=SC2086
              make $rest ;;
            *) echo "::error::leg-gate-lobster has no part '$PART'"; exit 1 ;;
          esac

  # THE RUST LEG'S VERSIONING PROBES, A ROW OF THEIR OWN. As one leg-gate row
  # the Rust leg ran the C++ oracle's build (16 s), tables-rust-fixedform in
  # debug and release (26 s) and both halves of tables-rust-versioning one
  # after another, and the fleet killed it at two minutes with the versioning
  # half a minute in (run 43608353108). The leg-gate rust arm keeps the fixed
  # form and tables-rust-versioning-t12; this job is the other half,
  # tables-rust-versioning-probes: the probe workspace's one cargo build and
  # run, in parallel with it.
  leg-gate-rust:
    name: fixed form + versioning (rust probes)
    runs-on: [ self-hosted, Linux, X64, fleet, schema ]
    defaults:
      run:
        shell: go run ./tools/pgroup -- bash -e -o pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # the C++ reference dumps build/fixedform-corpus, the probes' oracle, and
      # the probes link the Rust runtime beside this tree
      - name: Check out the C++ serialize reference and the Rust runtime (pinned releases)
        run: |
          set -euo pipefail
          cd ..
          rm -rf serialize serialize.rs
          git clone --quiet --depth 1 --branch "$SERIALIZE_TAG" https://github.com/mas-bandwidth/serialize.git serialize
          git clone --quiet --depth 1 --branch "$SERIALIZE_RS_TAG" https://github.com/mas-bandwidth/serialize.rs.git serialize.rs

      # the runner's own pinned go already satisfies go.mod; hosted fallback only
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: runner.environment == 'github-hosted'
        with:
          go-version: '1.26'
          cache: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # the stable BRANCH head — the SHA freezes the action, not the compiler: rustup resolves stable at run time
        with:
          components: clippy, rustfmt
        if: runner.environment == 'github-hosted'

      - name: the rust leg's versioning probes
        run: |
          set -euo pipefail
          make tables-rust-versioning-probes RUSTUP_BIN="$(dirname "$(command -v cargo)")"

  # THE SQUIRREL CARD LEG, IN ROWS. The leg-gate squirrel arm keeps
  # dist-squirrel and cards-squirrel-test (row-seconds test 93). These two
  # parts are the rest of that step, each its own job:
  #   conformance — cards-squirrel-conformance
  #   negative    — the three card negative controls
  # row-seconds conformance 103
  # row-seconds negative 104
  leg-gate-squirrel:
    name: fixed form + versioning (squirrel ${{ matrix.part }})
    runs-on: [ self-hosted, Linux, X64, fleet, schema ]
    defaults:
      run:
        shell: go run ./tools/pgroup -- bash -e -o pipefail {0}
    strategy:
      fail-fast: false
      matrix:
        part: [ conformance, negative ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # the C++ reference dumps build/fixedform-corpus, every leg's oracle
      - name: Check out the C++ serialize reference (pinned release)
        run: |
          set -euo pipefail
          cd ..
          rm -rf serialize
          git clone --quiet --depth 1 --branch "$SERIALIZE_TAG" https://github.com/mas-bandwidth/serialize.git serialize

      # the runner's own pinned go already satisfies go.mod; hosted fallback only
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: runner.environment == 'github-hosted'
        with:
          go-version: '1.26'
          cache: false

      - name: the pinned Squirrel
        run: |
          set -euo pipefail
          make dist-squirrel

      - name: the squirrel card leg, ${{ matrix.part }}
        env:
          PART: ${{ matrix.part }}
        run: |
          set -euo pipefail
          case "$PART" in
            conformance) make cards-squirrel-conformance ;;
            negative) make cards-squirrel-conformance-negative-control cards-squirrel-conformance-upgrade-negative-control cards-squirrel-conformance-hash-negative-control ;;
            *) echo "::error::leg-gate-squirrel has no part '$PART'"; exit 1 ;;
          esac

  # THE C++ LEG, IN PARTS. As one leg-gate row the C++ reference built both
  # halves of tables-fixedform one translation unit after another, ran them,
  # and then ran the clean, format and warnings gates, and the fleet killed it
  # at two minutes. The leg-gate cpp arm keeps the plain half; these parts are
  # the rest, each its own job:
  #   asan  — tables-fixedform-asan, the sanitized twins of the same three
  #           binaries over the same corpus
  #   clean — tables-cpp-clean and the format and warnings negative controls,
  #           with the pinned clang-format
  leg-gate-cpp:
    name: fixed form + versioning (cpp ${{ matrix.part }})
    runs-on: [ self-hosted, Linux, X64, fleet, schema ]
    defaults:
      run:
        shell: go run ./tools/pgroup -- bash -e -o pipefail {0}
    strategy:
      fail-fast: false
      matrix:
        part: [ asan, clean ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # the C++ reference dumps build/fixedform-corpus and compiles against
      # the serialize headers
      - name: Check out the C++ serialize reference (pinned release)
        run: |
          set -euo pipefail
          cd ..
          rm -rf serialize
          git clone --quiet --depth 1 --branch "$SERIALIZE_TAG" https://github.com/mas-bandwidth/serialize.git serialize

      # the runner's own pinned go already satisfies go.mod; hosted fallback only
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: runner.environment == 'github-hosted'
        with:
          go-version: '1.26'
          cache: false

      # the same pinned clang-format the leg-gate C row installs
      - name: the pinned clang-format (clean part)
        if: matrix.part == 'clean'
        run: |
          set -euo pipefail
          pin="$(sed -n 's/^CLANG_FORMAT_PIN *?= *//p' make/c.mk)"
          if python3 -m venv "$RUNNER_TEMP/clang-format" >/dev/null 2>&1; then
            "$RUNNER_TEMP/clang-format/bin/pip" install --quiet "clang-format==$pin"
          else
            rm -rf "$RUNNER_TEMP/clang-format"
            python3 -m venv --without-pip "$RUNNER_TEMP/clang-format"
            python3 -m pip --python "$RUNNER_TEMP/clang-format/bin/python3" install --quiet "clang-format==$pin"
          fi
          echo "CLANG_FORMAT=$RUNNER_TEMP/clang-format/bin/clang-format" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/clang-format/bin/clang-format" --version

      - name: the C++ leg, ${{ matrix.part }}
        env:
          PART: ${{ matrix.part }}
        run: |
          set -euo pipefail
          case "$PART" in
            asan)  make -j"$(nproc)" tables-fixedform-asan ;;
            clean) make tables-cpp-clean tables-cpp-format-negative-control tables-cpp-warnings-negative-control SCHEMA_REQUIRE_CLANG_FORMAT=1 SCHEMA_REQUIRE_CLANGXX=1 CLANG_FORMAT="$CLANG_FORMAT" ;;
            *) echo "::error::leg-gate-cpp has no part '$PART'"; exit 1 ;;
          esac


  # THE WHOLE GOOSE FUZZ GATE: every wire-fuzz unit's leg, the race test, the
  # JSON pass, and the plain, retain and message passes at 60000 mutants.
  goose-fuzz-whole:
    name: verify-leg (goose, fuzz, whole)
    runs-on: [self-hosted, Linux, X64, fleet, schema]
    defaults:
      run:
        shell: go run ./tools/pgroup -- bash -e -o pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out the packet oracle runtime (pinned release)
        run: |
          cd ..
          rm -rf serialize
          git clone --quiet --depth 1 --branch "$SERIALIZE_TAG" https://github.com/mas-bandwidth/serialize.git serialize
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: runner.environment == 'github-hosted'
        with:
          go-version: '1.26'
          cache: false
      - uses: ./.github/actions/dist-pins
        with:
          pins: goose
      - name: make verify-goose-fuzz
        run: |
          set -euo pipefail
          if [ -f /opt/nova/sdk/env.sh ]; then
            . /opt/nova/sdk/env.sh
          fi
          make verify-goose-fuzz
