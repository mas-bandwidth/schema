name: TLA nightly

# Check that each recorded TLC run still hashes the model and config it
# measured (internal/ci/strictonly_tla_test.go) and that the runner pairs
# tla/ with tla/RUNS.tsv. TLC itself runs every config as a registry `model`
# row in schema-test-nightly.yml (the note after the last step says how).
#
# THE SLOT, 04:53 UTC: after the 03:00-04:17 per-language cluster and clear of
# nightly-conformance.yml (05:41), ci-full.yml (07:10) and certify.yml (09:17).
# A schedule fires from the default branch (main) only. A pull request that
# changes this file, tla/ or the hash test runs it too, so the first landing is
# proved like every later one.

# NIGHTLY RUNS HAVE NO TIMEOUT (the owner, 2026-11-16: "Nightly runs don't
# have a timeout... they can run as long as they need."). No job or step in
# this file carries timeout-minutes, and PGROUP_GO_TEST_TIMEOUT: '0' below has
# tools/pgroup give every go test under a step -timeout=0 in place of the one
# it names, so a slow row finishes and reports every test. GitHub's default
# 360-minute job limit is the only backstop, and a job it stops reads
# cancelled, never green. internal/ci/nightly_test.go holds the rule.

on:
  # NIGHTLY AND DISPATCH ONLY (the owner, 2026-11-15: "I want everything that is not light moved to
  # nightly test now." "no exceptions."). A push or pull request runs only the fast lane, ci-fast.yml.
  schedule:
    - cron: '53 4 * * *'
  workflow_dispatch:

concurrency:
  group: tla-nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  # the nightly rule in the header: no go test -timeout under tools/pgroup
  PGROUP_GO_TEST_TIMEOUT: '0'

jobs:
  tlc:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, Linux, X64, fleet, schema]
    # measured per case by tla/README.md: 120-300s for the largest; no bound,
    # the nightly rule in the header
    defaults:
      run:
        shell: go run ./tools/pgroup -- bash -e -o pipefail {0}
    steps:
      - name: never the host named space
        # before the checkout, so tools/pgroup is not there yet
        shell: bash
        run: |
          if [ "$(hostname -s)" = space ]; then
            echo "::error::space is the game server and never runs CI"; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: runner.environment == 'github-hosted'
        with:
          go-version: '1.26'
          cache: false

      - name: the recorded model hashes are current
        run: go test ./internal/ci/... -count=1 -run TLA

      - name: the runner and its ledger pairing hold
        run: go test ./tools/tlcrun -count=1

      # TLC ITSELF RUNS THROUGH THE ONE TEST DRIVER (docs/TEST-REGISTRY.md):
      # every config under tla/ is a `model` row of test/registry/registry.jsonl,
      # and the runner's three controls and the model-check plants are `plant`
      # rows. schema-test-nightly.yml runs them all with --group nightly
      # (tools/schema-test's model-check adapter, tools/tlcrun -adapter), each
      # config judged against its tla/RUNS.tsv row exactly as tla/run-tlc.sh
      # judged it. schema-test extract holds every config to a row.
