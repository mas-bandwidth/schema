name: schema C# nightly fuzz

# Nightly fuzzing for the C# port's generated readers (Glenn, 2026-10-18):
# SharpFuzz (AFL-based) instruments the generated assembly and AFL++ drives it.
# The heavy campaign is nightly and dispatch-only; every push and pull request
# runs the fast replay of the saved corpus, which is the one-minute part.
# Both jobs run on the fleet's self-hosted schema runners only (Glenn
# 2026-10-18: all CI on the fleet), every action is pinned to a commit, and
# the .NET SDK is the one .github/dotnet-version pins. AFL++ 4.21c and SharpFuzz 2.2.0 are installed there by the
# fleet play (rowan-tools fleet/fuzz.yml); a runner without them is named by
# `make schema-cs-nightly-fuzz-tools` and the job goes red, never green.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  # No path filters: the replay must run on every change that can change a
  # generated reader, which is the generator (cmd/schema, internal/codegen and
  # the packages under it), the runtime it emits, the schema corpus and the
  # saved inputs. A filter list misses one the day a new package joins; the
  # replay is the one-minute part, so it runs on every push and pull request.
  # TestSchemaCSNightlyFuzzWorkflowReplaysEveryChange refuses a filter here.
  push:
  pull_request:

permissions:
  contents: read

jobs:
  replay:
    name: replay the saved C# fuzz corpus
    runs-on: [ self-hosted, fleet, schema ]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The fleet runner carries Go and the .NET SDK (the fleet play installs
      # both); the SDK version is the repository's pin, read from
      # .github/dotnet-version, and a runner whose SDK is not that pin is red.
      - name: the runner's .NET SDK is the pin in .github/dotnet-version
        run: |
          pin=$(cat .github/dotnet-version)
          dotnet --list-sdks | cut -d' ' -f1 | cut -d. -f1-2 | grep -qxF "${pin}" || { echo "the runner's .NET SDKs are not the pin ${pin}:"; dotnet --list-sdks; exit 1; }
      - name: replay and the planted-pattern test
        run: |
          make schema-cs-nightly-fuzz-replay
          make schema-cs-nightly-fuzz-planted-pattern

  fuzz:
    name: AFL++ campaign (${{ matrix.kind }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [ self-hosted, fleet, schema ]
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        kind: [load, text]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The fleet runner carries Go and the .NET SDK (the fleet play installs
      # both); the SDK version is the repository's pin, read from
      # .github/dotnet-version, and a runner whose SDK is not that pin is red.
      - name: the runner's .NET SDK is the pin in .github/dotnet-version
        run: |
          pin=$(cat .github/dotnet-version)
          dotnet --list-sdks | cut -d' ' -f1 | cut -d. -f1-2 | grep -qxF "${pin}" || { echo "the runner's .NET SDKs are not the pin ${pin}:"; dotnet --list-sdks; exit 1; }
      - name: the pinned fuzzers are on this runner
        run: make schema-cs-nightly-fuzz-tools
      - name: fuzz one reader kind
        run: make schema-cs-nightly-fuzz CS_FUZZ_TIME=10m CS_FUZZ_KIND=${{ matrix.kind }}
      # A FINDING (recipe exit 1) saves the minimised crashes under the port's
      # corpus directory, and the next run's checkout cleans the workspace, so
      # they are uploaded here or they reach no one. A TOOL FAILURE (exit 3)
      # uploads AFL's log and status for the same reason.
      - name: upload the minimised crashes and AFL's receipts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: schema-cs-fuzz-crashes-${{ matrix.kind }}
          path: |
            testdata/schema-cs-nightly-fuzz/corpus/${{ matrix.kind }}/
            build/schema-cs-nightly-fuzz/afl/status-${{ matrix.kind }}
            build/schema-cs-nightly-fuzz/afl/afl-${{ matrix.kind }}.log
            build/schema-cs-nightly-fuzz/afl/${{ matrix.kind }}/default/fuzzer_stats
          if-no-files-found: ignore
          retention-days: 30
      # Both plants: the central Has() bounds check, and the wire reader's list
      # clamp, which an input reaches through a list field.
      - name: the planted reader bugs must be found and replayed red
        run: make schema-cs-nightly-fuzz-dynamic-negative-control CS_FUZZ_KIND=load CS_FUZZ_PLANT_TIME=2m
