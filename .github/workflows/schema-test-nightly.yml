name: schema test nightly

# THE ONE TEST DRIVER, EVERY LANGUAGE (docs/TEST-REGISTRY.md). The registry's
# stored query `nightly` (test/registry/registry.jsonl, rec group) is every
# test of every tier in every language the registry lists. A language whose
# adapter has not landed has every one of its instances MISSING, and each is
# named red here: a new language starts fully red, and its red count is its
# remaining work. THIS RUN IS RED BY INTENT until every language has an
# adapter: its MISSING list is the per-language work list that the roadmap's
# test-registry/ci-through-driver, test-registry/union and
# test-registry/fix-missing tasks close (docs/roadmap.sexp). A red night here
# is that list, not a regression; a new red name outside it is. The
# pull-request form is ci-fast.yml's `schema-test` job,
# which runs the languages whose adapter has landed (docs/CI-TIERS.md).
#
# NIGHTLY RUNS HAVE NO TIMEOUT (the owner, 2026-11-16). No job or step here
# carries timeout-minutes, schema-test runs with --timeout 0, and
# PGROUP_GO_TEST_TIMEOUT '0' has tools/pgroup lift every go test -timeout.
# internal/ci/nightly_test.go holds the rule.

on:
  schedule:
    - cron: '41 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PGROUP_GO_TEST_TIMEOUT: '0'
  SERIALIZE_TAG: v2.1.6
  SERIALIZE_C_TAG: v2.1.1
  SERIALIZE_GO_TAG: v2.1.1
  SERIALIZE_RS_TAG: v5.0.0
  SERIALIZE_CS_TAG: v2.2.1
  SERIALIZE_JS_TAG: v2.1.2

jobs:
  nightly:
    # the schema label: the runners that carry every language's toolchain
    # (the name-buildability rows build every target's output)
    runs-on: [self-hosted, linux, x64, fleet, schema]
    defaults:
      run:
        shell: go run ./tools/pgroup -- bash -e -o pipefail {0}
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: never the host named space
        # before the checkout, so tools/pgroup is not there yet
        shell: bash
        run: |
          if [ "$(hostname -s)" = space ]; then
            echo "::error::space is the game server and never runs CI"; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # every language's leg runs here, so every pinned sibling runtime and
      # every interpreter pin is staged: a missing one fails its instances
      # by name, never skips them
      - name: the pinned sibling runtimes every leg builds against
        run: |
          set -euo pipefail
          cd ..
          rm -rf serialize serialize.go serialize.c serialize.rs serialize.cs serialize.js
          git clone --quiet --depth 1 --branch "$SERIALIZE_TAG" https://github.com/mas-bandwidth/serialize.git serialize
          git clone --quiet --depth 1 --branch "$SERIALIZE_GO_TAG" https://github.com/mas-bandwidth/serialize.go.git serialize.go
          git clone --quiet --depth 1 --branch "$SERIALIZE_C_TAG" https://github.com/mas-bandwidth/serialize.c.git serialize.c
          git clone --quiet --depth 1 --branch "$SERIALIZE_RS_TAG" https://github.com/mas-bandwidth/serialize.rs.git serialize.rs
          git clone --quiet --depth 1 --branch "$SERIALIZE_CS_TAG" https://github.com/mas-bandwidth/serialize.cs.git serialize.cs
          git clone --quiet --depth 1 --branch "$SERIALIZE_JS_TAG" https://github.com/mas-bandwidth/serialize.js.git serialize.js
      - uses: ./.github/actions/dist-pins
        with:
          pins: lua luau goose lobster
      - uses: ./.github/actions/python
      - uses: ./.github/actions/ruby
      - uses: ./.github/actions/moo
      - name: 'Tool presence check: go'
        run: |
          want="$(sed -nE 's/^go ([0-9]+\.[0-9]+)$/\1/p' go.mod)"
          got="$(go version | sed -nE 's/.*go([0-9]+\.[0-9]+).*/\1/p')"
          if [ -z "$got" ] || [ "$got" != "$want" ]; then
            echo "TOOL-MISSING go $want $got ($RUNNER_NAME)"
            exit 1
          fi
      - name: the coverage matrix, every test times every language
        run: go run ./tools/schema-test coverage
      - name: schema-test run --group nightly
        run: |
          set -euo pipefail
          if [ -f /opt/nova/sdk/env.sh ]; then
            . /opt/nova/sdk/env.sh
          fi
          # the runner's toolchains, as verify-leg hands them to make (each
          # leg's make file reads them with ?=); a missing one is left unset,
          # so that leg's build fails by name
          if command -v cargo >/dev/null; then export RUSTUP_BIN="$(dirname "$(command -v cargo)")"; fi
          if command -v erl >/dev/null && command -v elixir >/dev/null; then export BEAM_PATH="$(dirname "$(command -v erl)"):$(dirname "$(command -v elixir)")"; fi
          export DART=dart JAVA=java JAVAC=javac NODE=node
          go run ./tools/schema-test run --group nightly --timeout 0
