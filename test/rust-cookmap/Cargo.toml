# THE RUST COOK OF MAPS AND LISTS (docs/PORTING.md M19, docs/SPEC-TABLES.md
# §2.8, §2.9, §7.6): the generated cook writer lands on `schema cook`'s bytes
# for every map and list instance, in both byte orders, and a cooked map's
# Find searches the ascending entry array in place.
[package]
name = "rust-cookmap"
version = "0.0.0"
edition = "2024"

[[bin]]
name = "rust-cookmap"
path = "src/main.rs"

[dependencies]
mapdemo = { path = "../../build/tables-generated-rust/mapdemo" }
listdemo = { path = "../../build/tables-generated-rust/listdemo" }
