# THE RUST PORT'S SHARED HOSTILE-CORPUS RUNNER.
#
# The crates it reads are generated by make/schema-rust-runs-hostile-corpus.mk
# into build/rust-hostile, one crate per unit the manifest names. The generated
# trees are build output, never tracked: this manifest names where they land.
[package]
name = "rust-hostile"
version = "0.0.0"
edition = "2024"

[[bin]]
name = "rust-hostile"
path = "src/main.rs"

[dependencies]
tabledemo = { path = "../../build/rust-hostile/tabledemo" }
graphdemo = { path = "../../build/rust-hostile/graphdemo" }
blobdemo = { path = "../../build/rust-hostile/blobdemo" }
streamdemo = { path = "../../build/rust-hostile/streamdemo" }
messagedemo = { path = "../../build/rust-hostile/messagedemo" }
probe = { path = "../../build/rust-hostile/probe" }
