# THE RUST CONFORMANCE DRIVER (test/conformance/README.md).
#
# One binary answering every surface the Rust table backend implements, over
# the generated crates in build/tables-generated-rust — one crate per unit,
# because a unit is a Rust crate the way it is a C++ namespace.
[package]
name = "conformance-rust"
version = "0.0.0"
edition = "2024"

[[bin]]
name = "conformance-rust"
path = "src/main.rs"

[dependencies]
mapdemo = { path = "../../../build/tables-generated-rust/mapdemo" }
listdemo = { path = "../../../build/tables-generated-rust/listdemo" }
blobdemo = { path = "../../../build/tables-generated-rust/blobdemo" }
tblp2 = { path = "../../../build/tables-generated-rust/tblp2" }
widedemo = { path = "../../../build/tables-generated-rust/widedemo" }
scalardemo = { path = "../../../build/tables-generated-rust/scalardemo" }
scalardemo2 = { path = "../../../build/tables-generated-rust/scalardemo2" }

tblr1 = { path = "../../../build/tables-generated-rust/tblr1" }
tblr2 = { path = "../../../build/tables-generated-rust/tblr2" }
tblf1 = { path = "../../../build/tables-generated-rust/tblf1" }
tblf2 = { path = "../../../build/tables-generated-rust/tblf2" }

tbla1 = { path = "../../../build/tables-generated-rust/tbla1" }
tbla2 = { path = "../../../build/tables-generated-rust/tbla2" }
tabledemo = { path = "../../../build/tables-generated-rust/tabledemo" }
graphdemo = { path = "../../../build/tables-generated-rust/graphdemo" }
blockdemo = { path = "../../../build/tables-generated-rust/blockdemo" }
tblv1 = { path = "../../../build/tables-generated-rust/tblv1" }
tblv2 = { path = "../../../build/tables-generated-rust/tblv2" }
tblp1 = { path = "../../../build/tables-generated-rust/tblp1" }
tblp3 = { path = "../../../build/tables-generated-rust/tblp3" }

tblk1 = { path = "../../../build/tables-generated-rust/tblk1" }
tblk2 = { path = "../../../build/tables-generated-rust/tblk2" }

[profile.dev]
# the conformance corpus is small and the driver runs seven times per matrix;
# an optimised build costs nothing here and keeps the leg's wall inside the
# two-minute rule
opt-level = 1
