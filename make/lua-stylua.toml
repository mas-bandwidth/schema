# The pinned StyLua's style for every Lua file the compiler emits: the table
# runtime (internal/codegen/luatable/runtime/*.lua) and the generated modules.
# make/schema-lua-generated-luacheck-gate.mk's tables-lua-format holds the
# generated corpus to it as a no-diff check, with no allowance file: the
# generator writes this style itself. luacheck's 120 columns, two-space indent,
# and a simple `if ... then return ... end` kept on one line.
column_width = 120
line_endings = "Unix"
indent_type = "Spaces"
indent_width = 2
quote_style = "AutoPreferDouble"
call_parentheses = "Always"
collapse_simple_statement = "ConditionalOnly"
