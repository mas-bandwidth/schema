# THE RUST LEG OF THE FIXED FORM'S PAIRED BENCH (docs/SPEC-TABLES.md §3.4).
#
# The crate under measurement is the PAIRED unit — Bench.schema and
# FixedTable.schema generated as ONE unit, exactly as the C, C++, Go and C#
# paired generations are, because the fixed root reaches the packet type and
# that is what makes the compiler emit its table codec.
#
# `bench/paired` builds this with `cargo build --release` and a `--target-dir`
# under build/, then runs the binary it copies to build/paired/table-rust.
[package]
name = "benchtablesrust"
version = "0.0.0"
edition = "2024"

[[bin]]
name = "table-rust"
path = "src/main.rs"

[dependencies]
benchpaired = { path = "../../../generated/bench/paired/rust" }
# The plan-read arm (BENCH-STANDARD.md §1.10) times the unit's PACKET read too,
# so it names the stream types of the runtime the unit already links — the same
# build/ symlink generated/bench/paired/rust/Cargo.toml names, never a checkout.
serialize = { package = "serialize-official", path = "../../../build/paired/serialize.rs" }

# THE PLAN LANE (BENCH-STANDARD.md §1.10) is this same src/main.rs built a
# second time as `table-rust-plan`, with the `lineage` feature on, against the
# lineage-aware generation of the unit and the VOLD generation beside it. That
# package's manifest is BUILD WIRING written under build/ by bench/paired's
# `-mode build` (rustPlanManifest), so this tracked file never moves; the
# feature is named here only so this build knows the cfg exists.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("lineage"))'] }
