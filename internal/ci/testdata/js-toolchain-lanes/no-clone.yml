# The go-test job declares both tools but never stages serialize.js, so every
# node half that imports the runtime would fail on a clean runner.
name: fixture
on: workflow_dispatch
jobs:
  go-test:
    name: go-test (${{ matrix.group }})
    runs-on: [self-hosted, Linux, X64, fleet, schema]
    env:
      SCHEMA_REQUIRE_NODE: '1'
      SCHEMA_REQUIRE_TSC: '1'
    steps:
      - name: Check out the runtimes
        run: |
          cd ..
          git clone --quiet --depth 1 --branch "$SERIALIZE_RS_TAG" https://github.com/mas-bandwidth/serialize.rs.git serialize.rs
      - name: go test the compiler package
        env:
          SCHEMA_SLOW: '1'
        run: go test -v ./compiler
